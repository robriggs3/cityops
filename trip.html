<!--
  THIS FILE IS NOT ASSEMBLED. Hand-written on purpose, and it must stay that way.

  The trip surface used to BE this file: tools/assemble.js built src/trip-shell.html
  straight to /trip.html. It now builds trip/index.html, so the surface answers to
  the clean URL /trip/ and no .html appears anywhere in normal navigation.

  What is left here is a redirect stub, kept because two audiences still ask for
  the old address and neither of them can be edited from this repo:
    1. bookmarks and shared links people already have;
    2. robriggs3.github.io/plan-ahead/plan-ahead.html, the retired editor URL,
       whose own redirect page points at this repo's /trip.html.

  WHY IT IS OUT OF THE DRIFT GUARD, and how: the guard is "node tools/assemble.js
  && git diff --exit-code". The assembler no longer writes this path at all, so it
  cannot be regenerated and cannot drift from src/. No exclusion list is needed;
  the absence of a writer IS the exclusion. Do not teach the assembler to emit
  trip.html again, or this comment and the file it explains both go stale.

  Three redirects, in the order they can fire, because a redirect that only works
  with JavaScript is a dead link for the reader who has it turned off:
    - location.replace() in the head, first, because it is the only one that can
      carry the fragment and query across. #plan= and #city= links from a stop
      card, and the auth fragment, all live in the hash.
    - <meta http-equiv="refresh">, the no-JS fallback. It loses the hash; that is
      the cost of not having a server to send a 301 from. GitHub Pages serves
      static files only, so a real redirect status is not available here.
    - a visible link, last, for anything that honours neither.

  It deliberately reads and writes NO browser storage. It is same-origin with the
  app, and that store holds the only local copy of the data for anyone who never
  signed in.
-->
<script>
  // Same-origin, fixed destination, no user input: the hash and query are
  // carried through verbatim so a deep link survives the hop. replace() rather
  // than assign() so Back returns to wherever the reader came from instead of
  // bouncing off this page again.
  location.replace('/trip/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=/trip/">
