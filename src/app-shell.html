<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityOps</title>
<style>
/*CITYOPS_CSS*/

  /* --- app shell: multi-city switcher (index.html only) --- */
  /* Dense in-header controls: the h1 itself is the switcher trigger (chevron
     appended after it), and a translucent chip in the header's top-right opens
     Add-city. Both live inside #hdr, which the engine fully replaces
     (innerHTML='') on every render, so decorateHeader() re-appends them from
     CityOps.onStateChange every time: see the appshell script below. The
     header must not grow to fit these; they overlay the existing chrome. */
  #hdr{position:relative;}
  #hdr h1{cursor:pointer; display:inline-flex; align-items:center; gap:2px;}
  .hdr-chev{font-size:.85rem; opacity:.85;}
  .hdr-add{position:absolute; top:24px; right:20px; font:inherit; font-size:.75rem; font-weight:700;
    color:#fff; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4);
    border-radius:20px; padding:5px 11px; cursor:pointer; white-space:nowrap;}
  .hdr-add:hover{background:rgba(255,255,255,.25);}

  /* Dropdown panel: floats directly under the header (does not add header
     height); #citybar is its host, positioned inside .wrap right after
     #hdr so it shares the content width. */
  #citybar{position:relative;}
  /* Open state must be unmistakable: the panel attaches flush to the header
     (full-bleed, square top like the header itself) and a scrim dims the page
     behind it. */
  .city-scrim{position:fixed; inset:0; background:rgba(36,36,36,.35); z-index:55;}
  .citypanel{position:absolute; top:-20px; left:-16px; right:-16px; z-index:60;
    background:var(--bg-card); border:1px solid var(--border-light); border-top:none;
    border-radius:0 0 14px 14px;
    overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,.28);}
  @media (min-width: 431px){
    .citypanel{top:-24px;}
  }
  .cityrow{display:block; width:100%; font:inherit; text-align:left; color:var(--text);
    background:none; border:none; border-bottom:1px solid var(--border-light);
    padding:11px 14px; cursor:pointer;}
  .cityrow:last-of-type{border-bottom:none;}
  .cityrow:hover{background:var(--bg-softer);}
  .cityrow.current{background:var(--accent-soft);}
  .cityrow .cname{font-weight:600; font-size:.9rem;}
  .cityrow.current .cname{font-weight:800;}
  .cityrow .dot{display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-left:7px; vertical-align:middle;}
  .cityrow .cdates{display:block; font-size:.76rem; color:var(--text-3); margin-top:1px;}
  .cityact{display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px;
    background:var(--bg-softer); border-top:1px solid var(--border-light);}
  .cityact button{font:inherit; font-size:.78rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:5px 13px; cursor:pointer;}
  .cityact button:hover{border-color:var(--accent);}
  .blank-cc{width:84px; flex:0 0 auto; text-transform:uppercase;}
  .name-confirm{width:100%; font:inherit; font-size:.9rem; padding:8px 10px; margin-top:8px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal .ctl[disabled]{opacity:.45; cursor:not-allowed; border-color:var(--border-light);}
  .modal .ctl[disabled]:hover{border-color:var(--border-light);}

  /* Profile modal: chip lists reuse the pill vocabulary (rounded, bordered,
     accent ink) at tag scale, so a chip reads as an editable tag. */
  .chip-list{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0;}
  .chip-list:empty{margin:0;}
  .chipx{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600;
    color:var(--accent-hover); background:#fff; border:1.5px solid var(--border-light);
    border-radius:20px; padding:3px 6px 3px 11px;}
  .chipx button{font:inherit; font-size:.9rem; line-height:1; font-weight:700; color:var(--text-3);
    background:var(--bg-softer); border:none; border-radius:50%; width:17px; height:17px;
    padding:0; cursor:pointer;}
  .chipx button:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .chip-add{width:100%; font:inherit; font-size:.85rem; padding:6px 10px; margin-top:6px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal textarea.notes{min-height:80px; font-family:inherit; font-size:.85rem;}
  .modal .promptout{min-height:140px;}
  .hdr-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .hdr-row .date-field{flex:1 1 30%; min-width:96px;}
  @media (max-width: 430px){
    .hdr-add{top:17px; right:14px; padding:4px 9px; font-size:.7rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice"></div>
  <header id="hdr"></header>
  <div id="citybar"></div>
  <div class="toolbar" id="toolbar"></div>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="modal"></div>

<script id="app">
<!--CITYOPS_ENGINE-->
</script>

<!--CITYOPS_TEMPLATE-->

<!--CITYOPS_PROMPT-->

<script id="appshell">
(function () {
  'use strict';

  var APP_KEY = 'cityops.app.v1';

  // ---- M2 sync configuration ----
  // An empty url means sync is OFF: no sign-in button, no listeners, no
  // network calls, nothing to fail. That is the committed state; the
  // controller binds the real project values here (BINDING CHECKLIST in
  // .superpowers/sdd/m2-client-report.md). The anon key is public by design:
  // row level security is the boundary, and no other key ever reaches a
  // browser.
  var SUPA = { url: 'https://ggscdbbvqmqiyguiccrf.supabase.co', anon: 'sb_publishable_j3oRAQ-3889fkN26FtaE7g_jMyx1Lda' };

  var AUTH_KEY = 'cityops.auth.v1';   // {access_token, refresh_token, expires_at, email}
  var SYNC_KEY = 'cityops.sync.v1';   // {lastSync}
  var DEV_KEY = 'cityops.supa.dev';   // testing override: {"url":"...","anon":"..."}

  // Bundled first-run city: the same example block standalone template.html ships
  // with, so a stranger opening the app sees a working guide immediately.
  var SEED_CITY = {
    "schema": 1,
    "city": {
      "name": "Example City", "country": "XX",
      "dates": {"from": "2026-01-01", "to": "2026-01-07"},
      "accommodation": {"name": "Example Stay", "lat": 0, "lng": 0},
      "currency": {"code": "USD", "usd": 1},
      "notes": ["This is an example city. Tap the city name above, then Add city, and paste your own generated JSON."]
    },
    "sections": [
      {"id": "dinner", "label": "Dinner", "icon": "🍽️"}
    ],
    "items": [{
      "id": "example",
      "section": "dinner",
      "status": "plan",
      "day": "2026-01-02",
      "when": "First evening",
      "name": "Example Restaurant",
      "price": {"text": "~$20"},
      "note": "Replace me. This item exists so the empty template renders.",
      "hours": {"text": "12:00-23:00 daily", "class": "late"},
      "tags": [],
      "links": [],
      "place_id": null,
      "verified": null
    }]
  };

  var SEED_ID = 'example-city-2026-01-01';

  function loadExampleCity() {
    if (!has(store.cities, SEED_ID)) {
      var res = CityOps.appStore.add(store, clone(SEED_CITY), CityOps.syncKit.EPOCH);
      store = res.store;
      saveStore(store);
    }
    activateCity(SEED_ID);
  }

  function renderEmptyState() {
    var hdr = document.getElementById('hdr');
    hdr.innerHTML = '';
    hdr.appendChild(el('h1', null, 'CityOps'));
    hdr.appendChild(el('div', 'sub', 'No cities yet'));
    document.getElementById('toolbar').innerHTML = '';
    var main = document.getElementById('main');
    main.innerHTML = '';
    var card = el('div', 'card');
    card.appendChild(el('h3', null, 'Add your first city'));
    card.appendChild(el('p', null, 'Start blank, paste generated city JSON, or load the example to see how a guide works.'));
    var row = el('div', 'ctl-row');
    var add = el('button', 'ctl to-done', '+ Add city');
    add.type = 'button';
    add.onclick = openAddModal;
    var ex = el('button', 'ctl', 'Load example city');
    ex.type = 'button';
    ex.onclick = loadExampleCity;
    row.appendChild(add); row.appendChild(ex);
    card.appendChild(row);
    main.appendChild(card);
    document.getElementById('foot').textContent = 'cityops';
    if (CityOps.onStateChange) CityOps.onStateChange();
  }

  var LS = null;
  try { LS = (typeof localStorage !== 'undefined') ? localStorage : null; }
  catch (e) { LS = null; }

  var memStore = null;   // session fallback when localStorage refuses writes
  var store = null;      // {cities, order, active}
  var activeId = null;
  var panelOpen = false;
  var docClickBound = false; // outside-click listener is bound only while the panel is open

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function trim(s) { return String(s === null || s === undefined ? '' : s).replace(/^\s+|\s+$/g, ''); }

  function loadStore() {
    var raw = null;
    if (LS) { try { raw = LS.getItem(APP_KEY); } catch (e) { raw = null; } }
    var obj = null;
    if (raw) { try { obj = JSON.parse(raw); } catch (e) { obj = null; } }
    if (!obj) obj = memStore;
    return CityOps.appStore.normalize(obj);
  }

  function saveStore(s) {
    memStore = s;
    if (LS) { try { LS.setItem(APP_KEY, JSON.stringify(s)); } catch (e) {} }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function hashCity() {
    var m = String(location.hash || '').match(/^#city=(.+)$/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  function setHash(id) {
    var target = '#city=' + encodeURIComponent(id);
    if (location.hash === target) return;
    try {
      history.replaceState(null, '', location.pathname + location.search + target);
    } catch (e) {
      location.hash = target;
    }
  }

  // Switching cities means: remember it, reflect it in the URL, hand the engine
  // a fresh copy of that city's data. The engine reloads that city's own
  // cityops.<cityId>.v1 state, so progress per city is preserved untouched.
  function activateCity(id) {
    if (!id || !store.cities[id]) {
      // Empty store: render a minimal empty state instead of inventing a city.
      store.active = null;
      saveStore(store);
      activeId = null;
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      renderEmptyState();
      return;
    }
    if (id !== SEED_ID) { try { if (LS) LS.setItem('cityops.app.hadcities', '1'); } catch (e) {} }
    store.active = id;
    saveStore(store);
    activeId = id;
    setHash(id);
    // CityOps.boot -> rerender() calls CityOps.onStateChange() itself (see
    // below), which re-renders the panel and decorates the fresh header; no
    // separate call needed here.
    CityOps.boot(clone(store.cities[id]));
    // Sync baseline for this city, taken AFTER the boot and independently of
    // whether a session exists yet: at first load the session is restored after
    // the first boot, so leaving noteStateChange() to take the baseline lazily
    // would spend it on the user's first real edit and swallow that push.
    stateStamp[id] = readStateStamp(id);
  }

  // Closing on an outside click: bound to document only while the panel is
  // open, and removed as soon as it closes (by any path), so it never lingers.
  // The header counts as "inside" too: it now hosts the trigger (h1) and the
  // Add chip, and those already have their own click handlers.
  function onOutsideClick(e) {
    var bar = document.getElementById('citybar');
    var hdr = document.getElementById('hdr');
    var insideBar = bar && bar.contains(e.target);
    var insideHdr = hdr && hdr.contains(e.target);
    if (panelOpen && !insideBar && !insideHdr) {
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
    }
  }

  // Renders (or clears) the dropdown panel: city list + Remove city. Add city
  // now lives in the header chip, so the panel's own action row only has Remove.
  function renderPanel() {
    var bar = document.getElementById('citybar');
    bar.innerHTML = '';
    if (!panelOpen) {
      if (docClickBound) { document.removeEventListener('click', onOutsideClick, true); docClickBound = false; }
      return;
    }
    var scrim = el('div', 'city-scrim');
    scrim.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); };
    bar.appendChild(scrim);
    var panel = el('div', 'citypanel');
    store.order.forEach(function (id) {
      var d = store.cities[id];
      var isCurrent = id === activeId;
      var prow = el('button', 'cityrow' + (isCurrent ? ' current' : ''));
      prow.type = 'button';
      var nameWrap = el('span', 'cname', d.city.name);
      if (isCurrent) nameWrap.appendChild(el('span', 'dot'));
      prow.appendChild(nameWrap);
      prow.appendChild(el('span', 'cdates', CityOps.fmtRange(d.city.dates)));
      prow.onclick = function () {
        panelOpen = false;
        // activateCity triggers a real engine render, which calls
        // decorateHeader() via onStateChange and updates aria-expanded there;
        // only the same-city no-op path needs to refresh it itself.
        if (id === activeId) { updateHeaderExpanded(); renderPanel(); return; }
        activateCity(id);
      };
      panel.appendChild(prow);
    });
    var acts = el('div', 'cityact');
    var add = el('button', 'cityadd', '+ Add city');
    add.type = 'button';
    add.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openAddModal(); };
    acts.appendChild(add);
    var rm = el('button', null, 'Remove city');
    rm.type = 'button';
    rm.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openRemoveModal(); };
    acts.appendChild(rm);
    if (!has(store.cities, SEED_ID)) {
      var exb = el('button', null, 'Load example');
      exb.type = 'button';
      exb.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); loadExampleCity(); };
      acts.appendChild(exb);
    }
    var pf = el('button', null, 'Profile');
    pf.type = 'button';
    pf.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openProfileModal(); };
    acts.appendChild(pf);
    // Sync control: absent entirely when no project is configured, so an
    // unconfigured build shows no sign-in affordance it cannot honour.
    if (syncOn()) {
      var sy = el('button', null, session ? ('Sync: ' + (syncEmail || 'signed in')) : 'Sign in to sync');
      sy.type = 'button';
      sy.onclick = function () {
        panelOpen = false;
        updateHeaderExpanded();
        renderPanel();
        if (session) openSyncModal(); else openSignInModal();
      };
      acts.appendChild(sy);
    }
    panel.appendChild(acts);
    bar.appendChild(panel);

    if (!docClickBound) {
      // Deferred: adding the listener synchronously would let it observe the
      // very click (bubbling to document) that just opened the panel.
      setTimeout(function () { document.addEventListener('click', onOutsideClick, true); }, 0);
      docClickBound = true;
    }
  }

  // Just refreshes the aria-expanded flag on the current h1 in place. Toggling
  // the panel does not itself trigger an engine render, so this must NOT go
  // through decorateHeader() below (that appends the chevron/chip afresh and
  // would duplicate them on an h1 the engine hasn't wiped since last time).
  function updateHeaderExpanded() {
    var h1 = document.querySelector('#hdr h1');
    if (h1) h1.setAttribute('aria-expanded', String(panelOpen));
    var chev = document.querySelector('#hdr .hdr-chev');
    if (chev) chev.textContent = panelOpen ? ' ▴' : ' ▾';
  }

  // Re-decorates the freshly rendered #hdr (the engine wipes it with
  // innerHTML='' on every render): appends the chevron to h1 and wires it as
  // the switcher trigger, and appends the header's + Add chip. Called once
  // per engine render via CityOps.onStateChange: never from a plain
  // open/close toggle, which would duplicate these onto the still-live h1.
  function decorateHeader() {
    var h = document.getElementById('hdr');
    if (!h) return;
    var h1 = h.querySelector('h1');
    if (!h1) return;
    h1.setAttribute('role', 'button');
    h1.setAttribute('tabindex', '0');
    h1.setAttribute('aria-expanded', String(panelOpen));
    h1.appendChild(el('span', 'hdr-chev', panelOpen ? ' ▴' : ' ▾'));
    h1.onclick = function () {
      panelOpen = !panelOpen;
      updateHeaderExpanded();
      renderPanel();
    };
    h1.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h1.click(); }
    };
    var add = el('button', 'hdr-add', '+ Add city');
    add.type = 'button';
    add.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openAddModal();
    };
    h.appendChild(add);
  }

  // ---- interest profile (app-only data; the engine owns its shape) ----
  // A chip list: Enter adds, each chip's x removes. get() also returns whatever
  // is still sitting unentered in the input, so a typed interest is never
  // silently dropped by pressing Save instead of Enter.
  function chipField(box, label, values, placeholder) {
    box.appendChild(el('p', 'diff', label));
    var items = values.slice();
    var list = el('div', 'chip-list');
    box.appendChild(list);
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'chip-add';
    inp.placeholder = placeholder;
    inp.setAttribute('aria-label', label);
    box.appendChild(inp);

    function draw() {
      list.innerHTML = '';
      items.forEach(function (v, i) {
        var chip = el('span', 'chipx');
        chip.appendChild(document.createTextNode(v));
        var x = el('button', null, '×');
        x.type = 'button';
        x.setAttribute('aria-label', 'Remove ' + v);
        x.onclick = function () { items.splice(i, 1); draw(); };
        chip.appendChild(x);
        list.appendChild(chip);
      });
    }
    function add() {
      var v = trim(inp.value);
      inp.value = '';
      if (!v) return;
      items.push(v);
      // normalize does the trimming, case-insensitive dedupe and the cap, so
      // the chips on screen are exactly what a Save would store.
      items = CityOps.profile.normalize({ interests: items }).interests;
      draw();
    }
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); add(); }
    };
    draw();
    return { get: function () { return items.concat(trim(inp.value) ? [trim(inp.value)] : []); } };
  }

  function openProfileModal() {
    var m = modalShell('Your interest profile');
    m.box.appendChild(el('p', 'diff', 'What you seek out in a new city, and what you never want suggested. ' +
      'Build my prompt hands this to your own AI so it finds places that match you. ' +
      'Keep it short: 5 to 12 interests research better than 30.'));
    var p = CityOps.profile.normalize(store.profile);
    var interests = chipField(m.box, 'Interests, in priority order', p.interests, 'Add an interest, then press Enter');
    var avoid = chipField(m.box, 'Avoid: never suggest these', p.avoid, 'Add something to avoid, then press Enter');
    m.box.appendChild(el('p', 'diff', 'Notes: anything that changes what a good pick means (diet, mobility, budget, who is along).'));
    var ta = document.createElement('textarea');
    ta.className = 'notes';
    ta.value = p.notes;
    ta.setAttribute('aria-label', 'Profile notes');
    m.box.appendChild(ta);
    m.box.appendChild(el('p', 'diff', (session && session.access_token)
      ? 'Saved to your account.'
      : 'Saved in this browser. Sign in to sync (city menu) to carry your profile across devices.'));
    var row = el('div', 'mrow');
    var save = el('button', 'ctl to-done', 'Save');
    save.type = 'button';
    save.onclick = function () {
      var next = CityOps.profile.normalize({
        interests: interests.get(), avoid: avoid.get(), notes: ta.value
      });
      next.updated = new Date().toISOString();
      store.profile = next;
      saveStore(store);
      schedulePush('profile');
      m.close();
      showSyncNotice('Profile saved.');
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(save);
    row.appendChild(cancel);
    if (!has(store.cities, SEED_ID)) {
      var ex = el('button', 'ctl', 'Load example city');
      ex.type = 'button';
      ex.onclick = function () { m.close(); loadExampleCity(); };
      row.appendChild(ex);
    }
    m.box.appendChild(row);
  }

  // PROMPT.md, embedded by the assembler as a text/plain block so the prompt
  // builders work offline. Same escaping contract as the guide template: the
  // assembler writes `<\/script`, this reverses exactly one layer.
  function promptTemplateText() {
    var node = document.getElementById('prompt-template');
    if (!node) return null;
    var raw = node.textContent;
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    return raw.replace(/<\\\/script/g, '<' + '/script');
  }

  function openAddModal() {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, 'Add a city'));
    box.appendChild(el('p', 'diff', 'Start blank now and fill it with generated data later, or paste ready-made city JSON below.'));
    var whereItGoes = (session && session.access_token)
      ? 'New cities save to your account and sync to your other devices.'
      : 'Saved in this browser. Sign in to sync (city menu) to carry cities across devices.';

    var brow = el('div', 'mrow');
    var bn = document.createElement('input');
    bn.type = 'text'; bn.className = 'date-field'; bn.placeholder = 'City name';
    var bc = document.createElement('input');
    bc.type = 'text'; bc.className = 'date-field blank-cc'; bc.placeholder = 'Country'; bc.maxLength = 3;
    brow.appendChild(bn); brow.appendChild(bc);
    box.appendChild(brow);
    var drow = el('div', 'mrow');
    var bf = document.createElement('input'); bf.type = 'date'; bf.className = 'date-field';
    var bt2 = document.createElement('input'); bt2.type = 'date'; bt2.className = 'date-field';
    drow.appendChild(el('span', 'diff', 'From')); drow.appendChild(bf);
    drow.appendChild(el('span', 'diff', 'To')); drow.appendChild(bt2);
    box.appendChild(drow);
    // Optional header fields: they only exist to fill the prompt's Trip details
    // block, so a blank city ignores them entirely.
    function optField(ph) {
      var i = document.createElement('input');
      i.type = 'text'; i.className = 'date-field'; i.placeholder = ph;
      i.setAttribute('aria-label', ph);
      return i;
    }
    var hrow = el('div', 'hdr-row');
    var bacc = optField('Accommodation');
    var barr = optField('Arrival');
    var bdep = optField('Departure');
    hrow.appendChild(bacc); hrow.appendChild(barr); hrow.appendChild(bdep);
    box.appendChild(hrow);
    var bmsg = el('div', 'diff', '');
    box.appendChild(bmsg);
    var brow2 = el('div', 'mrow');
    var bcreate = el('button', 'ctl to-done', 'Create blank city');
    bcreate.type = 'button';
    box.appendChild(brow2);
    brow2.appendChild(bcreate);

    // Build my prompt: PROMPT.md with this city's header and the interest
    // profile filled in, copied out for the traveler's own AI. No network, no
    // AI call from the app: the traveler pastes the JSON back into this modal.
    var promptTa = null;
    function showPromptFallback(text) {
      if (!promptTa) {
        promptTa = document.createElement('textarea');
        promptTa.className = 'promptout';
        promptTa.readOnly = true;
        promptTa.setAttribute('aria-label', 'Generated prompt');
        box.insertBefore(promptTa, bmsg);
      }
      promptTa.value = text;
      bmsg.textContent = 'Could not reach the clipboard. The prompt is selected above: copy it, ' +
        'paste it into Claude or ChatGPT, then paste the JSON it returns below.';
      try { promptTa.focus(); promptTa.select(); } catch (e) {}
    }
    function buildPromptText() {
      if (!trim(bn.value) || !bf.value || !bt2.value) {
        bmsg.textContent = 'Fill city name and dates first';
        return null;
      }
      var tpl = promptTemplateText();
      if (!tpl) {
        bmsg.textContent = 'This build has no prompt template embedded. Use PROMPT.md from the repo.';
        return null;
      }
      return CityOps.promptKit.buildCityPrompt(tpl, {
        name: trim(bn.value), country: trim(bc.value), from: bf.value, to: bt2.value,
        accommodation: trim(bacc.value), arrival: trim(barr.value), departure: trim(bdep.value)
      }, store.profile);
    }
    var bprompt = el('button', 'ctl', 'Build my prompt');
    bprompt.type = 'button';
    bprompt.onclick = function () {
      var text = buildPromptText();
      if (text === null) return;
      var wrote = null;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) wrote = navigator.clipboard.writeText(text);
      } catch (e) { wrote = null; }
      if (wrote && typeof wrote.then === 'function') {
        wrote.then(function () {
          bmsg.textContent = 'Copied. Paste into Claude or ChatGPT, then paste the JSON it returns below.';
        }, function () { showPromptFallback(text); });
      } else {
        showPromptFallback(text);
      }
    };
    brow2.appendChild(bprompt);
    var bdl = el('button', 'ctl', 'Download prompt.md');
    bdl.type = 'button';
    bdl.onclick = function () {
      var text = buildPromptText();
      if (text === null) return;
      var blob = new Blob([text], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'prompt.md';
      document.body.appendChild(a);
      a.click();
      a.remove();
      var freeUrl = a.href;
      setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
      bmsg.textContent = 'Downloaded prompt.md. Paste it into Claude or ChatGPT, then paste the JSON it returns below.';
    };
    brow2.appendChild(bdl);
    box.appendChild(el('p', 'diff', CityOps.profile.isEmpty(store.profile)
      ? 'Build my prompt writes PROMPT.md with this header filled in. Add interests in Profile (city menu) and it will ask your AI for a matching ninth section too.'
      : 'Build my prompt writes PROMPT.md with this header and your interest profile filled in.'));

    box.appendChild(el('p', 'diff', 'Or paste schema v1 city JSON (the output of PROMPT.md). ' + whereItGoes));
    var ta = document.createElement('textarea');
    box.appendChild(ta);
    var msg = el('div', 'diff', '');
    box.appendChild(msg);
    var row = el('div', 'mrow');
    box.appendChild(row);

    bcreate.onclick = function () {
      var data;
      try { data = CityOps.appStore.blankCity(bn.value, bc.value, bf.value, bt2.value); }
      catch (e) { bmsg.textContent = 'Invalid: ' + e.message; return; }
      handleParsed(data);
    };

    function close() { wrap.remove(); }

    // `clearOverride`: only the Replace path passes this. Replacing a city with
    // freshly pasted file data must win outright; a stale in-app dataOverride
    // from before the replace would otherwise keep masking the new data via
    // effectiveData(), so the city's own store is cleared right after the
    // replace commits (Keep-both never needs this: it derives a brand-new id
    // with no prior state to clear).
    function commit(data, clearOverride) {
      var res = CityOps.appStore.add(store, data);
      store = res.store;
      saveStore(store);
      close();
      if (clearOverride) {
        var s = CityOps.makeStore(res.cityId, LS);
        var st = s.load();
        st.dataOverride = null;
        s.save(st);
      }
      activateCity(res.cityId);
      // A pasted, replaced or blank city is a local data edit: queue the upsert.
      schedulePush('data', res.cityId);
    }

    function askDuplicate(data, id) {
      msg.textContent = '"' + store.cities[id].city.name + '" is already saved under the id ' +
        id + '. Replace it with the pasted data, or keep both?';
      row.innerHTML = '';
      var rep = el('button', 'ctl', 'Replace');
      rep.type = 'button';
      rep.onclick = function () { commit(data, true); };
      var both = el('button', 'ctl', 'Keep both');
      both.type = 'button';
      both.onclick = function () {
        var copy = clone(data);
        var guard = 0;
        do {
          copy.city.name = CityOps.appStore.keepBothName(copy.city.name);
          guard++;
        } while (has(store.cities, CityOps.cityId(copy)) && guard < 20);
        if (has(store.cities, CityOps.cityId(copy))) {
          // Fail closed: 20 renames were not enough to escape the collision.
          // Do not commit a city that would silently overwrite another one.
          msg.textContent = 'Could not find a free name for "' + copy.city.name +
            '" after 20 tries. Rename the city in the pasted JSON and try again.';
          return;
        }
        commit(copy);
      };
      var cancel = el('button', 'ctl', 'Cancel');
      cancel.type = 'button';
      cancel.onclick = close;
      row.appendChild(rep);
      row.appendChild(both);
      row.appendChild(cancel);
    }

    function handleParsed(data) {
      var id = CityOps.cityId(data);
      if (has(store.cities, id)) { askDuplicate(data, id); return; }
      commit(data);
    }

    var apply = el('button', 'ctl', 'Apply');
    apply.type = 'button';
    apply.onclick = function () {
      var res = CityOps.parse(ta.value);
      if (!res.data) { msg.textContent = 'Invalid:\n' + res.errors.join('\n'); return; }
      handleParsed(res.data);
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = close;
    row.appendChild(apply);
    row.appendChild(cancel);

    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) close(); };
    host.appendChild(wrap);
    bn.focus();
  }

  function openRemoveModal() {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var cur = store.cities[activeId];
    if (!cur) return;
    var name = cur.city.name;
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, 'Remove ' + name));
    box.appendChild(el('p', 'diff', 'This deletes the city and its saved progress on this device. ' +
      'Type the city name exactly to enable the Remove button.'));
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'name-confirm';
    inp.placeholder = name;
    inp.setAttribute('aria-label', 'Type the city name to confirm removal');
    box.appendChild(inp);
    var row = el('div', 'mrow');
    var rm = el('button', 'ctl to-archived', 'Remove');
    rm.type = 'button';
    rm.disabled = true;
    rm.title = 'Type "' + name + '" to enable';
    inp.oninput = function () {
      var ok = inp.value === name;
      rm.disabled = !ok;
      rm.title = ok ? '' : 'Type "' + name + '" to enable';
    };
    rm.onclick = function () {
      if (inp.value !== name) return;
      var gone = activeId;
      store = CityOps.appStore.remove(store, gone);
      if (LS) { try { LS.removeItem('cityops.' + gone + '.v1'); } catch (e) {} }
      // Removal does not propagate to other devices in v1 (see the report), but
      // it must not be undone here either: this device refuses to pull the city
      // back for the rest of the session.
      removedIds[gone] = 1;
      delete stateStamp[gone];
      // An explicit removal means the user owns this device's city list now:
      // never auto-seed the example again here (Load example stays available).
      try { if (LS) LS.setItem('cityops.app.hadcities', '1'); } catch (e) {}
      saveStore(store);
      wrap.remove();
      if (store.order.length) { activateCity(store.active); }
      else { activateCity(null); }
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = function () { wrap.remove(); };
    row.appendChild(rm);
    row.appendChild(cancel);
    box.appendChild(row);
    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    host.appendChild(wrap);
    inp.focus();
  }

  // ==========================================================================
  // M2: Supabase sync. Local-first, newer-wins per city.
  // ==========================================================================
  // Everything below is inert unless SUPA.url is bound: syncOn() gates the UI,
  // the listeners and every single fetch, so with no config the app behaves
  // exactly as it did in M1. Network failure is always a silent no-op (a
  // console.warn at most): the app must work identically offline, mid-flight
  // and signed out. The decision logic lives in CityOps.syncKit (pure, unit
  // tested); only transport, storage and UI live here.

  var session = null;          // {access_token, refresh_token, expires_at, email}
  var syncEmail = '';
  var lastSyncIso = null;
  var removedIds = {};         // cities removed on this device this session
  var stateStamp = {};         // cityId -> state.updated already seen (push trigger baseline)
  var pushQueueData = {};      // cityId -> pending data push
  var pushQueueState = {};     // cityId -> pending state push
  var pushTimer = null;
  var refreshInFlight = null;
  var pullInFlight = false;
  var lastPullAt = 0;

  function syncOn() {
    return !!(SUPA.url && SUPA.anon && typeof fetch === 'function');
  }

  function warn(what, e) {
    if (typeof console !== 'undefined' && console && console.warn) {
      console.warn('cityops sync: ' + what + (e && e.message ? ' (' + e.message + ')' : ''));
    }
  }

  // Testing override: localStorage cityops.supa.dev = {"url":"...","anon":"..."}
  // points this device at a scratch project without touching the committed
  // config. https only, with an explicit exception for a loopback host, so a
  // bearer token can never ride to a remote origin over plain http.
  function readDevConfig() {
    if (!LS) return;
    var raw = null;
    try { raw = LS.getItem(DEV_KEY); } catch (e) { return; }
    if (!raw) return;
    var cfg = null;
    try { cfg = JSON.parse(raw); } catch (e2) { warn('dev config is not valid JSON'); return; }
    if (!cfg || typeof cfg.url !== 'string' || typeof cfg.anon !== 'string' || !cfg.anon) return;
    var url = cfg.url.replace(/\/+$/, '');
    // Tight enough to reject userinfo, a query string or a path riding along
    // with the host: only a bare Supabase project host, or loopback for local
    // testing. A bearer token must never be sent anywhere else.
    var okScheme = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url) ||
      /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url);
    if (!okScheme) { warn('dev config url rejected (https project host, or http on localhost, only)'); return; }
    SUPA = { url: url, anon: cfg.anon };
  }

  // ---- session storage ----
  function loadSession() {
    if (!LS) return null;
    var raw = null;
    try { raw = LS.getItem(AUTH_KEY); } catch (e) { return null; }
    if (!raw) return null;
    var s = null;
    try { s = JSON.parse(raw); } catch (e2) { return null; }
    if (!s || typeof s.access_token !== 'string' || typeof s.refresh_token !== 'string') return null;
    return s;
  }

  function saveSession(s) {
    session = s;
    syncEmail = (s && s.email) || '';
    if (!LS) return; // private mode: the session holds for this tab only
    try {
      if (s) LS.setItem(AUTH_KEY, JSON.stringify(s));
      else LS.removeItem(AUTH_KEY);
    } catch (e) {}
  }

  function loadSyncMeta() {
    if (!LS) return;
    try {
      var raw = LS.getItem(SYNC_KEY);
      if (!raw) return;
      var m = JSON.parse(raw);
      if (m && typeof m.lastSync === 'string') lastSyncIso = m.lastSync;
    } catch (e) {}
  }

  function stampSync() {
    lastSyncIso = new Date().toISOString();
    if (!LS) return;
    try { LS.setItem(SYNC_KEY, JSON.stringify({ lastSync: lastSyncIso })); } catch (e) {}
  }

  // The one path that signs a user out on its own: a refresh token the server
  // refuses. Everything transient (offline, 5xx) keeps the session. Once
  // dropped, ensureToken returns null forever after, so nothing can loop.
  function dropSession(msg) {
    saveSession(null);
    stateStamp = {};
    pushQueueData = {};
    pushQueueState = {};
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (msg) showSyncNotice(msg);
    renderPanel();
  }

  // The engine owns #notice and rewrites it on every render (empty, or the
  // private-mode warning). A sync notice is appended to whatever the engine
  // just wrote and lives until the next render restores the engine's own text.
  // Deliberately transient: no new DOM, nothing for the user to dismiss.
  function showSyncNotice(text) {
    var n = document.getElementById('notice');
    if (!n || !text) return;
    var base = n.textContent || '';
    n.textContent = base ? base + ' ' + text : text;
  }

  function cleanHash() {
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {
      // No history API: leave the hash rather than write a new history entry
      // via location.hash = '' (which some browsers treat as a navigation).
    }
  }

  // Runs BEFORE the #city= hash is read. A magic-link return replaces the whole
  // fragment with the GoTrue session, so there is no city hash left to protect;
  // the fragment is cleared immediately (access tokens must not sit in the
  // address bar or in history), and activateCity() writes #city= back a moment
  // later. Returns a one-line notice to show after the first render, or null.
  function consumeAuthHash() {
    if (!syncOn()) return null;
    var h = String(location.hash || '');
    if (!h) return null;
    if (h.indexOf('access_token=') === -1) {
      // GoTrue reports a dead or already-used link as an error fragment.
      if (/[#&]error=/.test(h) && h.indexOf('error_description=') !== -1) {
        cleanHash();
        return 'That sign-in link did not work. Send yourself a new one.';
      }
      return null;
    }
    var s = CityOps.syncKit.parseAuthHash(h, Date.now());
    cleanHash();
    if (!s) return 'That sign-in link was incomplete. Send yourself a new one.';
    saveSession(s);
    fetchUserEmail();
    return 'Signed in. Syncing your cities.';
  }

  // Resolves to a usable access token, or null when there is nothing to sync
  // with. Refreshes inside the 60s window (or when forced by a 401), with one
  // shared in-flight refresh so a burst of calls cannot stampede GoTrue.
  function ensureToken(force) {
    if (!syncOn() || !session) return Promise.resolve(null);
    if (!force && !CityOps.syncKit.sessionExpiringSoon(session, Date.now())) {
      return Promise.resolve(session.access_token);
    }
    if (refreshInFlight) return refreshInFlight;
    refreshInFlight = fetch(SUPA.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPA.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function (r) {
      if (r.status === 400 || r.status === 401 || r.status === 403) return 'dead';
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (j) {
      if (j === 'dead' || !j || !j.access_token || !j.refresh_token) {
        dropSession('Sync signed out. Sign in again to resume syncing.');
        return null;
      }
      saveSession({
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        token_type: j.token_type || 'bearer',
        expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)),
        email: (j.user && j.user.email) || syncEmail || ''
      });
      return session.access_token;
    }).catch(function (e) {
      // Offline or a transient server problem: keep the session, skip this
      // round. Only an explicit rejection above signs the user out.
      warn('token refresh failed', e);
      return null;
    }).then(function (tok) { refreshInFlight = null; return tok; });
    return refreshInFlight;
  }

  // Authenticated call against the project. Resolves to parsed JSON, or null
  // when there is no usable token. Rejects on transport/HTTP errors so every
  // caller can swallow them in one place.
  function api(path, opts, retried) {
    return ensureToken(false).then(function (tok) {
      if (!tok) return null;
      var o = opts || {};
      var headers = { 'apikey': SUPA.anon, 'Authorization': 'Bearer ' + tok };
      if (o.headers) {
        Object.keys(o.headers).forEach(function (k) { headers[k] = o.headers[k]; });
      }
      return fetch(SUPA.url + path, { method: o.method || 'GET', headers: headers, body: o.body })
        .then(function (r) {
          if (r.status === 401 && !retried) {
            // Rejected before its stated expiry: refresh once, retry once, then
            // give up for this round. Never a retry loop.
            return ensureToken(true).then(function (t2) {
              return t2 ? api(path, opts, true) : null;
            });
          }
          if (!r.ok) throw new Error('http ' + r.status);
          if (r.status === 204) return null;
          var ct = (r.headers && r.headers.get) ? (r.headers.get('content-type') || '') : '';
          return ct.indexOf('json') === -1 ? null : r.json();
        });
    });
  }

  // ---- per-city state access (sync side) ----
  // The booted city's state lives in the engine's own store, which keeps an
  // in-memory copy; reading its localStorage key directly would miss unsaved
  // private-mode state, so the live state wins for the active city.
  function readStateFull(id) {
    if (id === activeId) {
      var live = CityOps.liveState();
      if (live) return live;
    }
    if (!LS) return null;
    try {
      var raw = LS.getItem('cityops.' + id + '.v1');
      return raw ? CityOps.normalizeState(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function readStateStamp(id) {
    var st = readStateFull(id);
    return (st && typeof st.updated === 'string') ? st.updated : null;
  }

  // Writes a pulled state verbatim, keeping the remote `updated` stamp.
  // makeStore().save() re-stamps with now, which would make a pull look like a
  // local edit and push it straight back, so the pull path never uses it. The
  // active city is re-booted right after, which builds a fresh store that reads
  // this value back. Returns false in private mode (nothing is persisted there,
  // so pulled state is skipped rather than half applied).
  function writeStateRaw(id, state) {
    if (!LS) return false;
    try { LS.setItem('cityops.' + id + '.v1', JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  // ---- push ----
  function pushNow(kind, entries) {
    if (!syncOn() || !session || !entries || !entries.length) return;
    var field = (kind === 'state') ? 'state' : 'data';
    var table = (kind === 'state') ? 'city_state' : 'cities';
    var rows = CityOps.syncKit.buildRows(field, entries);
    if (!rows.length) return;
    api('/rest/v1/' + table + '?on_conflict=user_id,city_id', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(rows)
    }).then(function () { stampSync(); })
      .catch(function (e) { warn('push ' + kind + ' failed', e); });
  }

  // 2s debounce per the spec, shared by both tables: a burst of taps produces
  // one upsert. A failed flush is NOT retried on a timer; local stays newer
  // than the server, so the next pull's reconcile pushes it. Local is the queue.
  function schedulePush(kind, id) {
    if (!syncOn() || !session || !id) return;
    if (kind === 'state') pushQueueState[id] = 1; else pushQueueData[id] = 1;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(flushPush, 2000);
  }

  function flushPush() {
    pushTimer = null;
    var dataEntries = [];
    Object.keys(pushQueueData).forEach(function (id) {
      if (has(store.cities, id)) {
        dataEntries.push({ cityId: id, payload: store.cities[id], updatedAt: store.updatedAt[id] });
      }
    });
    pushQueueData = {};
    var stateEntries = [];
    Object.keys(pushQueueState).forEach(function (id) {
      var st = readStateFull(id);
      if (st && st.updated) stateEntries.push({ cityId: id, payload: st, updatedAt: st.updated });
    });
    pushQueueState = {};
    pushNow('data', dataEntries);
    pushNow('state', stateEntries);
  }

  // Fires the debounced push immediately instead of waiting out the 2s timer:
  // the tab is about to go away (hidden or unloading), and a queued edit that
  // never flushes is an edit that never syncs. Same guards schedulePush uses,
  // since this only matters when a debounce could actually be pending.
  function flushPendingPush() {
    if (!syncOn() || !session || !pushTimer) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    flushPush();
  }

  // Chained onto the engine's state-change hook. A push fires only when the
  // state stamp actually moved: the first render after a boot just records a
  // baseline, because pushing there would upload this device's state before the
  // first pull has had a chance to reconcile it against newer remote state.
  function noteStateChange() {
    if (!syncOn() || !session || !activeId) return;
    var st = CityOps.liveState();
    if (!st) return;
    var stamp = st.updated || null;
    if (!has(stateStamp, activeId)) { stateStamp[activeId] = stamp; return; }
    if (stateStamp[activeId] === stamp) return;
    stateStamp[activeId] = stamp;
    schedulePush('state', activeId);
  }

  // ---- pull ----
  function pullAll(force) {
    if (!syncOn() || !session || pullInFlight) return Promise.resolve(false);
    var now = Date.now();
    if (!force && now - lastPullAt < 60000) return Promise.resolve(false);
    pullInFlight = true;
    lastPullAt = now;
    return Promise.all([
      api('/rest/v1/cities?select=city_id,data,updated_at'),
      api('/rest/v1/city_state?select=city_id,state,updated_at')
    ]).then(function (res) {
      // A null half means "no usable token"; an empty table is []. Never treat
      // an unanswered read as an empty server, which would push everything up.
      if (!res || !Array.isArray(res[0]) || !Array.isArray(res[1])) return false;
      applyPull(res[0], res[1]);
      stampSync();
      return true;
    }).catch(function (e) {
      warn('pull failed', e);
      return false;
    }).then(function (ok) { pullInFlight = false; return ok; });
  }

  function stampMap(rows, byId) {
    var stamps = {};
    (rows || []).forEach(function (r) {
      if (!r || typeof r.city_id !== 'string' || !r.city_id) return;
      byId[r.city_id] = r;
      stamps[r.city_id] = (typeof r.updated_at === 'string') ? r.updated_at : null;
    });
    return stamps;
  }

  function applyPull(cityRows, stateRows) {
    var remoteData = {}, remoteState = {};
    var remoteDataStamps = stampMap(cityRows, remoteData);
    var remoteStateStamps = stampMap(stateRows, remoteState);

    var localDataStamps = {}, localStateStamps = {};
    store.order.forEach(function (id) {
      localDataStamps[id] = store.updatedAt[id] || CityOps.syncKit.EPOCH;
      var s = readStateStamp(id);
      if (s) localStateStamps[id] = s;
    });

    var dataPlan = CityOps.syncKit.plan(localDataStamps, remoteDataStamps, removedIds);
    var statePlan = CityOps.syncKit.plan(localStateStamps, remoteStateStamps, removedIds);

    var pulledNames = [];
    var rebootActive = false;

    dataPlan.pull.forEach(function (id) {
      var row = remoteData[id];
      if (!row || !row.data || typeof row.data !== 'object') return;
      // These rows are the user's own, but they are still untrusted input:
      // validate before letting them into the store, and refuse any row whose
      // payload does not derive the city id it claims to be filed under.
      if (CityOps.validate(row.data).length) { warn('skipped invalid remote city ' + id); return; }
      if (CityOps.cityId(row.data) !== id) { warn('skipped mismatched remote city ' + id); return; }
      var res = CityOps.appStore.add(store, row.data, row.updated_at || CityOps.syncKit.EPOCH);
      store = res.store;
      if (id === activeId) rebootActive = true;
      if (pulledNames.indexOf(row.data.city.name) === -1) pulledNames.push(row.data.city.name);
    });
    if (dataPlan.pull.length) saveStore(store);

    statePlan.pull.forEach(function (id) {
      if (!has(store.cities, id)) return;  // orphan state row: no city to attach it to
      var row = remoteState[id];
      if (!row || !row.state || typeof row.state !== 'object') return;
      var st = CityOps.normalizeState(clone(row.state));
      // A pulled state row is untrusted input same as a pulled city row (see
      // the conservative choices in the report): a dataOverride whose derived
      // id does not match the city_id it was filed under is rejected rather
      // than let a mismatched override attach to the wrong city. The rest of
      // the pulled state is kept.
      if (st.dataOverride) {
        var overrideId = null;
        try { overrideId = CityOps.cityId(st.dataOverride); } catch (e) {}
        if (overrideId !== id) {
          warn('pulled state for ' + id + ' carried a mismatched dataOverride; stripped it');
          st.dataOverride = null;
        }
      }
      st.updated = row.updated_at || st.updated || null;
      if (!writeStateRaw(id, st)) return;  // private mode: cannot persist, leave local alone
      stateStamp[id] = st.updated;         // baseline first, so the re-boot does not push it back
      if (id === activeId) rebootActive = true;
      var nm = store.cities[id].city.name;
      if (pulledNames.indexOf(nm) === -1) pulledNames.push(nm);
    });

    var dataEntries = [];
    dataPlan.push.forEach(function (id) {
      if (!has(store.cities, id)) return;
      dataEntries.push({ cityId: id, payload: store.cities[id], updatedAt: store.updatedAt[id] });
    });
    var stateEntries = [];
    statePlan.push.forEach(function (id) {
      var st = readStateFull(id);
      if (st && st.updated) stateEntries.push({ cityId: id, payload: st, updatedAt: st.updated });
    });
    pushNow('data', dataEntries);
    pushNow('state', stateEntries);

    if (rebootActive && has(store.cities, activeId)) {
      var y = 0;
      try { y = window.scrollY || window.pageYOffset || 0; } catch (e) {}
      CityOps.boot(clone(store.cities[activeId]));
      try { window.scrollTo(0, y); } catch (e2) {}
    } else if (!activeId && store.order.length) {
      // The device was showing the empty state and the pull just delivered
      // cities: activate the first one.
      activateCity(store.order[0]);
    }
    if (pulledNames.length) {
      showSyncNotice('Synced: ' + pulledNames.join(', ') + ' updated from your other device');
    }
  }

  // ---- auth actions ----
  // Once per page load at most: the sign-in path and the startup path both want
  // the address, and the first call is usually still in flight when the second
  // would fire. The label falls back to "signed in" if it never arrives.
  var emailLookupDone = false;
  function fetchUserEmail() {
    if (emailLookupDone) return;
    emailLookupDone = true;
    api('/auth/v1/user').then(function (u) {
      if (!u || !u.email || !session) return;
      session.email = u.email;
      saveSession(session);
      renderPanel();  // only visible while the switcher panel is open
    }).catch(function (e) { warn('user lookup failed', e); });
  }

  // Resolves to null on success, or a human-readable error string. Rejects only
  // when the service cannot be reached at all.
  function sendMagicLink(email) {
    var redirect = location.origin + location.pathname;
    return fetch(SUPA.url + '/auth/v1/otp?redirect_to=' + encodeURIComponent(redirect), {
      method: 'POST',
      headers: { 'apikey': SUPA.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, create_user: true, gotrue_meta_security: {} })
    }).then(function (r) {
      if (r.ok) return null;
      return r.json().then(function (j) {
        return (j && (j.msg || j.error_description || j.message)) || ('Sign-in service returned ' + r.status + '.');
      }, function () { return 'Sign-in service returned ' + r.status + '.'; });
    });
  }

  function signOut() {
    var tok = session && session.access_token;
    if (tok) {
      // Best effort revoke. The local session is cleared either way, so the
      // button can never leave the user half signed out.
      try {
        fetch(SUPA.url + '/auth/v1/logout', {
          method: 'POST',
          headers: { 'apikey': SUPA.anon, 'Authorization': 'Bearer ' + tok }
        }).catch(function () {});
      } catch (e) {}
    }
    saveSession(null);
    stateStamp = {};
    pushQueueData = {};
    pushQueueState = {};
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    // The last-sync record is meaningless once signed out (and stale once
    // signed back in as someone else), so it goes with the session.
    lastSyncIso = null;
    if (LS) { try { LS.removeItem(SYNC_KEY); } catch (e) {} }
    renderPanel();
  }

  // ---- sync UI ----
  function lastSyncLine() {
    if (!lastSyncIso) return 'Not synced yet on this device.';
    var when = lastSyncIso;
    try { when = new Date(lastSyncIso).toLocaleString(); } catch (e) {}
    return 'Last sync: ' + when + '.';
  }

  function modalShell(title) {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, title));
    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    host.appendChild(wrap);
    return { wrap: wrap, box: box, close: function () { wrap.remove(); } };
  }

  function openSignInModal() {
    var m = modalShell('Sign in to sync');
    m.box.appendChild(el('p', 'diff', 'Your cities and your progress follow you to your other devices. ' +
      'No password: we email you a link. The app works exactly the same whether you sign in or not.'));
    var inp = document.createElement('input');
    inp.type = 'email';
    inp.className = 'name-confirm';
    inp.placeholder = 'you@example.com';
    inp.name = 'email';               // lets the browser autofill, and keeps
    inp.autocomplete = 'email';       // devtools quiet about an unnamed field
    inp.setAttribute('aria-label', 'Email address');
    m.box.appendChild(inp);
    var msg = el('div', 'diff', '');
    m.box.appendChild(msg);
    var row = el('div', 'mrow');
    var send = el('button', 'ctl to-done', 'Send magic link');
    send.type = 'button';
    // Disabled until the field holds something that could be an address: a
    // button that is going to fail should never look ready to click.
    send.disabled = true;
    send.title = 'Enter your email address first';
    inp.oninput = function () {
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inp.value.replace(/^\s+|\s+$/g, ''));
      send.disabled = !ok;
      send.title = ok ? '' : 'Enter your email address first';
    };
    send.onclick = function () {
      var addr = inp.value.replace(/^\s+|\s+$/g, '');
      send.disabled = true;
      send.textContent = 'Sending...';
      msg.textContent = '';
      sendMagicLink(addr).then(function (err) {
        send.textContent = 'Send magic link';
        if (err) { msg.textContent = err; send.disabled = false; return; }
        msg.textContent = 'Link sent: open the email on this device.';
        send.title = 'Link already sent to ' + addr;
      }).catch(function () {
        send.textContent = 'Send magic link';
        send.disabled = false;
        msg.textContent = 'Could not reach the sync service. Check your connection and try again.';
      });
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(send);
    row.appendChild(cancel);
    m.box.appendChild(row);
    inp.focus();
  }

  function openSyncModal() {
    var m = modalShell('Sync');
    m.box.appendChild(el('p', 'diff', syncEmail ? ('Signed in as ' + syncEmail + '.') : 'Signed in.'));
    var when = el('p', 'diff', lastSyncLine());
    m.box.appendChild(when);
    var row = el('div', 'mrow');
    var now = el('button', 'ctl', 'Sync now');
    now.type = 'button';
    now.onclick = function () {
      now.disabled = true;
      now.textContent = 'Syncing...';
      pullAll(true).then(function (ok) {
        now.textContent = 'Sync now';
        now.disabled = false;
        when.textContent = ok ? lastSyncLine() : 'Could not reach the sync service. Your work is saved on this device.';
      });
    };
    var out = el('button', 'ctl to-archived', 'Sign out');
    out.type = 'button';
    out.onclick = function () { signOut(); m.close(); };
    var close = el('button', 'ctl', 'Close');
    close.type = 'button';
    close.onclick = m.close;
    row.appendChild(now);
    row.appendChild(out);
    row.appendChild(close);
    m.box.appendChild(row);
  }

  // ---- wiring ----
  function startSync() {
    if (!syncOn()) return;
    loadSyncMeta();
    if (!session) {
      var stored = loadSession();
      if (stored) { session = stored; syncEmail = stored.email || ''; }
    }
    if (!session) return;
    if (!syncEmail) fetchUserEmail();
    window.addEventListener('online', function () { pullAll(true); });
    // Mobile tab resume pulls; going hidden or away flushes any pending
    // debounced push immediately rather than risking the 2s timer never
    // firing (tab suspended, app switched away from, page unloaded).
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') pullAll(false);
      else if (document.visibilityState === 'hidden') flushPendingPush();
    });
    window.addEventListener('pagehide', flushPendingPush);
    pullAll(true);
  }

  // The assembler embeds the fully assembled standalone template here, with every
  // closing script tag escaped so the text/plain block cannot end early. Undo that,
  // drop the exported city JSON into the data block, and the result is a
  // self-contained guide file identical to what tools/embed.js produces.
  // (Never write that closing sequence literally in this file: it would end THIS
  // script element. The assembler counts script tags to keep that honest.)
  function exportStandalone() {
    var node = document.getElementById('guide-template');
    if (!node) return;
    var closeTag = '<' + '/script'; // assembled, never written literally: see above
    var raw = node.textContent;
    // The assembler pads the block with one newline on each side; strip exactly
    // those so the download is byte-identical to what tools/embed.js writes.
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    var tpl = raw.replace(/<\\\/script/g, closeTag);
    var base = store.cities[activeId];
    // Prefer the live in-memory state of the booted city: in private/incognito
    // mode makeStore() falls back to a per-instance memory cache, and a FRESH
    // makeStore() call here would get its own empty cache, silently dropping
    // any session-only progress. Fall back to a fresh read only if nothing is
    // currently booted (defensive; exportStandalone is only wired up in-app).
    var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
    var out = CityOps.buildExport(CityOps.effectiveData(base, st), st);
    // Escape every "</" so a closing-script-like sequence inside item data
    // cannot break out of the embedded data block. "\/" is a valid JSON escape
    // for "/", so this is lossless: JSON.parse of the escaped text reproduces
    // the original object exactly.
    var json = JSON.stringify(out, null, 2).replace(/<\//g, '<\\/');
    var html = tpl.replace('__CITY_DATA__', function () { return json; });
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = CityOps.cityId(out) + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    var freeUrl = a.href;
    setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
  }

  // Set before the first boot so the engine's toolbar picks up the app-only button.
  window.CityOpsApp = { exportStandalone: exportStandalone };

  // Re-decorate the header and re-render the panel on every engine state
  // change (not just on city switch, which activateCity already triggers via
  // CityOps.boot -> rerender -> this hook): this catches things like the
  // Edit-dates modal applying a stay override, and future-proofs any M2 sync
  // path that mutates state outside the app shell's own click handlers. The
  // engine wipes #hdr on every render, so decorateHeader() must re-run here
  // every time too, not just once at startup.
  // The itinerary companion link is app-only: standalone exported guides must
  // never carry it, so it decorates #foot here rather than in the engine.
  function decorateFoot() {
    var foot = document.getElementById('foot');
    if (!foot || foot.querySelector('.foot-wheres')) return;
    foot.appendChild(document.createTextNode(' · itinerary: '));
    var a = el('a', 'foot-wheres', 'wheres.robriggs.com');
    a.href = 'https://wheres.robriggs.com';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    foot.appendChild(a);
  }

  CityOps.onStateChange = function () { renderPanel(); decorateHeader(); decorateFoot(); };

  // Sync chains onto that hook rather than replacing it: the citybar still
  // re-renders exactly as before, and the sync layer additionally notices when
  // the engine's state stamp moved and queues a debounced push.
  (function chainStateChange() {
    var prev = CityOps.onStateChange;
    CityOps.onStateChange = function () {
      if (prev) prev();
      noteStateChange();
    };
  })();

  function start() {
    // Config first, then the auth fragment, and only then the #city= hash: a
    // magic-link return carries tokens in the fragment and must be consumed
    // (and scrubbed) before anything reads it as a city deep link.
    readDevConfig();
    var authNotice = consumeAuthHash();
    store = loadStore();
    // Seed the example ONLY on a genuine first run: no cities AND no stored
    // session AND never had real cities on this device. A signed-in device
    // with an empty store is mid-pull, not new, and must not invent a city
    // that then syncs into the account (Rob's recurring-example bug).
    var everHadCities = false;
    try { everHadCities = !!(LS && LS.getItem('cityops.app.hadcities')); } catch (e) {}
    if (!store.order.length && !loadSession() && !everHadCities) {
      var seeded = CityOps.appStore.add(store, clone(SEED_CITY), CityOps.syncKit.EPOCH);
      store = seeded.store;
      store.active = seeded.cityId;
      saveStore(store);
    }
    var wanted = hashCity();
    var target = CityOps.appStore.resolveStartCity(store, wanted);
    activateCity(target);
    window.addEventListener('hashchange', function () {
      var id = hashCity();
      if (id && has(store.cities, id) && id !== activeId) activateCity(id);
    });
    // After the first render: the engine rewrote #notice during boot, so a
    // sign-in notice has to be appended once that has happened.
    if (authNotice) showSyncNotice(authNotice);
    startSync();
  }

  // Offline support: register the app-shell service worker. Feature-detected
  // (older browsers just skip it) and gated to http/https so opening the app
  // as a local file:// (the standalone-guide path) never tries and never
  // logs a scary console error. Silent on failure: a registration error
  // should not block the app from working online.
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    try {
      navigator.serviceWorker.register('./sw.js');
    } catch (e) {}
  }

  start();
  registerServiceWorker();
})();
</script>
</body>
</html>
