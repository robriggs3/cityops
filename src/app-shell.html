<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityOps</title>
<style>
/*CITYOPS_CSS*/

  /* --- app shell: multi-city switcher (index.html only) --- */
  /* Dense in-header controls: the h1 itself is the switcher trigger (chevron
     appended after it), and a translucent chip in the header's top-right opens
     Add-city. Both live inside #hdr, which the engine fully replaces
     (innerHTML='') on every render, so decorateHeader() re-appends them from
     CityOps.onStateChange every time: see the appshell script below. The
     header must not grow to fit these; they overlay the existing chrome. */
  #hdr{position:relative;}
  /* The h1-as-a-control rules (cursor, inline-flex, the chevron) moved to
     src/header.css on 2026-09-01, with their values unchanged. The trip
     surface's h1 became the same kind of control that day, and a shared
     control declared once per surface is how the red band drifted twice. */
  /* Profile, sync and + Add city are app-level controls (not per-city ones):
     Profile holds ONE interest profile and ONE Claude key for every city, so
     it lives in the header rather than inside the city dropdown, which would
     read as "this city's profile".

     They used to be absolutely positioned over the band, which is why they
     had a `top` per breakpoint and why the city title had to leave room for
     them. They now sit in the shared header's own peer row (#hdr-acts), which
     lays them out; .hdr-chip itself is defined once in src/header.css and
     shared with the trip surface. */

  /* Dropdown panel: floats directly under the header (does not add header
     height); #citybar is its host, positioned inside .wrap right after
     #hdr so it shares the content width. */
  #citybar{position:relative;}
  /* Open state must be unmistakable: the panel attaches flush to the header
     (full-bleed, square top like the header itself) and a scrim dims the page
     behind it. */
  .city-scrim{position:fixed; inset:0; background:rgba(36,36,36,.35); z-index:55;}
  .citypanel{position:absolute; top:-20px; left:-16px; right:-16px; z-index:60;
    background:var(--bg-card); border:1px solid var(--border-light); border-top:none;
    border-radius:0 0 14px 14px;
    overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,.28);}
  @media (min-width: 431px){
    .citypanel{top:-24px;}
  }
  .cityrow{display:block; width:100%; font:inherit; text-align:left; color:var(--text);
    background:none; border:none; border-bottom:1px solid var(--border-light);
    padding:11px 14px; cursor:pointer;}
  .cityrow:last-of-type{border-bottom:none;}
  .cityrow:hover{background:var(--bg-softer);}
  .cityrow.current{background:var(--accent-soft);}
  .cityrow .cname{font-weight:600; font-size:.9rem;}
  .cityrow.current .cname{font-weight:800;}
  .cityrow .dot{display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-left:7px; vertical-align:middle;}
  .cityrow .cdates{display:block; font-size:.76rem; color:var(--text-3); margin-top:1px;}
  .cityact{display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px;
    background:var(--bg-softer); border-top:1px solid var(--border-light);}
  .cityact button{font:inherit; font-size:.78rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:5px 13px; cursor:pointer;}
  .cityact button:hover{border-color:var(--accent);}
  .blank-cc{width:84px; flex:0 0 auto; text-transform:uppercase;}
  .name-confirm{width:100%; font:inherit; font-size:.9rem; padding:8px 10px; margin-top:8px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal .ctl[disabled]{opacity:.45; cursor:not-allowed; border-color:var(--border-light);}
  .modal .ctl[disabled]:hover{border-color:var(--border-light);}

  /* Profile modal: chip lists reuse the pill vocabulary (rounded, bordered,
     accent ink) at tag scale, so a chip reads as an editable tag. */
  .chip-list{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0;}
  .chip-list:empty{margin:0;}
  .chipx{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600;
    color:var(--accent-hover); background:#fff; border:1.5px solid var(--border-light);
    border-radius:20px; padding:3px 6px 3px 11px;}
  .chipx button{font:inherit; font-size:.9rem; line-height:1; font-weight:700; color:var(--text-3);
    background:var(--bg-softer); border:none; border-radius:50%; width:17px; height:17px;
    padding:0; cursor:pointer;}
  .chipx button:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .chip-add{width:100%; font:inherit; font-size:.85rem; padding:6px 10px; margin-top:6px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal textarea.notes{min-height:80px; font-family:inherit; font-size:.85rem;}
  .modal .promptout{min-height:140px;}
  .hdr-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .hdr-row .date-field{flex:1 1 30%; min-width:96px;}

  /* Planning-factor rows (Phase 2): label left, level select right, remove
     button last. Stacks are already mobile-first (narrow rows, no fixed
     widths), so no extra @media rule is needed for phones. */
  .factor-list{margin-top:6px;}
  .factor-row{display:flex; align-items:center; gap:8px; padding:6px 0;
    border-bottom:1px solid var(--border-light);}
  .factor-row:last-child{border-bottom:none;}
  .factor-label{flex:1 1 auto; font-size:.85rem; font-weight:600; color:var(--text);}
  .factor-row select.factor-level{flex:0 0 auto; font-size:.78rem; padding:5px 6px;}
  .factor-row button{font:inherit; font-size:.9rem; line-height:1; font-weight:700; color:var(--text-3);
    background:var(--bg-softer); border:none; border-radius:50%; width:22px; height:22px;
    padding:0; cursor:pointer; flex:0 0 auto;}
  .factor-row button:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .key-field{flex:1 1 100%; min-width:0;}

  /* Sync alert: amber, not red. Nothing is lost when sync stops (the device
     keeps every edit), so this is a "you should know" rather than an error.
     Full width above the header, stacked on a phone. */
  .syncalert{background:var(--amber-soft); border:1px solid var(--amber);
    border-left:4px solid var(--amber); border-radius:10px; padding:11px 13px;
    margin:0 0 12px; font-size:.82rem; line-height:1.45; color:var(--text);}
  .syncalert-txt{display:block;}
  .syncalert-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px;}
  .syncalert-acts .ctl{font-size:.78rem;}

  /* Section leads inside the Profile modal: the modal now holds Account, the
     interest profile and the Claude key, and a reader needs to see where one
     ends and the next begins. */
  .modal .section-lead{font-weight:800; font-size:.86rem; color:var(--text);
    margin:16px 0 4px; padding-top:12px; border-top:1px solid var(--border-light);}
  /* Signed out is the state that costs the traveler something, so it does not
     look like the rest of the muted helper text. */
  .modal .acct-off{color:var(--amber-ink); background:var(--amber-soft);
    border-radius:8px; padding:8px 10px; font-weight:600;}

  /* --- Past cities in the switcher (owner ask 2026-08-26) ---
     "need the ability to archive cities previously visited in cityops page
     (take cue from plan-ahead page)". The cue taken: the trip surface groups
     stops you have left behind one collapsed disclosure and fades them to
     0.72, so a city you have left does the same here. Fade, never hide: a
     past city is still openable in one tap, and its rows still say what the
     dates were. */
  .citypast{border-top:1px solid var(--border-light);}
  .citypast > summary{list-style:none; cursor:pointer; padding:9px 14px;
    font-size:.72rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--text-3); background:var(--bg-softer);}
  .citypast > summary::-webkit-details-marker{display:none;}
  .citypast > summary:hover{color:var(--accent-hover);}
  .citypast > summary .chev{display:inline-block; margin-right:6px; font-size:.8rem;}
  .citypast .cityrow{opacity:.72;}
  .citypast .cityrow:hover, .citypast .cityrow.current{opacity:1;}
  /* The per-row archive/restore control. Wordless icon with a tooltip and an
     aria-label, per the house idiom; it sits at the right end of the row and
     stops the click from also switching city. */
  .cityrow{position:relative; padding-right:46px;}
  .city-arch{position:absolute; top:50%; right:8px; transform:translateY(-50%);
    font:inherit; font-size:.9rem; line-height:1; background:none; border:none;
    border-radius:50%; width:32px; height:32px; padding:0; cursor:pointer; opacity:.55;}
  .city-arch:hover{opacity:1; background:var(--accent-soft);}
  @media (pointer: coarse){
    .city-arch{width:44px; height:44px;}
    .cityrow{padding-right:58px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <!-- The shared header is the FIRST thing in .wrap, on both surfaces, and
       that is load-bearing rather than tidy: the notice line used to sit above
       it, and an EMPTY notice line self-collapses and pushes its 8px top margin
       out through .wrap and body, which moved the whole page (red band
       included) 8px down from the top of the window. Owner ask 2026-08-27:
       "cleanup the margin at the top". Measured: the band's rect.top is 0 at
       390px and at 1440px. -->
  <!--CITYOPS_HEADER-->
  <div id="notice"></div>
  <!-- App-owned and never touched by the engine (which rewrites #notice on
       every render): the one place a stopped sync can say so and still be
       there after the next tap. -->
  <div id="syncalert"></div>
  <div id="citybar"></div>
  <div class="toolbar" id="toolbar"></div>
  <nav class="tabbar" id="tabbar" aria-label="Guide sections" hidden></nav>
  <nav class="secnav" id="secnav" aria-label="Jump to section" hidden></nav>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="modal"></div>

<script id="app">
<!--CITYOPS_ENGINE-->
</script>

<!--CITYOPS_TEMPLATE-->

<!--CITYOPS_PROMPT-->

<script id="appshell">
(function () {
  'use strict';

  var APP_KEY = 'cityops.app.v1';

  // ---- M2 sync configuration ----
  // An empty url means sync is OFF: no sign-in button, no listeners, no
  // network calls, nothing to fail. That is the committed state; the
  // controller binds the real project values here (BINDING CHECKLIST in
  // .superpowers/sdd/m2-client-report.md). The anon key is public by design:
  // row level security is the boundary, and no other key ever reaches a
  // browser.
  var SUPA = { url: 'https://ggscdbbvqmqiyguiccrf.supabase.co', anon: 'sb_publishable_j3oRAQ-3889fkN26FtaE7g_jMyx1Lda' };

  var AUTH_KEY = 'cityops.auth.v1';   // {access_token, refresh_token, expires_at, email}
  var SYNC_KEY = 'cityops.sync.v1';   // {lastSync}
  var DEV_KEY = 'cityops.supa.dev';   // testing override: {"url":"...","anon":"..."}

  // Claude API key for the in-app generator. It keeps its own localStorage
  // key (the working copy this device reads at generation time) and is NEVER
  // folded into `store` or `store.profile`: normalizeProfile() rebuilds a
  // profile from a fixed field list, so keeping the key outside it is what
  // guarantees it cannot reach an exported guide, a city row, genmeta or any
  // prompt the app builds.
  //
  // Changed 2026-08-25 (Rob): the key now ALSO rides in the profile sync row,
  // as a stamped sidecar beside the profile (see syncKit.buildProfileRow), so
  // clearing this browser's cache no longer loses it. It travels only in that
  // one RLS-protected row, and only while signed in.
  var CLAUDE_KEY = 'cityops.claude.apikey.v1';
  var CLAUDE_KEY_AT = 'cityops.claude.apikey.updated.v1';  // ISO stamp for the reconcile

  // The GitHub personal access token the trip surface used to publish the
  // family page with, retired 2026-08-28 along with that publish path (it is a
  // share link now, backed by public.shares). Nothing in either surface reads
  // it any more, so this shell deletes its two keys on boot and the engine's
  // buildProfileRow stops writing the sidecar, which takes the account's copy
  // with the next push. Revoking the token itself is Rob's job, at
  // github.com/settings/personal-access-tokens.
  var LEGACY_GITHUB_KEYS = ['cityops.github.pat.v1', 'cityops.github.pat.updated.v1'];

  // The Add/Edit city form fields that are NOT part of schema v1
  // (accommodation address, transport, free-text trip notes) exist only to
  // build a prompt; the city JSON itself never carries them. They are saved
  // here, keyed by cityId, purely so Edit can reopen the form pre-filled, and
  // (since 2026-08-25) ride in the profile row as a second stamped sidecar so
  // an Edit opened on the phone shows what was typed on the laptop.
  var GENMETA_KEY = 'cityops.genmeta.v1';
  var GENMETA_AT = 'cityops.genmeta.updated.v1';           // ISO stamp for the reconcile
  // cityId -> ISO of the removal. Each entry carries its own stamp because
  // two devices can remove two different cities and the reconcile is a union,
  // not a newest-wins over the whole map. Rides the profile row as `removed`.
  var TOMB_KEY = 'cityops.removed.v1';

  // Bundled first-run city: the same example block standalone template.html ships
  // with, so a stranger opening the app sees a working guide immediately.
  var SEED_CITY = {
    "schema": 1,
    "city": {
      "name": "Example City", "country": "XX",
      "dates": {"from": "2026-01-01", "to": "2026-01-07"},
      "accommodation": {"name": "Example Stay", "lat": 0, "lng": 0},
      "currency": {"code": "USD", "usd": 1},
      "notes": ["This is an example city. Tap the city name above, then Add city, and paste your own generated JSON."]
    },
    "sections": [
      {"id": "dinner", "label": "Dinner", "icon": "🍽️"}
    ],
    "items": [{
      "id": "example",
      "section": "dinner",
      "status": "plan",
      "day": "2026-01-02",
      "when": "First evening",
      "name": "Example Restaurant",
      "price": {"text": "~$20"},
      "note": "Replace me. This item exists so the empty template renders.",
      "hours": {"text": "12:00-23:00 daily", "class": "late"},
      "tags": [],
      "links": [],
      "place_id": null,
      "verified": null
    }]
  };

  var SEED_ID = 'example-city-2026-01-01';

  // Feature 3: whether the example city should be visible right now, given
  // the current store and the traveler's "Show example city" profile toggle.
  // Pure decision lives in the engine (CityOps.appStore.exampleVisible); this
  // just supplies this device's live inputs.
  function exampleVisible() {
    return CityOps.appStore.exampleVisible(store.order, SEED_ID, !!(store.profile && store.profile.showExample));
  }

  function loadExampleCity() {
    if (!has(store.cities, SEED_ID)) {
      var res = CityOps.appStore.add(store, clone(SEED_CITY), CityOps.syncKit.EPOCH);
      store = res.store;
    }
    // An explicit "load the example" only actually shows anything if the
    // toggle agrees; flip it on so this action does what it says even after
    // a real city has made the example hide by default.
    if (!store.profile.showExample) {
      var p = CityOps.profile.normalize(store.profile);
      p.showExample = true;
      p.updated = new Date().toISOString();
      store.profile = p;
      schedulePush('profile');
    }
    saveStore(store);
    activateCity(SEED_ID);
  }

  function renderEmptyState() {
    // Only the MIDDLE, never the whole header: the band, the Cities|Trip
    // switch and the app-level doors are shared chrome (src/header.html) and
    // wiping them here left the surface with no way to cross to the trip half
    // and no Profile door, on the one screen where a new traveler needs both.
    // The engine's renderHeader observes the same boundary.
    var hdr = document.getElementById('hdr-mid') || document.getElementById('hdr');
    hdr.innerHTML = '';
    hdr.appendChild(el('h1', null, 'CityOps'));
    hdr.appendChild(el('div', 'sub', 'No cities yet'));
    // Nothing renders through the engine in this state, so the hook that
    // normally refills the action slot never fires: do it here.
    decorateHeader();
    document.getElementById('toolbar').innerHTML = '';
    var main = document.getElementById('main');
    main.innerHTML = '';
    var card = el('div', 'card');
    card.appendChild(el('h3', null, 'Add your first city'));
    card.appendChild(el('p', null, 'Start blank, paste generated city JSON, or load the example to see how a guide works.'));
    var row = el('div', 'ctl-row');
    var add = el('button', 'ctl to-done', '+ Add city');
    add.type = 'button';
    add.onclick = openAddModal;
    var ex = el('button', 'ctl', 'Load example city');
    ex.type = 'button';
    ex.onclick = loadExampleCity;
    row.appendChild(add); row.appendChild(ex);
    card.appendChild(row);
    main.appendChild(card);
    document.getElementById('foot').textContent = 'cityops';
    if (CityOps.onStateChange) CityOps.onStateChange();
  }

  var LS = null;
  try { LS = (typeof localStorage !== 'undefined') ? localStorage : null; }
  catch (e) { LS = null; }

  var memStore = null;   // session fallback when localStorage refuses writes
  var store = null;      // {cities, order, active}
  var activeId = null;
  var panelOpen = false;
  var docClickBound = false; // outside-click listener is bound only while the panel is open

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function trim(s) { return String(s === null || s === undefined ? '' : s).replace(/^\s+|\s+$/g, ''); }

  function loadStore() {
    var raw = null;
    if (LS) { try { raw = LS.getItem(APP_KEY); } catch (e) { raw = null; } }
    var obj = null;
    if (raw) { try { obj = JSON.parse(raw); } catch (e) { obj = null; } }
    if (!obj) obj = memStore;
    return CityOps.appStore.normalize(obj);
  }

  function saveStore(s) {
    memStore = s;
    if (LS) { try { LS.setItem(APP_KEY, JSON.stringify(s)); } catch (e) {} }
  }

  function readLS(k) {
    if (!LS) return null;
    try { return LS.getItem(k); } catch (e) { return null; }
  }
  function writeLS(k, v) {
    if (!LS) return;
    try { if (v === null) LS.removeItem(k); else LS.setItem(k, v); } catch (e) {}
  }

  // ---- Claude API key (local working copy + a stamp for the sync reconcile) ----
  function loadApiKey() {
    return readLS(CLAUDE_KEY) || '';
  }

  // A key saved before key sync existed has no stamp of its own. Give it the
  // epoch rather than null: that makes it PUSHABLE (a device with a key beats
  // an account with none) while losing to any explicit change made anywhere
  // since. Returns null only when this device has never had or cleared a key,
  // which is the one state that must not overwrite the account's key.
  function apiKeyStamp() {
    var at = readLS(CLAUDE_KEY_AT);
    if (at) return at;
    return loadApiKey() ? CityOps.syncKit.EPOCH : null;
  }

  // Writes both halves without touching sync: the pull path uses this to adopt
  // the account's key (keeping the REMOTE stamp, exactly like a pulled city).
  function writeApiKey(k, iso) {
    writeLS(CLAUDE_KEY, k ? k : null);
    writeLS(CLAUDE_KEY_AT, iso || null);
  }

  // A deliberate local change: stamp it now and queue the profile row. An
  // empty k is a CLEAR, which is a real edit too (it must propagate), so it
  // still gets a stamp rather than reverting this device to "never had one".
  function saveApiKey(k) {
    writeApiKey(k, new Date().toISOString());
    schedulePush('profile');
  }

  // ---- GitHub token: the demolition crew ----
  // Not a store any more, just a delete. Runs once at boot. Returns true when
  // it actually removed something, so the console can say so.
  function purgeLegacyGithubToken() {
    var hit = false;
    LEGACY_GITHUB_KEYS.forEach(function (k) {
      if (readLS(k) === null) return;
      hit = true;
      writeLS(k, null);
    });
    if (hit) {
      console.log('[cityops] deleted the retired GitHub publish token from this device (' +
        LEGACY_GITHUB_KEYS.join(', ') + '). Revoke it at ' +
        'https://github.com/settings/personal-access-tokens if you have not already.');
    }
    return hit;
  }

  // ---- generation-form metadata (local working copy + its own stamp) ----
  function loadGenMeta() {
    var raw = readLS(GENMETA_KEY);
    if (!raw) return {};
    try { var m = JSON.parse(raw); return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {}; }
    catch (e) { return {}; }
  }
  function genMetaStamp() {
    var at = readLS(GENMETA_AT);
    if (at) return at;
    // Same migration rule as the key: metadata that predates genmeta sync is
    // pushable but loses to any explicit edit made since.
    var all = loadGenMeta();
    for (var k in all) { if (has(all, k)) return CityOps.syncKit.EPOCH; }
    return null;
  }
  function writeGenMeta(all, iso) {
    writeLS(GENMETA_KEY, JSON.stringify(all || {}));
    writeLS(GENMETA_AT, iso || null);
  }
  function saveGenMetaFor(cityId, meta) {
    var all = loadGenMeta();
    all[cityId] = meta;
    writeGenMeta(all, new Date().toISOString());
    schedulePush('profile');
  }

  // ---- removal tombstones ----
  // A removal is a fact about the ACCOUNT, not about this device. Before this,
  // Remove city dropped the local copy and refused to pull it back for the
  // rest of the session, but the cities/city_state rows lived on, so the next
  // pull (or the next device) put it straight back. Owner report 2026-08-27:
  // "I'm repeatedly removing a city but it keeps adding back when I refresh."
  //
  // The map lives here, cityId -> ISO of the removal, and rides the profile
  // row as the `removed` sidecar. It is written whether or not the device is
  // signed in, so a removal made on a plane goes up with the next sync rather
  // than being lost with the session. The reconcile itself is pure and lives
  // in the engine (syncKit.tombKit).
  function loadTombs() {
    var raw = readLS(TOMB_KEY);
    if (!raw) return {};
    try { return CityOps.syncKit.tombKit.normalize(JSON.parse(raw)); }
    catch (e) { return {}; }
  }

  function writeTombs(map) {
    writeLS(TOMB_KEY, JSON.stringify(CityOps.syncKit.tombKit.normalize(map)));
  }

  // The stamped block this device contributes to the profile row. No entries
  // means no opinion: buildProfileRow leaves the field out entirely rather
  // than writing an empty map over the account's real one.
  function localTombBlock() {
    var map = loadTombs();
    return CityOps.syncKit.tombKit.mergeBlocks({ value: map, updated: CityOps.syncKit.EPOCH }, null);
  }

  // Records a removal and queues it for the account. The write is local and
  // synchronous, and the push is the debounced one every other edit uses, so a
  // removal made with no signal survives the reload and rides the next sync;
  // that is the whole reason this is not "delete the rows and hope". `at` is
  // an injection point for a fixed clock; real callers omit it.
  function addTomb(cityId, at) {
    if (!cityId) return;
    var map = loadTombs();
    map[cityId] = at || new Date().toISOString();
    writeTombs(map);
    schedulePush('profile');
  }

  // Re-adding a city with the same id must work, so an add always clears the
  // tombstone: the traveler changed their mind, and the removal is no longer
  // the newest thing said about that city. Silent when there was none, which
  // is the ordinary case for every add.
  function clearTomb(cityId) {
    if (!cityId) return false;
    var map = loadTombs();
    if (!Object.prototype.hasOwnProperty.call(map, cityId)) return false;
    delete map[cityId];
    writeTombs(map);
    schedulePush('profile');
    return true;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function hashCity() {
    var m = String(location.hash || '').match(/^#city=(.+)$/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  // ---- #plan= : one tap from a trip stop to a planned city ----
  // The trip surface's stop cards have carried this fragment since they grew
  // a "Plan this city" control; until now the app root ignored it (an
  // unrecognised hash was a no-op) and the traveler landed on whatever city
  // was already open. Owner ask 2026-08-26: "when clicking 'plan city' for a
  // city that hasn't been planned yet, go ahead and add the city to our
  // dropdown, plan it with claude, and navigate to that page."
  //
  // Shape: #plan=<slug>&name=<name>&from=<iso>&to=<iso>&country=<cc>
  // The slug is informational (cityops derives its own id from name + start
  // date, which is what cityId() has always done); name and both dates are
  // what actually matter, and a fragment missing any of them is not
  // actionable and reads as absent.
  function hashPlan() {
    var h = String(location.hash || '');
    if (h.indexOf('#plan=') !== 0) return null;
    var out = {};
    h.slice(1).split('&').forEach(function (pair) {
      var eq = pair.indexOf('=');
      if (eq === -1) return;
      var k = pair.slice(0, eq);
      var v = pair.slice(eq + 1);
      try { v = decodeURIComponent(v); } catch (e) {}
      out[k] = v;
    });
    if (!trim(out.name || '')) return null;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(out.from || '') || !/^\d{4}-\d{2}-\d{2}$/.test(out.to || '')) return null;
    if (out.from > out.to) return null;
    return { name: trim(out.name), from: out.from, to: out.to, country: trim(out.country || '') };
  }

  // Returns the id it navigated to, or null if the fragment was not
  // actionable. Two outcomes, and the guard is the first of them:
  //
  //   already in the store  ->  just switch to it. No scaffold, no second
  //                             copy under a keep-both name, and above all no
  //                             generation run that would overwrite a guide
  //                             the traveler already has. Tapping the same
  //                             stop card twice has to be safe.
  //   not in the store      ->  scaffold it through appStore.add (the same
  //                             door + Add city's "Create blank city" uses),
  //                             switch to it, then hand it to the Add-city
  //                             modal in edit mode, which is where generating
  //                             and every one of its failure paths already
  //                             live. Nothing new is invented here.
  function consumePlanHash(plan) {
    if (!plan) return null;
    var scaffold;
    try { scaffold = CityOps.appStore.blankCity(plan.name, plan.country, plan.from, plan.to); }
    catch (e) { return null; }
    var id = CityOps.cityId(scaffold);
    cleanHash();
    if (has(store.cities, id)) { activateCity(id); return id; }
    var res = CityOps.appStore.add(store, scaffold);
    store = res.store;
    saveStore(store);
    saveGenMetaFor(res.cityId, { country: plan.country });
    activateCity(res.cityId);
    schedulePush('data', res.cityId);
    // Deferred one turn so the engine's first render of the scaffold has
    // painted before the modal covers it: the traveler sees the city arrive
    // in the switcher, THEN sees what is being done about filling it.
    setTimeout(function () { openAddModal(res.cityId, { autoPlan: true }); }, 0);
    return res.cityId;
  }

  function setHash(id) {
    var target = '#city=' + encodeURIComponent(id);
    if (location.hash === target) return;
    try {
      history.replaceState(null, '', location.pathname + location.search + target);
    } catch (e) {
      location.hash = target;
    }
  }

  // Switching cities means: remember it, reflect it in the URL, hand the engine
  // a fresh copy of that city's data. The engine reloads that city's own
  // cityops.<cityId>.v1 state, so progress per city is preserved untouched.
  function activateCity(id) {
    if (!id || !store.cities[id]) {
      // Empty store: render a minimal empty state instead of inventing a city.
      store.active = null;
      saveStore(store);
      activeId = null;
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
      renderEmptyState();
      return;
    }
    if (id !== SEED_ID) { try { if (LS) LS.setItem('cityops.app.hadcities', '1'); } catch (e) {} }
    store.active = id;
    saveStore(store);
    activeId = id;
    setHash(id);
    // CityOps.boot -> rerender() calls CityOps.onStateChange() itself (see
    // below), which re-renders the panel and decorates the fresh header; no
    // separate call needed here.
    CityOps.boot(clone(store.cities[id]));
    // Sync baseline for this city, taken AFTER the boot and independently of
    // whether a session exists yet: at first load the session is restored after
    // the first boot, so leaving noteStateChange() to take the baseline lazily
    // would spend it on the user's first real edit and swallow that push.
    stateStamp[id] = readStateStamp(id);
  }

  // Closing on an outside click: bound to document only while the panel is
  // open, and removed as soon as it closes (by any path), so it never lingers.
  // The header counts as "inside" too: it now hosts the trigger (h1) and the
  // Add chip, and those already have their own click handlers.
  function onOutsideClick(e) {
    var bar = document.getElementById('citybar');
    var hdr = document.getElementById('hdr');
    var insideBar = bar && bar.contains(e.target);
    var insideHdr = hdr && hdr.contains(e.target);
    if (panelOpen && !insideBar && !insideHdr) {
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
    }
  }

  // ---- Past cities (owner ask 2026-08-26) ----
  // The flag itself lives on the per-city STATE object (state.archived), and
  // that is the whole point of putting it there: the state object is what
  // rides the city_state sync rows, so archiving Batumi on the phone archives
  // it on the laptop. store.order and store.active, the two other places a
  // per-city flag could plausibly have gone, are device-local by design and
  // would have made this a per-browser setting.
  //
  // Reading it means reading each city's state, which readStateFull already
  // does for the sync layer (and which correctly prefers the LIVE state of
  // the booted city over its localStorage copy).
  function todayIsoLocal() { return CityOps.todayIso(); }

  // Effective dates: an Edit-dates stayOverride wins over the shipped data,
  // exactly as it does everywhere the engine shows a range.
  function cityDatesFor(id) {
    var d = store.cities[id];
    if (!d) return null;
    return CityOps.effectiveDates(d, readStateFull(id) || CityOps.emptyState());
  }

  function cityIsPastNow(id, isCurrent) {
    if (!store.cities[id]) return false;
    return CityOps.archiveKit.isPast(
      readStateFull(id) || CityOps.emptyState(), cityDatesFor(id), todayIsoLocal(), !!isCurrent);
  }

  // ---- Boot lands on the city the calendar says he is in ----
  // One {id, from, to, archived} row per city, the input to the engine's
  // pickCurrentCity. Effective dates and the Past flag come from the same two
  // helpers the switcher's Past group reads, so boot and the switcher can
  // never disagree about where he is.
  //
  // isCurrent is false for every row on purpose. cityIsPastNow exempts the
  // ACTIVE city from the date rule so a stay does not slide into Past under
  // the cursor on its last day, but boot is the call that decides which city
  // is active, so honouring that exemption here would be circular: the city
  // he last had open would keep exempting itself from the rule meant to move
  // him on.
  //
  // A hidden example city is dropped rather than picked and then corrected
  // downstream: its shipped dates would otherwise win the boot on a device
  // that has real cities but keeps the example switched off.
  function currentCityMetas() {
    var exVisible = exampleVisible();
    var today = todayIsoLocal();
    var out = [];
    store.order.forEach(function (id) {
      if (id === SEED_ID && !exVisible) return;
      var dates = cityDatesFor(id);
      if (!dates) return;
      out.push({
        id: id, from: dates.from, to: dates.to,
        archived: CityOps.archiveKit.isPast(
          readStateFull(id) || CityOps.emptyState(), dates, today, false)
      });
    });
    return out;
  }

  // Writes the flag and queues the state push so the other device sees it.
  //
  // The re-boot on the active city is load-bearing, not tidiness. The engine
  // holds its OWN store instance with an in-memory copy of the booted city's
  // state (makeStore's `mem`, which exists so private mode still works), and
  // that copy wins over localStorage on every read. A write from out here
  // through a second store instance would sit in localStorage unseen: the
  // panel would redraw from the engine's stale copy and the tap would look
  // like it did nothing. Re-booting hands the engine a store whose mem is
  // empty, so it reads the value we just wrote.
  function setCityArchived(id, value) {
    if (!store.cities[id]) return;
    var s = CityOps.makeStore(id, LS);
    var st = s.load();
    CityOps.archiveKit.set(st, value);
    s.save(st);
    schedulePush('state', id);
    if (id === activeId) {
      CityOps.boot(clone(store.cities[id]));
      stateStamp[id] = readStateStamp(id);
    }
  }

  // Renders (or clears) the dropdown panel: the city list plus + Add city
  // (and Load example / Sync, when applicable). Remove city lives in the
  // More action sheet now (Phase 4 nav cleanup), not here.
  function renderPanel() {
    var bar = document.getElementById('citybar');
    bar.innerHTML = '';
    if (!panelOpen) {
      if (docClickBound) { document.removeEventListener('click', onOutsideClick, true); docClickBound = false; }
      return;
    }
    var scrim = el('div', 'city-scrim');
    scrim.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); };
    bar.appendChild(scrim);
    var panel = el('div', 'citypanel');
    var exVisible = exampleVisible();
    var today = todayIsoLocal();

    // One row, built the same way whether it lands in the live list or the
    // Past group: the ONLY difference between the two is which parent it is
    // appended to, so a restored city cannot pick up a different treatment
    // than a city that was never archived.
    function cityRow(id) {
      var d = store.cities[id];
      var isCurrent = id === activeId;
      var prow = el('button', 'cityrow' + (isCurrent ? ' current' : ''));
      prow.type = 'button';
      var nameWrap = el('span', 'cname', d.city.name);
      if (isCurrent) nameWrap.appendChild(el('span', 'dot'));
      prow.appendChild(nameWrap);
      prow.appendChild(el('span', 'cdates', CityOps.fmtRange(cityDatesFor(id))));
      prow.onclick = function () {
        panelOpen = false;
        // activateCity triggers a real engine render, which calls
        // decorateHeader() via onStateChange and updates aria-expanded there;
        // only the same-city no-op path needs to refresh it itself.
        if (id === activeId) { updateHeaderExpanded(); renderPanel(); return; }
        activateCity(id);
      };
      prow.appendChild(archiveBtn(id, isCurrent));
      return prow;
    }

    // Removal stays where it was (the More sheet, behind a typed confirm).
    // This control is the reversible one: one tap out, one tap back, and it
    // says which of the two it is doing rather than reading "archive" on a
    // city that is already in the Past group.
    function archiveBtn(id, isCurrent) {
      var past = cityIsPastNow(id, isCurrent);
      var b = el('button', 'city-arch', past ? '↩' : '🗄');
      b.type = 'button';
      var aria = past ? 'Restore this city to the active list'
        : 'Move this city to Past';
      b.setAttribute('aria-label', aria);
      b.title = aria;
      b.onclick = function (e) {
        e.stopPropagation();
        setCityArchived(id, CityOps.archiveKit.nextValue(
          readStateFull(id) || CityOps.emptyState(), cityDatesFor(id), today, isCurrent));
        renderPanel();
      };
      return b;
    }

    var live = [], past = [];
    store.order.forEach(function (id) {
      // Feature 3: the example city never appears in the switcher once a real
      // city exists, unless the traveler turned "Show example city" on.
      if (id === SEED_ID && !exVisible) return;
      (cityIsPastNow(id, id === activeId) ? past : live).push(id);
    });
    live.forEach(function (id) { panel.appendChild(cityRow(id)); });
    if (past.length) {
      // <details> rather than a button and a class, so the browser owns the
      // open/closed state and the keyboard already works. Collapsed on every
      // open, deliberately: a past city is history, and the point of the
      // group is that it is out of the way until you want it.
      var det = el('details', 'citypast');
      var sum = document.createElement('summary');
      sum.appendChild(el('span', 'chev', '▸'));
      sum.appendChild(document.createTextNode('Past (' + past.length + ')'));
      det.appendChild(sum);
      det.ontoggle = function () {
        var c = sum.querySelector('.chev');
        if (c) c.textContent = det.open ? '▾' : '▸';
      };
      past.forEach(function (id) { det.appendChild(cityRow(id)); });
      panel.appendChild(det);
    }
    var acts = el('div', 'cityact');
    var add = el('button', 'cityadd', '+ Add city');
    add.type = 'button';
    add.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openAddModal(); };
    acts.appendChild(add);
    // Phase 4, item 7: Remove city moved to the More action sheet (nav
    // cleanup groups every utility action in one place); no row for it here
    // anymore.
    if (!exVisible) {
      var exb = el('button', null, 'Load example');
      exb.type = 'button';
      exb.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); loadExampleCity(); };
      acts.appendChild(exb);
    }
    // Feature 7: Profile moved to a top-level header chip (decorateHeader
    // below), since it is one profile for every city, not a per-city setting.
    // Sync moved there too (2026-08-25, Rob): signing in is an ACCOUNT action,
    // not a city action, and burying the signed-out state one tap inside a
    // city menu is how a dropped session went unnoticed. Profile now owns it,
    // and #syncalert says so on the page when sync stops.
    panel.appendChild(acts);
    bar.appendChild(panel);

    if (!docClickBound) {
      // Deferred: adding the listener synchronously would let it observe the
      // very click (bubbling to document) that just opened the panel.
      setTimeout(function () { document.addEventListener('click', onOutsideClick, true); }, 0);
      docClickBound = true;
    }
  }

  // Just refreshes the aria-expanded flag on the current h1 in place. Toggling
  // the panel does not itself trigger an engine render, so this must NOT go
  // through decorateHeader() below (that appends the chevron/chip afresh and
  // would duplicate them on an h1 the engine hasn't wiped since last time).
  function updateHeaderExpanded() {
    var h1 = document.querySelector('#hdr h1');
    if (h1) h1.setAttribute('aria-expanded', String(panelOpen));
    var chev = document.querySelector('#hdr .hdr-chev');
    if (chev) chev.textContent = panelOpen ? ' ▴' : ' ▾';
  }

  // Re-decorates the freshly rendered #hdr (the engine wipes it with
  // innerHTML='' on every render): appends the chevron to h1 and wires it as
  // the switcher trigger, and appends the header's + Add chip. Called once
  // per engine render via CityOps.onStateChange: never from a plain
  // open/close toggle, which would duplicate these onto the still-live h1.
  function decorateHeader() {
    var h = document.getElementById('hdr');
    if (!h) return;
    var h1 = h.querySelector('h1');
    if (!h1) return;
    h1.setAttribute('role', 'button');
    h1.setAttribute('tabindex', '0');
    h1.setAttribute('aria-expanded', String(panelOpen));
    // Idempotent: this used to run exactly once per engine render (which wipes
    // the h1 first), and it now also runs when the sync alert changes, which
    // does not. Appending unconditionally gave the city two chevrons.
    var oldChev = h1.querySelector('.hdr-chev');
    if (oldChev) oldChev.remove();
    h1.appendChild(el('span', 'hdr-chev', panelOpen ? ' ▴' : ' ▾'));
    h1.onclick = function () {
      panelOpen = !panelOpen;
      updateHeaderExpanded();
      renderPanel();
    };
    h1.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h1.click(); }
    };
    // The shared header's own action slot. It survives an engine render (the
    // engine only wipes #hdr-mid now), but this function still rebuilds the
    // chips each time so their labels and sync state stay current.
    var actions = document.getElementById('hdr-acts');
    if (!actions) return;
    actions.innerHTML = '';
    // The crossing between surfaces is the Cities|Trip switch in the shared
    // bar, not a chip: see markSurface() below. What is left here is what is
    // genuinely app-level rather than surface-level.
    actions.appendChild(syncChip());
    // Feature 7: Profile is app-level (one interest profile, one Claude key
    // for every city), so it is a top-level header control, not a row inside
    // the per-city switcher menu.
    var profileBtn = el('button', 'hdr-chip', 'Profile');
    profileBtn.type = 'button';
    profileBtn.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openProfileModal();
    };
    actions.appendChild(profileBtn);
    var add = el('button', 'hdr-chip', '+ Add city');
    add.type = 'button';
    add.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openAddModal();
    };
    actions.appendChild(add);
  }

  // Which surface you are on, said in the shared switch. aria-current is the
  // fact and the CSS follows it, so there is no second "active" class that
  // could point somewhere else. The peer link stays a real <a> (middle-click,
  // open in a new tab, a visible target in the status bar all matter for a
  // crossing between two halves of one app).
  function markSurface() {
    var me = document.getElementById('surf-cities');
    var other = document.getElementById('surf-trip');
    if (!me || !other) return;
    me.setAttribute('aria-current', 'page');
    me.removeAttribute('href');
    me.title = 'You are here: the city guides';
    other.title = 'Your trip: stops, stays and travel legs';
  }

  // The sync-status chip, in the shared header on BOTH surfaces (the trip side
  // has had one since 2026-08-26; the guide side kept its sync state inside
  // the Profile modal, so a stopped sync was one tap out of sight). Same
  // vocabulary either side: plain when signed out on purpose, green when the
  // account has this device's work, amber when sync has stopped.
  function syncChip() {
    var b = el('button', 'hdr-chip', 'Local only');
    b.type = 'button';
    if (!syncOn()) {
      b.disabled = true;
      b.title = 'Sync is not configured in this build.';
      return b;
    }
    if (!session) {
      b.title = 'Tap to sign in and carry your cities to your other devices.';
    } else if (readSyncAlert()) {
      b.textContent = 'Sync stuck';
      b.className = 'hdr-chip warn';
      b.title = 'Sync has stopped. Nothing is lost; open Profile for what to do.';
    } else {
      b.textContent = 'Synced';
      b.className = 'hdr-chip ok';
      b.title = lastSyncIso
        ? 'Last synced ' + new Date(lastSyncIso).toLocaleString()
        : 'Signed in. Your cities carry across your devices.';
    }
    b.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openProfileModal();
    };
    return b;
  }

  // ---- interest profile (app-only data; the engine owns its shape) ----
  // A chip list: Enter adds, each chip's x removes. get() also returns whatever
  // is still sitting unentered in the input, so a typed interest is never
  // silently dropped by pressing Save instead of Enter.
  function chipField(box, label, values, placeholder) {
    box.appendChild(el('p', 'diff', label));
    var items = values.slice();
    var list = el('div', 'chip-list');
    box.appendChild(list);
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'chip-add';
    inp.placeholder = placeholder;
    inp.setAttribute('aria-label', label);
    box.appendChild(inp);

    function draw() {
      list.innerHTML = '';
      items.forEach(function (v, i) {
        var chip = el('span', 'chipx');
        chip.appendChild(document.createTextNode(v));
        var x = el('button', null, '×');
        x.type = 'button';
        x.setAttribute('aria-label', 'Remove ' + v);
        x.onclick = function () { items.splice(i, 1); draw(); };
        chip.appendChild(x);
        list.appendChild(chip);
      });
    }
    function add() {
      var v = trim(inp.value);
      inp.value = '';
      if (!v) return;
      items.push(v);
      // normalize does the trimming, case-insensitive dedupe and the cap, so
      // the chips on screen are exactly what a Save would store.
      items = CityOps.profile.normalize({ interests: items }).interests;
      draw();
    }
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); add(); }
    };
    draw();
    return { get: function () { return items.concat(trim(inp.value) ? [trim(inp.value)] : []); } };
  }

  // One row per planning factor: its label and a level <select> on the fixed
  // five-point scale, plus a remove button. A trailing row adds a custom
  // factor at 'medium' (the neutral default: a fresh factor should not read
  // as already a blocker or already dismissed). Levels are always one of
  // CityOps.profile.FACTOR_LEVELS by construction (a <select> of exactly
  // those options), so nothing here can produce an invalid level; normalize
  // still runs on Save for the label trim/dedupe/cap every other list gets.
  function factorsField(box, factors) {
    box.appendChild(el('p', 'diff', 'Planning factors: how much each should shape picks. ' +
      'Blocker means never suggest something weak here, even as a backup. ' +
      'Not important means ignore this dimension entirely.'));
    var list = el('div', 'factor-list');
    box.appendChild(list);
    var items = factors.map(function (f) { return { label: f.label, level: f.level }; });

    function levelSelect(current, label) {
      var sel = document.createElement('select');
      sel.className = 'date-field factor-level';
      sel.setAttribute('aria-label', label + ' importance');
      CityOps.profile.FACTOR_LEVELS.forEach(function (lvl) {
        var opt = document.createElement('option');
        opt.value = lvl;
        opt.textContent = lvl;
        if (lvl === current) opt.selected = true;
        sel.appendChild(opt);
      });
      return sel;
    }

    function draw() {
      list.innerHTML = '';
      items.forEach(function (f, i) {
        var row = el('div', 'factor-row');
        row.appendChild(el('span', 'factor-label', f.label));
        var sel = levelSelect(f.level, f.label);
        sel.onchange = function () { items[i].level = sel.value; };
        row.appendChild(sel);
        var x = el('button', null, '×');
        x.type = 'button';
        x.setAttribute('aria-label', 'Remove ' + f.label);
        x.onclick = function () { items.splice(i, 1); draw(); };
        row.appendChild(x);
        list.appendChild(row);
      });
    }
    draw();

    var addRow = el('div', 'mrow');
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'chip-add';
    inp.placeholder = 'Add a custom factor';
    inp.setAttribute('aria-label', 'Custom factor name');
    var addBtn = el('button', 'ctl', 'Add');
    addBtn.type = 'button';
    function addCustom() {
      var v = trim(inp.value);
      inp.value = '';
      if (!v) return;
      items.push({ label: v, level: 'medium' });
      draw();
    }
    addBtn.onclick = addCustom;
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } };
    addRow.appendChild(inp);
    addRow.appendChild(addBtn);
    box.appendChild(addRow);

    return { get: function () { return items; } };
  }

  // The account block, at the TOP of Profile (2026-08-25, Rob). Sync used to
  // live one tap inside the city switcher, where "signed out" was invisible;
  // a session that gets dropped stops syncing silently, and the traveler sees
  // stale data with no warning. Here the state is the first thing Profile
  // says, in the words that matter to the reader: is my work reaching my
  // other devices or not.
  // ---- billing ----
  //
  // Stripe Payment Links, which means nothing on this origin creates a checkout
  // session, holds a Stripe key, or ever sees a card. The link carries the
  // Supabase user id as client_reference_id, and that id is the ONLY thing that
  // tells the webhook whose account just paid.
  //
  // The URLs are empty until the products exist in Stripe. Empty is a state the
  // UI handles rather than a bug: the plan block says checkout is not connected
  // yet and offers nothing to click, because a button that cannot succeed is
  // worse than no button. Filling these three strings is what turns billing on.
  var BILLING = {
    byok: 'https://buy.stripe.com/14A14mbpY53FgeEcl6fQI0i',
    managed: 'https://buy.stripe.com/8x2eVc9hQcw7faA0CofQI0j',
    portal: ''
  };

  // The managed tier runs AI on OUR key through a server that does not exist
  // yet. It is in the schema, the webhook maps its price, and the app can
  // already display it, but it is not offered for sale, because taking 29 USD a
  // month for a capability that is not built is a lie with a price on it. Flip
  // this the day the proxy ships.
  var BILLING_MANAGED_LIVE = false;

  function checkoutUrl(tier) {
    var base = tier === 'managed' ? BILLING.managed : BILLING.byok;
    if (!base) return '';
    if (tier === 'managed' && !BILLING_MANAGED_LIVE) return '';
    var uid = sessionUserId();
    if (!uid) return '';
    return base + (base.indexOf('?') === -1 ? '?' : '&') +
      'client_reference_id=' + encodeURIComponent(uid);
  }

  // The Supabase user id, read out of the access token. It is the subject claim
  // of a JWT this device was handed, so reading it is not a trust decision: the
  // webhook re-derives everything it needs from Stripe and the id is only a
  // pointer at a row.
  function sessionUserId() {
    if (!session || !session.access_token) return '';
    try {
      var parts = session.access_token.split('.');
      if (parts.length < 2) return '';
      var pad = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (pad.length % 4) pad += '=';
      var claims = JSON.parse(atob(pad));
      return typeof claims.sub === 'string' ? claims.sub : '';
    } catch (e) { return ''; }
  }

  // ---- entitlement ----
  //
  // ONE read, my_entitlement(), which answers for the no-row case as well: no
  // row is the trial, and a plain select on subscriptions cannot tell a trial
  // from a lapse. The database is what enforces this; the copy below is only
  // what the app SAYS, so that nobody meets a refusal without an explanation.
  var entRow = null;          // last answer, or null before the first read
  var entMissing = false;     // the SQL has not been run on this project yet
  var entInFlight = null;
  var entGateShown = {};      // one explanation per gate per page load
  var entMocked = false;      // a localhost-only state, for looking at the five

  // Until the migration is run there is nothing to enforce and nothing to say,
  // so every gate opens. That is deliberate: the app and the SQL land in
  // whichever order they land, and neither order may break the product.
  function entReady() { return !entMissing && !!entRow; }

  function entView() {
    return CityOps.entitlementKit.evaluate(
      entRow && entRow.row ? entRow.row : null,
      {
        // A mocked state describes a signed-in account by definition.
        signedIn: entMocked || !!(session && session.access_token),
        accountCreated: entRow ? entRow.account_created : null
      }
    );
  }

  // True when a write may go out. Open when signed out (nothing syncs anyway),
  // open when the migration has not run, otherwise the database's own answer.
  function entAllows() {
    if (entMocked) return !!entRow.entitled;
    if (!session || !session.access_token) return true;
    if (!entReady()) return true;
    return !!entRow.entitled;
  }


  // What a usable answer looks like. PostgREST returns a scalar-returning
  // rpc as the value itself, but a single-element array is a shape other
  // versions and proxies have been known to send, so both are accepted and
  // anything else is refused. Refused means FAIL OPEN: see entAllows.
  function entAdopt(r) {
    var row = (Object.prototype.toString.call(r) === '[object Array]') ? r[0] : r;
    if (!row || typeof row !== 'object') return null;
    if (typeof row.entitled !== 'boolean') return null;
    return row;
  }

  function fetchEntitlement() {
    // Localhost only, and that is checked inside the kit rather than here.
    // It is how the five states get LOOKED at, at both widths, without five
    // Stripe subscriptions and five rows written against a live account.
    var mock = CityOps.entitlementKit.mock(
      (typeof location !== 'undefined' && location.href) || '',
      (typeof location !== 'undefined' && location.hostname) || '');
    if (mock) { entMocked = true; entMissing = false; entRow = mock; return Promise.resolve(entRow); }
    if (!syncOn() || !session || !session.access_token) { entRow = null; return Promise.resolve(null); }
    if (entInFlight) return entInFlight;
    entInFlight = api('/rest/v1/rpc/my_entitlement', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).then(function (r) {
      entInFlight = null;
      var adopted = entAdopt(r);
      if (!adopted) {
        // Do not gate on something we cannot read.
        warn('entitlement read came back in an unexpected shape; leaving writes open', new Error('shape'));
        entMissing = true;
        entRow = null;
        return null;
      }
      entMissing = false;
      entRow = adopted;
      return entRow;
    }).catch(function (e) {
      entInFlight = null;
      // 404 and PGRST202 both mean the function is not there, which means the
      // migration has not been run. Not an error, and not a reason to gate.
      // Any 404 means the function is not there, which means the migration
      // has not been run. Not an error, and not a reason to gate.
      if (/\b404\b/.test(e.message || '')) entMissing = true;
      warn('entitlement read failed', e);
      return null;
    });
    return entInFlight;
  }

  // The one place a gate is explained. Never a bare refusal: the gate copy
  // names the free thing that still works in the same breath as the paid thing
  // that does not, and this shows both.
  function entGateText(action) {
    var g = CityOps.entitlementKit.gate(action, entView());
    return g.title + '. ' + g.body + ' ' + g.keeps;
  }

  function entGateOnce(action) {
    if (entGateShown[action]) return;
    entGateShown[action] = true;
    showSyncNotice(entGateText(action));
  }

  function accountBlock(box) {
    box.appendChild(el('p', 'section-lead', 'Account'));
    if (!syncOn()) {
      box.appendChild(el('p', 'diff', 'Sync is not configured in this build. ' +
        'Everything you do is saved in this browser only.'));
      return;
    }
    var signedIn = !!(session && session.access_token);
    var line = el('p', signedIn ? 'diff' : 'diff acct-off',
      signedIn
        ? ('Sync is on. Signed in as ' + (syncEmail || 'your account') + '.')
        : 'Sync is off: you are not signed in. Everything is saved on this device only, ' +
          'and nothing here reaches your other devices.');
    box.appendChild(line);
    var when = el('p', 'diff', lastSyncLine());
    box.appendChild(when);

    var row = el('div', 'mrow');
    if (!signedIn) {
      var inb = el('button', 'ctl to-done', 'Sign in to sync');
      inb.type = 'button';
      inb.onclick = function () { closeModalOf(box); openSignInModal(); };
      row.appendChild(inb);
    } else {
      var now = el('button', 'ctl', 'Sync now');
      now.type = 'button';
      now.onclick = function () {
        now.disabled = true;
        now.textContent = 'Syncing...';
        pullAll(true).then(function (ok) {
          now.textContent = 'Sync now';
          now.disabled = false;
          when.textContent = ok ? lastSyncLine()
            : 'Could not reach the sync service. Your work is saved on this device.';
        });
      };
      var out = el('button', 'ctl to-archived', 'Sign out');
      out.type = 'button';
      out.onclick = function () {
        signOut();
        closeModalOf(box);
        showSyncNotice('Signed out. This device keeps everything it already has.');
      };
      row.appendChild(now);
      row.appendChild(out);
    }
    box.appendChild(row);
  }

  // The plan block in Profile. It states where the account stands, what a
  // lapsed account keeps, and what the two tiers are. It never counts down and
  // it never offers a control that cannot succeed: with no checkout link
  // configured there is a sentence instead of a button.
  function planBlock(box) {
    if (!syncOn()) return;
    box.appendChild(el('p', 'section-lead', 'Plan'));

    var body = el('div', 'planblock');
    box.appendChild(body);

    function draw() {
      body.innerHTML = '';
      if (!entMocked && (!session || !session.access_token)) {
        body.appendChild(el('p', 'diff', 'Sign in above to see your plan. Everything you do stays ' +
          'in this browser until you do, and none of it is lost either way.'));
        return;
      }
      if (entMissing) {
        // Honest about our own state rather than guessing at the traveler's.
        body.appendChild(el('p', 'diff', 'Plans are not switched on for this project yet. ' +
          'Everything works as it always has.'));
        return;
      }
      if (!entRow) {
        body.appendChild(el('p', 'diff', 'Checking your plan...'));
        return;
      }

      var ev = entView();
      var s = CityOps.entitlementKit.summary(ev);
      var head = el('p', 'diff', s.headline);
      head.style.fontWeight = '600';
      body.appendChild(head);
      body.appendChild(el('p', 'diff', s.detail));

      // The AI meter, for the tier whose AI runs on OUR key and for nobody
      // else. A bring-your-own-key subscriber is spending their own money on
      // their own key, and metering that back at them would be reporting on a
      // bill we do not send. Plain words first; the token count is second,
      // because "212,000 tokens" is not something anyone plans a week around.
      var meter = CityOps.aiProxyKit.meter(aiUsageRow);
      if (meter.show) {
        var mh = el('p', 'diff', meter.headline);
        mh.style.fontWeight = '600';
        body.appendChild(mh);
        // Inline styles rather than a class: this is two rectangles used in
        // one place on each surface, and a shared stylesheet rule would be a
        // third file to keep in step for no gain. The variables are the ones
        // both surfaces already define.
        var bar = el('div', '');
        bar.style.cssText = 'height:8px;border-radius:6px;overflow:hidden;margin:6px 0;' +
          'background:var(--bg-softer);border:1px solid var(--border-light);';
        var fill = el('div', '');
        fill.style.cssText = 'height:100%;width:' + meter.pct + '%;' +
          'background:var(--' + (meter.atCap ? 'accent' : 'green') + ');';
        bar.appendChild(fill);
        bar.setAttribute('role', 'img');
        bar.setAttribute('aria-label', meter.headline + '. ' + meter.detail);
        body.appendChild(bar);
        body.appendChild(el('p', 'diff', meter.detail));
        if (meter.atCap) {
          body.appendChild(el('p', 'diff',
            CityOps.aiProxyKit.pauseMessage('over_monthly_cap', aiUsageRow)));
        }
      }

      // Manage billing, only when there is a portal to open AND a customer to
      // open it for. A comp account has neither, and is offered neither.
      if (BILLING.portal && entRow.row && entRow.row.has_customer) {
        var manage = document.createElement('a');
        manage.className = 'ctl';
        manage.href = BILLING.portal;
        manage.target = '_blank';
        manage.rel = 'noopener';
        manage.textContent = 'Manage billing';
        body.appendChild(manage);
        body.appendChild(el('p', 'diff', 'Opens Stripe, where you can change the card, ' +
          'see every invoice, or cancel. Cancelling takes one click and asks you nothing.'));
      }

      if (ev.state === 'complimentary') return;

      // What free is. Said plainly, and said to everyone, because a person
      // deciding whether to pay deserves to know what happens if they do not.
      var free = CityOps.entitlementKit.free();
      body.appendChild(el('p', 'section-lead', 'Free, with no time limit'));
      var keeps = document.createElement('ul');
      keeps.className = 'planlist';
      free.keeps.forEach(function (t) { keeps.appendChild(el('li', '', t)); });
      body.appendChild(keeps);

      body.appendChild(el('p', 'section-lead', 'What a plan adds'));
      var adds = document.createElement('ul');
      adds.className = 'planlist';
      free.pauses.forEach(function (t) { adds.appendChild(el('li', '', t)); });
      body.appendChild(adds);

      CityOps.entitlementKit.plans().forEach(function (p) {
        // The managed tier is not shown at all while its server does not exist.
        // Showing it with an asterisk would still be advertising it.
        if (p.tier === 'managed' && !BILLING_MANAGED_LIVE) return;
        var row = el('div', 'mrow');
        row.appendChild(el('span', 'diff', p.name + ', ' + p.price + '. ' + p.blurb));
        body.appendChild(row);
        var url = checkoutUrl(p.tier);
        if (url) {
          var buy = document.createElement('a');
          buy.className = 'ctl to-done';
          buy.href = url;
          buy.target = '_blank';
          buy.rel = 'noopener';
          buy.textContent = ev.state === 'lapsed' ? 'Subscribe again' : 'Subscribe';
          body.appendChild(buy);
        }
      });

      if (!checkoutUrl('byok')) {
        body.appendChild(el('p', 'diff', 'Checkout is not connected yet, so there is nothing to ' +
          'buy here today. Your account keeps working exactly as it does now until it is.'));
      }
    }

    draw();
    // The read is cheap and the modal is where a person goes to ask this, so
    // it is refreshed on open rather than trusted from whenever it last ran.
    // The meter follows the plan read, because whether to draw a meter at all
    // is a question only the tier can answer.
    fetchEntitlement().then(function () {
      draw();
      return fetchAiUsage();
    }).then(draw);
  }

  // Closes the modal that owns `box`. The account buttons live inside the
  // Profile modal but are built by a helper that has no handle on it.
  function closeModalOf(box) {
    var wrap = box.parentNode;
    if (wrap && wrap.remove) wrap.remove();
  }

  function openProfileModal() {
    var m = modalShell('Profile');
    accountBlock(m.box);
    planBlock(m.box);
    m.box.appendChild(el('p', 'section-lead', 'Your interests'));
    m.box.appendChild(el('p', 'diff', 'What you seek out in a new city, and what you never want suggested. ' +
      'Build my prompt hands this to your own AI so it finds places that match you. ' +
      'Keep it short: 5 to 12 interests research better than 30.'));
    var p = CityOps.profile.normalize(store.profile);
    var interests = chipField(m.box, 'Interests, in priority order', p.interests, 'Add an interest, then press Enter');
    var avoid = chipField(m.box, 'Avoid: never suggest these', p.avoid, 'Add something to avoid, then press Enter');
    // Seed sensible defaults the first time this device has no factors at
    // all, so a first-time visitor sees a working starting set rather than a
    // blank list; nothing is written until Save.
    var startingFactors = p.factors.length ? p.factors : CityOps.profile.defaultFactors();
    var factors = factorsField(m.box, startingFactors);
    m.box.appendChild(el('p', 'diff', 'Notes: anything that changes what a good pick means (diet, mobility, budget, who is along).'));
    var ta = document.createElement('textarea');
    ta.className = 'notes';
    ta.value = p.notes;
    ta.setAttribute('aria-label', 'Profile notes');
    m.box.appendChild(ta);

    // Feature 3: the example-city visibility override.
    m.box.appendChild(el('p', 'diff', 'The bundled example city hides automatically once you add a real city. ' +
      'Turn this on to keep it visible anyway.'));
    var exRow = el('div', 'mrow');
    var exLabel = document.createElement('label');
    var exCheck = document.createElement('input');
    exCheck.type = 'checkbox';
    exCheck.checked = p.showExample;
    exLabel.appendChild(exCheck);
    exLabel.appendChild(document.createTextNode(' Show example city'));
    exRow.appendChild(exLabel);
    m.box.appendChild(exRow);

    m.box.appendChild(el('p', 'diff', (session && session.access_token)
      ? 'Saved to your account.'
      : 'Saved in this browser. Sign in above to carry your profile across devices.'));

    // The Claude API key. Saved immediately on blur, independent of the
    // profile Save button below, so leaving the modal by any path never loses
    // it. It keeps its own storage (never store.profile), and since
    // 2026-08-25 it also rides in the profile sync row so a cache clear no
    // longer means typing it again. It never enters a city, an export, a
    // prompt or any other sync row.
    m.box.appendChild(el('p', 'section-lead', 'Claude API key'));
    function keyStatusText() {
      var hasKey = !!loadApiKey();
      if (!hasKey) {
        return aiTransportNow() === 'proxy'
          ? 'No key saved, and your plan does not need one: AI runs on our key.'
          : 'No key saved yet.';
      }
      return (session && session.access_token)
        ? 'Key saved and synced to your account.'
        : 'Key saved on this device. Sign in above to carry it to your other devices.';
    }
    m.box.appendChild(el('p', 'diff', 'Used only by "Generate with Claude" when adding or editing a city. ' +
      'It is sent to Anthropic\'s API directly from your device, and, while you are signed in, stored in ' +
      'your own account so a cleared browser does not lose it. It never travels with a city, an exported ' +
      'guide or a prompt.'));
    m.box.appendChild(el('p', 'diff', 'One profile and one key for all your cities.'));
    if (aiTransportNow() === 'proxy') {
      // Said plainly, because it is a spending decision and it is not obvious:
      // a saved key WINS. Somebody who types one in is telling us which bill
      // they want this on, and quietly keeping them on ours would be deciding
      // it for them in the other direction.
      m.box.appendChild(el('p', 'diff', 'Your plan runs AI on our key, so you do not need one of ' +
        'these. If you save one anyway, this device uses yours instead and your included ' +
        'monthly AI stays untouched. Clear it to go back to ours.'));
    }
    var keyRow = el('div', 'mrow');
    var keyInp = document.createElement('input');
    keyInp.type = 'password';
    keyInp.className = 'date-field key-field';
    keyInp.placeholder = 'sk-ant-...';
    keyInp.autocomplete = 'off';
    keyInp.value = loadApiKey();
    keyInp.setAttribute('aria-label', 'Claude API key');
    keyRow.appendChild(keyInp);
    var keyMsg = el('span', 'diff', keyStatusText());
    keyInp.onblur = function () {
      // Only a real change is a change: re-blurring an untouched field must
      // not stamp a new time and win a reconcile against a newer device.
      if (trim(keyInp.value) !== loadApiKey()) saveApiKey(trim(keyInp.value));
      keyMsg.textContent = keyStatusText();
    };
    var keyClear = el('button', 'ctl', 'Clear key');
    keyClear.type = 'button';
    keyClear.onclick = function () {
      keyInp.value = '';
      if (loadApiKey()) saveApiKey('');
      keyMsg.textContent = keyStatusText();
    };
    keyRow.appendChild(keyClear);
    m.box.appendChild(keyRow);
    m.box.appendChild(keyMsg);

    var row = el('div', 'mrow');
    var save = el('button', 'ctl to-done', 'Save');
    save.type = 'button';
    save.onclick = function () {
      var next = CityOps.profile.normalize({
        interests: interests.get(), avoid: avoid.get(), factors: factors.get(),
        notes: ta.value, showExample: exCheck.checked
      });
      // No-op save: compare against the profile as loaded, `updated` removed
      // from both sides, so a modal opened and closed unchanged never stamps
      // a new timestamp or schedules a push.
      var before = JSON.stringify(Object.assign({}, p, { updated: undefined }));
      var after = JSON.stringify(Object.assign({}, next, { updated: undefined }));
      if (before === after) { m.close(); return; }
      next.updated = new Date().toISOString();
      store.profile = next;
      saveStore(store);
      schedulePush('profile');
      m.close();
      // The example's visibility can change as a direct result of this save
      // (the toggle flipped, or factors/interests changed nothing there but
      // cost nothing to refresh): re-render so the switcher panel reflects it
      // immediately rather than on the next unrelated render.
      renderPanel();
      showSyncNotice('Profile saved.');
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(save);
    row.appendChild(cancel);
    if (!exampleVisible()) {
      var ex = el('button', 'ctl', 'Load example city');
      ex.type = 'button';
      ex.onclick = function () { m.close(); loadExampleCity(); };
      row.appendChild(ex);
    }
    m.box.appendChild(row);
  }

  // PROMPT.md, embedded by the assembler as a text/plain block so the prompt
  // builders work offline. Same escaping contract as the guide template: the
  // assembler writes `<\/script`, this reverses exactly one layer.
  function promptTemplateText() {
    var node = document.getElementById('prompt-template');
    if (!node) return null;
    var raw = node.textContent;
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    return raw.replace(/<\\\/script/g, '<' + '/script');
  }

  // ---- Enrich: re-run an existing city through the traveler's own AI ----
  // Two prompt builders and one paste box. No network and no AI call from the
  // app: the same zero-cost paste workflow Build my prompt uses.
  //
  // MERGE TARGET (the one decision worth spelling out): the delta is merged
  // into the EFFECTIVE data (the city's canonical store copy with any in-app
  // dataOverride applied), and the result is written back as the city's new
  // canonical data with the override cleared. That mirrors the Replace path in
  // Add city, and it is the only option that cannot lose work:
  //   - merging into the canonical copy alone would leave a stale override
  //     still masking it through effectiveData(), so the traveler would see no
  //     new items at all;
  //   - merging into the override alone would keep the additions out of the
  //     synced data row, so they would never reach another device.
  // Live planning state (done marks, renames, day arrangement) is keyed by item
  // id in a separate store that neither mergeDelta nor this function touches,
  // so it survives untouched by construction.
  // The ONE place in the app that writes a changed city record. Enrich's Apply
  // was the only caller when it was inline; adding a place by hand is the
  // second, and factoring it out is what stops the two drifting on the four
  // things that have to happen together (canonical write, override clear,
  // sync push, reboot). Returns the city id it wrote, which is not always
  // activeId: appStore.add re-derives the id from the city name and dates.
  function commitCityData(newData) {
    var added = CityOps.appStore.add(store, newData);   // stamps updatedAt now
    store = added.store;
    saveStore(store);
    // The override's content is part of the canonical data now, so clearing
    // it changes nothing on screen and stops it masking future merges.
    var cs = CityOps.makeStore(added.cityId, LS);
    var cst = cs.load();
    if (cst.dataOverride) { cst.dataOverride = null; cs.save(cst); }
    schedulePush('data', added.cityId);
    // Same scroll-preserve pattern as applyPull: activateCity reboots the
    // city (CityOps.boot), which re-renders from the top.
    var y = 0;
    try { y = window.scrollY || window.pageYOffset || 0; } catch (e) {}
    activateCity(added.cityId);   // reboots the city; rewrites #notice
    try { window.scrollTo(0, y); } catch (e2) {}
    return added.cityId;
  }

  function enrichSummaryText(s) {
    var parts = [];
    if (s.added) parts.push(s.added + ' added');
    if (s.skipped) parts.push(s.skipped + ' skipped');
    if (s.sectionsAdded) parts.push(s.sectionsAdded + (s.sectionsAdded === 1 ? ' section' : ' sections'));
    if (s.intelApplied) parts.push(s.intelApplied + ' intel applied');
    if (s.intelSkipped) parts.push(s.intelSkipped + ' intel skipped');
    // Applied counts a rating written onto an item the guide has, including
    // a re-run that writes the same numbers again (a rating is a reading
    // taken on a date; re-taking it is work done, not work skipped).
    // Skipped counts only ids this guide does not have.
    if (s.ratingsApplied) parts.push(s.ratingsApplied + ' ratings applied');
    if (s.ratingsSkipped) parts.push(s.ratingsSkipped + ' ratings skipped');
    return parts.length ? parts.join(', ') : 'nothing new';
  }

  // The copy / download / clipboard-fallback trio, shared by every modal that
  // hands a built prompt to the traveler. Same stub-friendly pattern Build my
  // prompt uses: try the async clipboard, and when it is unreachable (an
  // insecure origin, a denied permission, an old engine) drop a read-only
  // textarea above the message and select its contents, so there is always a
  // way to get the prompt out of the app. `box` is the modal body, `msg` the
  // status line already appended to it.
  function makePromptOut(box, msg) {
    var fallbackTa = null;
    function showFallback(text) {
      if (!fallbackTa) {
        fallbackTa = document.createElement('textarea');
        fallbackTa.className = 'promptout';
        fallbackTa.readOnly = true;
        fallbackTa.setAttribute('aria-label', 'Generated prompt');
        box.insertBefore(fallbackTa, msg);
      }
      fallbackTa.value = text;
      msg.textContent = 'Could not reach the clipboard. The prompt is selected above: copy it, ' +
        'paste it into Claude or ChatGPT, then paste the JSON it returns below.';
      try { fallbackTa.focus(); fallbackTa.select(); } catch (e) {}
    }
    return {
      fallback: showFallback,
      copy: function (text) {
        var wrote = null;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) wrote = navigator.clipboard.writeText(text);
        } catch (e) { wrote = null; }
        if (wrote && typeof wrote.then === 'function') {
          wrote.then(function () {
            msg.textContent = 'Copied. Paste it into Claude or ChatGPT, then paste the JSON it returns below.';
          }, function () { showFallback(text); });
        } else {
          showFallback(text);
        }
      },
      download: function (text, filename) {
        var blob = new Blob([text], { type: 'text/markdown' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        var freeUrl = a.href;
        setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
        msg.textContent = 'Downloaded ' + filename + '. Paste it into Claude or ChatGPT, ' +
          'then paste the JSON it returns below.';
      }
    };
  }

  function openEnrichModal() {
    if (!activeId || !has(store.cities, activeId)) return;
    var m = modalShell('Enrich ' + store.cities[activeId].city.name);
    m.box.appendChild(el('p', 'diff', 'Build a prompt for a second pass over this city, run it in your AI, ' +
      'and paste the result back. New items are added and nothing you have already planned is disturbed.'));

    var msg = el('div', 'diff', '');
    var out = makePromptOut(m.box, msg);
    var copyOut = out.copy, downloadOut = out.download;
    // The prompts describe the city as it stands right now, override included,
    // which is the same data the merge will run against.
    function currentData() {
      var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
      return CityOps.effectiveData(store.cities[activeId], st);
    }
    function build(kind) {
      var tpl = promptTemplateText();
      if (!tpl) {
        msg.textContent = 'This build has no prompt template embedded. Use PROMPT.md from the repo.';
        return null;
      }
      try {
        if (kind === 'intel') return CityOps.promptKit.buildIntelPassPrompt(tpl, currentData());
        if (kind === 'ratings') return CityOps.promptKit.buildRatingsPassPrompt(tpl, currentData());
        return CityOps.promptKit.buildInterestsDeltaPrompt(tpl, currentData(), store.profile);
      } catch (e) {
        msg.textContent = e.message;
        return null;
      }
    }
    // ---- Run with Claude (Phase 3, feature 6): same prompt, called in-app ----
    // Deliberately reuses the paste-and-Apply path rather than writing a
    // second apply codepath: the result fills the SAME textarea the paste
    // flow reads, and the traveler still clicks the same Apply button below.
    // That keeps exactly one tested place that ever calls mergeDelta and
    // writes the merged city, and it means a delta from Claude gets the same
    // "review the summary before it lands" moment a pasted delta always got.
    function runWithClaude(kind, btn) {
      if (!aiOneTapReady()) { msg.textContent = aiNoTransportText(); return; }
      var apiKey = loadApiKey();
      var text = build(kind);
      if (text === null) return;
      var origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Running...';
      msg.textContent = 'Starting...';
      callClaudeStream(text, apiKey, function (p) {
        msg.textContent = (p.kind === 'thinking' ? 'Thinking... ' : 'Writing... ') +
          p.totalChars + ' characters so far.';
      }).then(function (resultText) {
