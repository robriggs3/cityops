<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityOps</title>
<style>
/*CITYOPS_CSS*/

  /* --- app shell: multi-city switcher (index.html only) --- */
  /* Dense in-header controls: the h1 itself is the switcher trigger (chevron
     appended after it), and a translucent chip in the header's top-right opens
     Add-city. Both live inside #hdr, which the engine fully replaces
     (innerHTML='') on every render, so decorateHeader() re-appends them from
     CityOps.onStateChange every time — see the appshell script below. The
     header must not grow to fit these; they overlay the existing chrome. */
  #hdr{position:relative;}
  #hdr h1{cursor:pointer; display:inline-flex; align-items:center; gap:2px;}
  .hdr-chev{font-size:.85rem; opacity:.85;}
  .hdr-add{position:absolute; top:24px; right:20px; font:inherit; font-size:.75rem; font-weight:700;
    color:#fff; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4);
    border-radius:20px; padding:5px 11px; cursor:pointer; white-space:nowrap;}
  .hdr-add:hover{background:rgba(255,255,255,.25);}

  /* Dropdown panel: floats directly under the header (does not add header
     height); #citybar is its host, positioned inside .wrap right after
     #hdr so it shares the content width. */
  #citybar{position:relative;}
  .citypanel{position:absolute; top:6px; left:0; right:0; z-index:60;
    background:var(--bg-card); border:1px solid var(--border-light); border-radius:12px;
    overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.12);}
  .cityrow{display:block; width:100%; font:inherit; text-align:left; color:var(--text);
    background:none; border:none; border-bottom:1px solid var(--border-light);
    padding:11px 14px; cursor:pointer;}
  .cityrow:last-of-type{border-bottom:none;}
  .cityrow:hover{background:var(--bg-softer);}
  .cityrow.current{background:var(--accent-soft);}
  .cityrow .cname{font-weight:600; font-size:.9rem;}
  .cityrow.current .cname{font-weight:800;}
  .cityrow .dot{display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-left:7px; vertical-align:middle;}
  .cityrow .cdates{display:block; font-size:.76rem; color:var(--text-3); margin-top:1px;}
  .cityact{display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px;
    background:var(--bg-softer); border-top:1px solid var(--border-light);}
  .cityact button{font:inherit; font-size:.78rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:5px 13px; cursor:pointer;}
  .cityact button:hover{border-color:var(--accent);}
  .blank-cc{width:56px; flex:0 0 auto; text-transform:uppercase;}
  .name-confirm{width:100%; font:inherit; font-size:.9rem; padding:8px 10px; margin-top:8px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal .ctl[disabled]{opacity:.45; cursor:not-allowed; border-color:var(--border-light);}
  .modal .ctl[disabled]:hover{border-color:var(--border-light);}
  @media (max-width: 430px){
    .hdr-add{top:17px; right:14px; padding:4px 9px; font-size:.7rem;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="notice"></div>
  <header id="hdr"></header>
  <div id="citybar"></div>
  <div class="toolbar" id="toolbar"></div>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="modal"></div>

<script id="app">
<!--CITYOPS_ENGINE-->
</script>

<!--CITYOPS_TEMPLATE-->

<script id="appshell">
(function () {
  'use strict';

  var APP_KEY = 'cityops.app.v1';

  // Bundled first-run city: the same example block standalone template.html ships
  // with, so a stranger opening the app sees a working guide immediately.
  var SEED_CITY = {
    "schema": 1,
    "city": {
      "name": "Example City", "country": "XX",
      "dates": {"from": "2026-01-01", "to": "2026-01-07"},
      "accommodation": {"name": "Example Stay", "lat": 0, "lng": 0},
      "currency": {"code": "USD", "usd": 1},
      "notes": ["This is an example city. Tap the city name above, then Add city, and paste your own generated JSON."]
    },
    "sections": [
      {"id": "dinner", "label": "Dinner", "icon": "🍽️"}
    ],
    "items": [{
      "id": "example",
      "section": "dinner",
      "status": "plan",
      "day": "2026-01-02",
      "when": "First evening",
      "name": "Example Restaurant",
      "price": {"text": "~$20"},
      "note": "Replace me. This item exists so the empty template renders.",
      "hours": {"text": "12:00-23:00 daily", "class": "late"},
      "tags": [],
      "links": [],
      "place_id": null,
      "verified": null
    }]
  };

  var LS = null;
  try { LS = (typeof localStorage !== 'undefined') ? localStorage : null; }
  catch (e) { LS = null; }

  var memStore = null;   // session fallback when localStorage refuses writes
  var store = null;      // {cities, order, active}
  var activeId = null;
  var panelOpen = false;
  var docClickBound = false; // outside-click listener is bound only while the panel is open

  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function loadStore() {
    var raw = null;
    if (LS) { try { raw = LS.getItem(APP_KEY); } catch (e) { raw = null; } }
    var obj = null;
    if (raw) { try { obj = JSON.parse(raw); } catch (e) { obj = null; } }
    if (!obj) obj = memStore;
    return CityOps.appStore.normalize(obj);
  }

  function saveStore(s) {
    memStore = s;
    if (LS) { try { LS.setItem(APP_KEY, JSON.stringify(s)); } catch (e) {} }
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function hashCity() {
    var m = String(location.hash || '').match(/^#city=(.+)$/);
    if (!m) return null;
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  function setHash(id) {
    var target = '#city=' + encodeURIComponent(id);
    if (location.hash === target) return;
    try {
      history.replaceState(null, '', location.pathname + location.search + target);
    } catch (e) {
      location.hash = target;
    }
  }

  // Switching cities means: remember it, reflect it in the URL, hand the engine
  // a fresh copy of that city's data. The engine reloads that city's own
  // cityops.<cityId>.v1 state, so progress per city is preserved untouched.
  function activateCity(id) {
    store.active = id;
    saveStore(store);
    activeId = id;
    setHash(id);
    // CityOps.boot -> rerender() calls CityOps.onStateChange() itself (see
    // below), which re-renders the panel and decorates the fresh header; no
    // separate call needed here.
    CityOps.boot(clone(store.cities[id]));
  }

  // Closing on an outside click: bound to document only while the panel is
  // open, and removed as soon as it closes (by any path), so it never lingers.
  // The header counts as "inside" too: it now hosts the trigger (h1) and the
  // Add chip, and those already have their own click handlers.
  function onOutsideClick(e) {
    var bar = document.getElementById('citybar');
    var hdr = document.getElementById('hdr');
    var insideBar = bar && bar.contains(e.target);
    var insideHdr = hdr && hdr.contains(e.target);
    if (panelOpen && !insideBar && !insideHdr) {
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
    }
  }

  // Renders (or clears) the dropdown panel: city list + Remove city. Add city
  // now lives in the header chip, so the panel's own action row only has Remove.
  function renderPanel() {
    var bar = document.getElementById('citybar');
    bar.innerHTML = '';
    if (!panelOpen) {
      if (docClickBound) { document.removeEventListener('click', onOutsideClick, true); docClickBound = false; }
      return;
    }
    var panel = el('div', 'citypanel');
    store.order.forEach(function (id) {
      var d = store.cities[id];
      var isCurrent = id === activeId;
      var prow = el('button', 'cityrow' + (isCurrent ? ' current' : ''));
      prow.type = 'button';
      var nameWrap = el('span', 'cname', d.city.name);
      if (isCurrent) nameWrap.appendChild(el('span', 'dot'));
      prow.appendChild(nameWrap);
      prow.appendChild(el('span', 'cdates', CityOps.fmtRange(d.city.dates)));
      prow.onclick = function () {
        panelOpen = false;
        // activateCity triggers a real engine render, which calls
        // decorateHeader() via onStateChange and updates aria-expanded there;
        // only the same-city no-op path needs to refresh it itself.
        if (id === activeId) { updateHeaderExpanded(); renderPanel(); return; }
        activateCity(id);
      };
      panel.appendChild(prow);
    });
    var acts = el('div', 'cityact');
    var add = el('button', 'cityadd', '+ Add city');
    add.type = 'button';
    add.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openAddModal(); };
    acts.appendChild(add);
    var rm = el('button', null, 'Remove city');
    rm.type = 'button';
    rm.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openRemoveModal(); };
    acts.appendChild(rm);
    panel.appendChild(acts);
    bar.appendChild(panel);

    if (!docClickBound) {
      // Deferred: adding the listener synchronously would let it observe the
      // very click (bubbling to document) that just opened the panel.
      setTimeout(function () { document.addEventListener('click', onOutsideClick, true); }, 0);
      docClickBound = true;
    }
  }

  // Just refreshes the aria-expanded flag on the current h1 in place. Toggling
  // the panel does not itself trigger an engine render, so this must NOT go
  // through decorateHeader() below (that appends the chevron/chip afresh and
  // would duplicate them on an h1 the engine hasn't wiped since last time).
  function updateHeaderExpanded() {
    var h1 = document.querySelector('#hdr h1');
    if (h1) h1.setAttribute('aria-expanded', String(panelOpen));
  }

  // Re-decorates the freshly rendered #hdr (the engine wipes it with
  // innerHTML='' on every render): appends the chevron to h1 and wires it as
  // the switcher trigger, and appends the header's + Add chip. Called once
  // per engine render via CityOps.onStateChange — never from a plain
  // open/close toggle, which would duplicate these onto the still-live h1.
  function decorateHeader() {
    var h = document.getElementById('hdr');
    if (!h) return;
    var h1 = h.querySelector('h1');
    if (!h1) return;
    h1.setAttribute('role', 'button');
    h1.setAttribute('tabindex', '0');
    h1.setAttribute('aria-expanded', String(panelOpen));
    h1.appendChild(el('span', 'hdr-chev', ' ▾'));
    h1.onclick = function () {
      panelOpen = !panelOpen;
      updateHeaderExpanded();
      renderPanel();
    };
    h1.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h1.click(); }
    };
    var add = el('button', 'hdr-add', '+ Add city');
    add.type = 'button';
    add.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openAddModal();
    };
    h.appendChild(add);
  }

  function openAddModal() {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, 'Add a city'));
    box.appendChild(el('p', 'diff', 'Start blank now and fill it with generated data later, or paste ready-made city JSON below.'));

    var brow = el('div', 'mrow');
    var bn = document.createElement('input');
    bn.type = 'text'; bn.className = 'date-field'; bn.placeholder = 'City name';
    var bc = document.createElement('input');
    bc.type = 'text'; bc.className = 'date-field blank-cc'; bc.placeholder = 'CC'; bc.maxLength = 2;
    brow.appendChild(bn); brow.appendChild(bc);
    box.appendChild(brow);
    var drow = el('div', 'mrow');
    var bf = document.createElement('input'); bf.type = 'date'; bf.className = 'date-field';
    var bt2 = document.createElement('input'); bt2.type = 'date'; bt2.className = 'date-field';
    drow.appendChild(el('span', 'diff', 'From')); drow.appendChild(bf);
    drow.appendChild(el('span', 'diff', 'To')); drow.appendChild(bt2);
    box.appendChild(drow);
    var bmsg = el('div', 'diff', '');
    box.appendChild(bmsg);
    var brow2 = el('div', 'mrow');
    var bcreate = el('button', 'ctl to-done', 'Create blank city');
    bcreate.type = 'button';
    box.appendChild(brow2);
    brow2.appendChild(bcreate);

    box.appendChild(el('p', 'diff', 'Or paste schema v1 city JSON (the output of PROMPT.md). Either way it is saved in this browser only.'));
    var ta = document.createElement('textarea');
    box.appendChild(ta);
    var msg = el('div', 'diff', '');
    box.appendChild(msg);
    var row = el('div', 'mrow');
    box.appendChild(row);

    bcreate.onclick = function () {
      var data;
      try { data = CityOps.appStore.blankCity(bn.value, bc.value, bf.value, bt2.value); }
      catch (e) { bmsg.textContent = 'Invalid: ' + e.message; return; }
      handleParsed(data);
    };

    function close() { wrap.remove(); }

    // `clearOverride`: only the Replace path passes this. Replacing a city with
    // freshly pasted file data must win outright; a stale in-app dataOverride
    // from before the replace would otherwise keep masking the new data via
    // effectiveData(), so the city's own store is cleared right after the
    // replace commits (Keep-both never needs this: it derives a brand-new id
    // with no prior state to clear).
    function commit(data, clearOverride) {
      var res = CityOps.appStore.add(store, data);
      store = res.store;
      saveStore(store);
      close();
      if (clearOverride) {
        var s = CityOps.makeStore(res.cityId, LS);
        var st = s.load();
        st.dataOverride = null;
        s.save(st);
      }
      activateCity(res.cityId);
    }

    function askDuplicate(data, id) {
      msg.textContent = '"' + store.cities[id].city.name + '" is already saved under the id ' +
        id + '. Replace it with the pasted data, or keep both?';
      row.innerHTML = '';
      var rep = el('button', 'ctl', 'Replace');
      rep.type = 'button';
      rep.onclick = function () { commit(data, true); };
      var both = el('button', 'ctl', 'Keep both');
      both.type = 'button';
      both.onclick = function () {
        var copy = clone(data);
        var guard = 0;
        do {
          copy.city.name = CityOps.appStore.keepBothName(copy.city.name);
          guard++;
        } while (has(store.cities, CityOps.cityId(copy)) && guard < 20);
        if (has(store.cities, CityOps.cityId(copy))) {
          // Fail closed: 20 renames were not enough to escape the collision.
          // Do not commit a city that would silently overwrite another one.
          msg.textContent = 'Could not find a free name for "' + copy.city.name +
            '" after 20 tries. Rename the city in the pasted JSON and try again.';
          return;
        }
        commit(copy);
      };
      var cancel = el('button', 'ctl', 'Cancel');
      cancel.type = 'button';
      cancel.onclick = close;
      row.appendChild(rep);
      row.appendChild(both);
      row.appendChild(cancel);
    }

    function handleParsed(data) {
      var id = CityOps.cityId(data);
      if (has(store.cities, id)) { askDuplicate(data, id); return; }
      commit(data);
    }

    var apply = el('button', 'ctl', 'Apply');
    apply.type = 'button';
    apply.onclick = function () {
      var res = CityOps.parse(ta.value);
      if (!res.data) { msg.textContent = 'Invalid:\n' + res.errors.join('\n'); return; }
      handleParsed(res.data);
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = close;
    row.appendChild(apply);
    row.appendChild(cancel);

    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) close(); };
    host.appendChild(wrap);
    bn.focus();
  }

  function openRemoveModal() {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var cur = store.cities[activeId];
    if (!cur) return;
    var name = cur.city.name;
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, 'Remove ' + name));
    box.appendChild(el('p', 'diff', 'This deletes the city and its saved progress on this device. ' +
      'Type the city name exactly to enable the Remove button.'));
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'name-confirm';
    inp.placeholder = name;
    inp.setAttribute('aria-label', 'Type the city name to confirm removal');
    box.appendChild(inp);
    var row = el('div', 'mrow');
    var rm = el('button', 'ctl to-archived', 'Remove');
    rm.type = 'button';
    rm.disabled = true;
    rm.title = 'Type "' + name + '" to enable';
    inp.oninput = function () {
      var ok = inp.value === name;
      rm.disabled = !ok;
      rm.title = ok ? '' : 'Type "' + name + '" to enable';
    };
    rm.onclick = function () {
      if (inp.value !== name) return;
      var gone = activeId;
      store = CityOps.appStore.remove(store, gone);
      if (LS) { try { LS.removeItem('cityops.' + gone + '.v1'); } catch (e) {} }
      if (!store.order.length) {
        var res = CityOps.appStore.add(store, clone(SEED_CITY));
        store = res.store;
        store.active = res.cityId;
      }
      saveStore(store);
      wrap.remove();
      activateCity(store.active);
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = function () { wrap.remove(); };
    row.appendChild(rm);
    row.appendChild(cancel);
    box.appendChild(row);
    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    host.appendChild(wrap);
    inp.focus();
  }

  // The assembler embeds the fully assembled standalone template here, with every
  // closing script tag escaped so the text/plain block cannot end early. Undo that,
  // drop the exported city JSON into the data block, and the result is a
  // self-contained guide file identical to what tools/embed.js produces.
  // (Never write that closing sequence literally in this file: it would end THIS
  // script element. The assembler counts script tags to keep that honest.)
  function exportStandalone() {
    var node = document.getElementById('guide-template');
    if (!node) return;
    var closeTag = '<' + '/script'; // assembled, never written literally: see above
    var raw = node.textContent;
    // The assembler pads the block with one newline on each side; strip exactly
    // those so the download is byte-identical to what tools/embed.js writes.
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    var tpl = raw.replace(/<\\\/script/g, closeTag);
    var base = store.cities[activeId];
    // Prefer the live in-memory state of the booted city: in private/incognito
    // mode makeStore() falls back to a per-instance memory cache, and a FRESH
    // makeStore() call here would get its own empty cache, silently dropping
    // any session-only progress. Fall back to a fresh read only if nothing is
    // currently booted (defensive; exportStandalone is only wired up in-app).
    var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
    var out = CityOps.buildExport(CityOps.effectiveData(base, st), st);
    // Escape every "</" so a closing-script-like sequence inside item data
    // cannot break out of the embedded data block. "\/" is a valid JSON escape
    // for "/", so this is lossless: JSON.parse of the escaped text reproduces
    // the original object exactly.
    var json = JSON.stringify(out, null, 2).replace(/<\//g, '<\\/');
    var html = tpl.replace('__CITY_DATA__', function () { return json; });
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = CityOps.cityId(out) + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
  }

  // Set before the first boot so the engine's toolbar picks up the app-only button.
  window.CityOpsApp = { exportStandalone: exportStandalone };

  // Re-decorate the header and re-render the panel on every engine state
  // change (not just on city switch, which activateCity already triggers via
  // CityOps.boot -> rerender -> this hook): this catches things like the
  // Edit-dates modal applying a stay override, and future-proofs any M2 sync
  // path that mutates state outside the app shell's own click handlers. The
  // engine wipes #hdr on every render, so decorateHeader() must re-run here
  // every time too, not just once at startup.
  CityOps.onStateChange = function () { renderPanel(); decorateHeader(); };

  function start() {
    store = loadStore();
    if (!store.order.length) {
      var seeded = CityOps.appStore.add(store, clone(SEED_CITY));
      store = seeded.store;
      store.active = seeded.cityId;
      saveStore(store);
    }
    var wanted = hashCity();
    var target = CityOps.appStore.resolveStartCity(store, wanted);
    activateCity(target);
    window.addEventListener('hashchange', function () {
      var id = hashCity();
      if (id && has(store.cities, id) && id !== activeId) activateCity(id);
    });
  }

  // Offline support: register the app-shell service worker. Feature-detected
  // (older browsers just skip it) and gated to http/https so opening the app
  // as a local file:// (the standalone-guide path) never tries and never
  // logs a scary console error. Silent on failure: a registration error
  // should not block the app from working online.
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    try {
      navigator.serviceWorker.register('./sw.js');
    } catch (e) {}
  }

  start();
  registerServiceWorker();
})();
</script>
</body>
</html>
