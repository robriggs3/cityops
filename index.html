          }).then(function (text) {
            var res = CityOps.fetchTextToCity(text);
            if (!res.data) {
              btn.disabled = false;
              msg.textContent = 'Could not load ' + c.name + ': ' + res.errors.join('\n');
              return;
            }
            // Same funnel as paste and Generate: duplicate detection (Replace
            // / Keep both) still runs if this city is already saved.
            commitFromForm(res.data);
          }).catch(function () {
            btn.disabled = false;
            msg.textContent = 'Could not load ' + c.name + ' right now.';
          });
        };
        onSiteRow.appendChild(btn);
      });
      if (onSiteRow.children.length) {
        onSiteWrap.appendChild(el('p', 'diff', 'On this site:'));
        onSiteWrap.appendChild(onSiteRow);
      }
    }).catch(function () { /* offline, no manifest, or blocked: hide silently */ });

    box.appendChild(el('p', 'diff', 'Or paste schema v1 city JSON (the output of PROMPT.md). ' + whereItGoes));
    var ta = document.createElement('textarea');
    box.appendChild(ta);

    // ---- Load from link (no-paste import, part 2): fetch a URL instead of
    // pasting. Covers both a direct cities/<file>.json link and a raw .md
    // guide URL (JSON wrapped in a ```json fence, the shape PROMPT.md output
    // takes), via CityOps.fetchTextToCity's parse-then-extract fallback.
    var linkInput = document.createElement('input');
    linkInput.type = 'url';
    linkInput.className = 'date-field link-field';
    linkInput.placeholder = 'https://example.com/city.json';
    linkInput.setAttribute('aria-label', 'City JSON URL');
    var linkBtn = el('button', 'ctl', 'Load from link');
    linkBtn.type = 'button';
    linkBtn.disabled = true; // never a dead click: only live once the field has text
    linkInput.oninput = function () { linkBtn.disabled = !trim(linkInput.value); };
    function setLinkLoading(on) {
      linkBtn.disabled = on || !trim(linkInput.value);
      linkBtn.textContent = on ? 'Loading...' : 'Load from link';
    }
    linkBtn.onclick = function () {
      var url = trim(linkInput.value);
      if (!url) return;
      setLinkLoading(true);
      fetch(url).then(function (r) {
        if (!r.ok) throw new Error('link ' + r.status);
        return r.text();
      }).then(function (text) {
        setLinkLoading(false);
        var res = CityOps.fetchTextToCity(text);
        if (res.kind === 'not-json') {
          msg.textContent = 'That link is not JSON. Paste the JSON directly above, or point the link straight at a .json file.';
          return;
        }
        if (res.kind === 'invalid') {
          msg.textContent = 'That link is JSON, but not a valid city guide:\n- ' + res.errors.join('\n- ');
          return;
        }
        commitFromForm(res.data);
      }).catch(function () {
        setLinkLoading(false);
        // The one failure mode fetchTextToCity cannot see: the network call
        // itself never completed (offline, DNS, or the server's CORS policy
        // blocked the read from this origin).
        msg.textContent = 'That site does not allow apps to read it; download the file and use a link from this site instead.';
      });
    };
    box.appendChild(el('p', 'diff', 'Or load from a link: a URL to a hosted city JSON file, or a page with one in a ```json block.'));
    var linkRow = el('div', 'mrow');
    linkRow.appendChild(linkInput);
    linkRow.appendChild(linkBtn);
    box.appendChild(linkRow);

    var msg = el('div', 'diff', '');
    box.appendChild(msg);
    var row = el('div', 'mrow');
    box.appendChild(row);

    function close() { wrap.remove(); }

    // `clearOverride`: only the Replace path (and a same-id Edit commit) pass
    // this. Replacing a city with freshly generated/pasted data must win
    // outright; a stale in-app dataOverride from before the replace would
    // otherwise keep masking the new data via effectiveData(), so the city's
    // own store is cleared right after the replace commits (Keep-both never
    // needs this: it derives a brand-new id with no prior state to clear).
    // `keepOpen` skips the auto-close: the Generate path stays open so its
    // own success message and Download button remain visible.
    function commit(data, clearOverride, keepOpen, afterCommitFn) {
      var res = CityOps.appStore.add(store, data);
      store = res.store;
      saveStore(store);
      if (!keepOpen) close();
      if (clearOverride) {
        var s = CityOps.makeStore(res.cityId, LS);
        var st = s.load();
        st.dataOverride = null;
        s.save(st);
      }
      activateCity(res.cityId);
      // A pasted, replaced, blank or generated city is a local data edit:
      // queue the upsert.
      schedulePush('data', res.cityId);
      // Clearing the override rewrote this city's STATE too, and activateCity
      // just took that write as the new baseline, so noteStateChange will
      // never report it. Queue it explicitly: otherwise the other device keeps
      // showing the replaced data (masked by its own stale override) until
      // some later pull happens to reconcile the stamps.
      if (clearOverride) schedulePush('state', res.cityId);
      if (afterCommitFn) afterCommitFn(res.cityId);
    }

    function askDuplicate(data, id, keepOpen, afterCommitFn) {
      msg.textContent = '"' + store.cities[id].city.name + '" is already saved under the id ' +
        id + '. Replace it with this data, or keep both?';
      row.innerHTML = '';
      var rep = el('button', 'ctl', 'Replace');
      rep.type = 'button';
      rep.onclick = function () { commit(data, true, keepOpen, afterCommitFn); };
      var both = el('button', 'ctl', 'Keep both');
      both.type = 'button';
      both.onclick = function () {
        var copy = clone(data);
        var guard = 0;
        do {
          copy.city.name = CityOps.appStore.keepBothName(copy.city.name);
          guard++;
        } while (has(store.cities, CityOps.cityId(copy)) && guard < 20);
        if (has(store.cities, CityOps.cityId(copy))) {
          // Fail closed: 20 renames were not enough to escape the collision.
          // Do not commit a city that would silently overwrite another one.
          msg.textContent = 'Could not find a free name for "' + copy.city.name +
            '" after 20 tries. Rename the city in the pasted JSON and try again.';
          return;
        }
        commit(copy, false, keepOpen, afterCommitFn);
      };
      var cancel = el('button', 'ctl', 'Cancel');
      cancel.type = 'button';
      cancel.onclick = close;
      row.appendChild(rep);
      row.appendChild(both);
      row.appendChild(cancel);
    }

    function handleParsed(data, keepOpen, afterCommitFn) {
      var id = CityOps.cityId(data);
      if (has(store.cities, id)) { askDuplicate(data, id, keepOpen, afterCommitFn); return; }
      commit(data, false, keepOpen, afterCommitFn);
    }

    // The single funnel every success path (blank, generated, pasted) uses.
    // Editing the SAME city (name/dates unchanged, so the id is unchanged)
    // replaces it directly with no Replace/Keep-both prompt, since that
    // prompt exists for an unrelated collision, not for the edit the
    // traveler just opened. Also stashes the form's non-schema fields
    // (address, transport, trip notes) so a later Edit reopens with them.
    function commitFromForm(data, keepOpen) {
      function afterCommit(id) {
        saveGenMetaFor(id, {
          country: trim(bc.value), accommodation: trim(bacc.value),
          arrival: trim(barr.value), departure: trim(bdep.value), notes: trim(bnotes.value)
        });
      }
      if (isEdit && CityOps.cityId(data) === editCityId) {
        commit(data, true, keepOpen, afterCommit);
      } else {
        handleParsed(data, keepOpen, afterCommit);
      }
    }

    bcreate.onclick = function () {
      var data;
      try { data = CityOps.appStore.blankCity(bn.value, bc.value, bf.value, bt2.value); }
      catch (e) { bmsg.textContent = 'Invalid: ' + e.message; return; }
      commitFromForm(data);
    };

    var apply = el('button', 'ctl', 'Apply');
    apply.type = 'button';
    apply.onclick = function () {
      var res = CityOps.parse(ta.value);
      if (!res.data) {
        var text = 'Invalid:\n' + res.errors.join('\n');
        if (CityOps.isJsonSyntaxError(res.errors)) {
          // A syntax error (as opposed to a schema error) on a large paste is
          // the phone-clipboard-truncation symptom this whole feature exists
          // for. Point at the alternatives right when it happens.
          text += '\n\nPhone clipboards often mangle large files. If this city is ' +
            'hosted on this site, use the On this site buttons or Load from link above instead.';
        }
        msg.textContent = text;
        return;
      }
      commitFromForm(res.data);
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = close;
    row.appendChild(apply);
    row.appendChild(cancel);

    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) close(); };
    host.appendChild(wrap);
    bn.focus();
  }

  function openRemoveModal() {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var cur = store.cities[activeId];
    if (!cur) return;
    var name = cur.city.name;
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, 'Remove ' + name));
    box.appendChild(el('p', 'diff', 'This deletes the city and its saved progress on this device. ' +
      'Type the city name exactly to enable the Remove button.'));
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'name-confirm';
    inp.placeholder = name;
    inp.setAttribute('aria-label', 'Type the city name to confirm removal');
    box.appendChild(inp);
    var row = el('div', 'mrow');
    var rm = el('button', 'ctl to-archived', 'Remove');
    rm.type = 'button';
    rm.disabled = true;
    rm.title = 'Type "' + name + '" to enable';
    inp.oninput = function () {
      var ok = inp.value === name;
      rm.disabled = !ok;
      rm.title = ok ? '' : 'Type "' + name + '" to enable';
    };
    rm.onclick = function () {
      if (inp.value !== name) return;
      var gone = activeId;
      store = CityOps.appStore.remove(store, gone);
      if (LS) { try { LS.removeItem('cityops.' + gone + '.v1'); } catch (e) {} }
      // Removal does not propagate to other devices in v1 (see the report), but
      // it must not be undone here either: this device refuses to pull the city
      // back for the rest of the session.
      removedIds[gone] = 1;
      delete stateStamp[gone];
      // An explicit removal means the user owns this device's city list now:
      // never auto-seed the example again here (Load example stays available).
      try { if (LS) LS.setItem('cityops.app.hadcities', '1'); } catch (e) {}
      saveStore(store);
      wrap.remove();
      if (store.order.length) { activateCity(store.active); }
      else { activateCity(null); }
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = function () { wrap.remove(); };
    row.appendChild(rm);
    row.appendChild(cancel);
    box.appendChild(row);
    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    host.appendChild(wrap);
    inp.focus();
  }

  // ==========================================================================
  // M2: Supabase sync. Local-first, newer-wins per city.
  // ==========================================================================
  // Everything below is inert unless SUPA.url is bound: syncOn() gates the UI,
  // the listeners and every single fetch, so with no config the app behaves
  // exactly as it did in M1. Network failure is always a silent no-op (a
  // console.warn at most): the app must work identically offline, mid-flight
  // and signed out. The decision logic lives in CityOps.syncKit (pure, unit
  // tested); only transport, storage and UI live here.

  var session = null;          // {access_token, refresh_token, expires_at, email}
  var syncEmail = '';
  var lastSyncIso = null;
  var removedIds = {};         // cities removed on this device this session
  var stateStamp = {};         // cityId -> state.updated already seen (push trigger baseline)
  var pushQueueData = {};      // cityId -> pending data push
  var pushQueueState = {};     // cityId -> pending state push
  var pushQueueProfile = false; // the profile is a single row, so a flag not a map
  var profileTableMissing = false; // set once if the table is not there yet (SQL unapplied)
  var pushTimer = null;
  var refreshInFlight = null;
  var pullInFlight = false;
  var lastPullAt = 0;
  // True once this device knows what the account's profile row currently holds
  // in its sidecars. A PostgREST upsert replaces the whole row, so pushing
  // before we know that would silently delete the account's Claude key or its
  // form metadata. pushProfileNow refuses to push until this is true and reads
  // the row first (see profilePreflight).
  var sidecarsKnown = false;
  var refreshTrouble = 0;      // consecutive non-fatal token refresh failures

  function syncOn() {
    return !!(SUPA.url && SUPA.anon && typeof fetch === 'function');
  }

  function warn(what, e) {
    if (typeof console !== 'undefined' && console && console.warn) {
      console.warn('cityops sync: ' + what + (e && e.message ? ' (' + e.message + ')' : ''));
    }
  }

  // Testing override: localStorage cityops.supa.dev = {"url":"...","anon":"..."}
  // points this device at a scratch project without touching the committed
  // config. https only, with an explicit exception for a loopback host, so a
  // bearer token can never ride to a remote origin over plain http.
  function readDevConfig() {
    if (!LS) return;
    var raw = null;
    try { raw = LS.getItem(DEV_KEY); } catch (e) { return; }
    if (!raw) return;
    var cfg = null;
    try { cfg = JSON.parse(raw); } catch (e2) { warn('dev config is not valid JSON'); return; }
    if (!cfg || typeof cfg.url !== 'string' || typeof cfg.anon !== 'string' || !cfg.anon) return;
    var url = cfg.url.replace(/\/+$/, '');
    // Tight enough to reject userinfo, a query string or a path riding along
    // with the host: only a bare Supabase project host, or loopback for local
    // testing. A bearer token must never be sent anywhere else.
    var okScheme = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url) ||
      /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(url);
    if (!okScheme) { warn('dev config url rejected (https project host, or http on localhost, only)'); return; }
    SUPA = { url: url, anon: cfg.anon };
  }

  // ---- session storage ----
  function loadSession() {
    if (!LS) return null;
    var raw = null;
    try { raw = LS.getItem(AUTH_KEY); } catch (e) { return null; }
    if (!raw) return null;
    var s = null;
    try { s = JSON.parse(raw); } catch (e2) { return null; }
    if (!s || typeof s.access_token !== 'string' || typeof s.refresh_token !== 'string') return null;
    return s;
  }

  function saveSession(s) {
    session = s;
    syncEmail = (s && s.email) || '';
    if (!LS) return; // private mode: the session holds for this tab only
    try {
      if (s) LS.setItem(AUTH_KEY, JSON.stringify(s));
      else LS.removeItem(AUTH_KEY);
    } catch (e) {}
  }

  function loadSyncMeta() {
    if (!LS) return;
    try {
      var raw = LS.getItem(SYNC_KEY);
      if (!raw) return;
      var m = JSON.parse(raw);
      if (m && typeof m.lastSync === 'string') lastSyncIso = m.lastSync;
    } catch (e) {}
  }

  function stampSync() {
    lastSyncIso = new Date().toISOString();
    if (!LS) return;
    try { LS.setItem(SYNC_KEY, JSON.stringify({ lastSync: lastSyncIso })); } catch (e) {}
  }

  // The one path that signs a user out on its own: a refresh token the server
  // refuses. Everything transient (offline, 5xx, a project problem) keeps the
  // session. Once dropped, ensureToken returns null forever after, so nothing
  // can loop.
  function dropSession(msg) {
    saveSession(null);
    // NOT cleared: the state baselines. Emptying them makes noteStateChange
    // spend the next real edit on taking a fresh baseline instead of pushing
    // it. Re-seed from what is on disk instead, which is the correct baseline
    // for whoever signs in next (the pull reconcile reads stamps itself).
    stateStamp = seedStateStamps();
    pushQueueData = {};
    pushQueueState = {};
    pushQueueProfile = false;
    sidecarsKnown = false;
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    if (msg) showSyncNotice(msg);
    raiseSyncAlert('signedout');
    renderPanel();
  }

  // ---- the persistent sync alert ----
  // A transient notice is not enough for "sync stopped": the engine rewrites
  // #notice on the next render, so a dropped session would go back to being
  // invisible within one tap. This bar lives in the app's own #syncalert,
  // which nothing else touches, and survives reloads until the traveler signs
  // in again or dismisses it.
  var SYNC_ALERT_KEY = 'cityops.sync.alert.v1';   // {kind, at}
  var alertHiddenForNow = false;                   // "Not now": this page life only

  function readSyncAlert() {
    var raw = readLS(SYNC_ALERT_KEY);
    if (!raw) return null;
    try {
      var a = JSON.parse(raw);
      return (a && typeof a.kind === 'string') ? a : null;
    } catch (e) { return null; }
  }

  function raiseSyncAlert(kind) {
    var cur = readSyncAlert();
    // An existing alert keeps its original timestamp: "nothing has synced
    // since" must name when sync actually stopped, not the last time we
    // noticed.
    var at = (cur && cur.at) ? cur.at : (lastSyncIso || new Date().toISOString());
    writeLS(SYNC_ALERT_KEY, JSON.stringify({ kind: kind, at: at }));
    alertHiddenForNow = false;
    renderSyncAlert();
  }

  function clearSyncAlert() {
    writeLS(SYNC_ALERT_KEY, null);
    refreshTrouble = 0;
    renderSyncAlert();
  }

  function renderSyncAlert() {
    var host = document.getElementById('syncalert');
    if (!host) return;
    host.innerHTML = '';
    var a = readSyncAlert();
    if (!a || alertHiddenForNow || !syncOn()) return;
    // Signed back in already: the alert has served its purpose.
    if (session && session.access_token && a.kind === 'signedout') { clearSyncAlert(); return; }
    var when = '';
    try { when = a.at ? new Date(a.at).toLocaleString() : ''; } catch (e) {}
    var bar = el('div', 'syncalert');
    bar.setAttribute('role', 'status');
    bar.appendChild(el('span', 'syncalert-txt', a.kind === 'signedout'
      ? ('Sync stopped: your sign-in expired' + (when ? ', so nothing has reached your other devices since ' + when : '') +
        '. Everything you have done is still saved on this device.')
      : ('Sync is not reaching your account right now. Everything you have done is still saved on this ' +
        'device, and will go up when it reconnects.')));
    var acts = el('span', 'syncalert-acts');
    if (a.kind === 'signedout') {
      var go = el('button', 'ctl to-done', 'Sign in');
      go.type = 'button';
      go.onclick = openSignInModal;
      acts.appendChild(go);
    } else {
      var prof = el('button', 'ctl', 'Open Profile');
      prof.type = 'button';
      prof.onclick = openProfileModal;
      acts.appendChild(prof);
    }
    var no = el('button', 'ctl', 'Not now');
    no.type = 'button';
    no.title = 'Hide this until the next time you open the app';
    no.onclick = function () { alertHiddenForNow = true; renderSyncAlert(); };
    acts.appendChild(no);
    bar.appendChild(acts);
    host.appendChild(bar);
  }

  // A refresh that failed for a reason that is NOT a dead token keeps the
  // session, but three in a row means sync has stopped working in a way the
  // traveler should hear about rather than discover on the next device.
  function noteRefreshTrouble() {
    refreshTrouble++;
    if (refreshTrouble >= 3) raiseSyncAlert('stuck');
  }

  function noteSyncWorking() {
    refreshTrouble = 0;
    if (readSyncAlert()) clearSyncAlert();
  }

  // The engine owns #notice and rewrites it on every render (empty, or the
  // private-mode warning). A sync notice is appended to whatever the engine
  // just wrote and lives until the next render restores the engine's own text.
  // Deliberately transient: no new DOM, nothing for the user to dismiss.
  function showSyncNotice(text) {
    var n = document.getElementById('notice');
    if (!n || !text) return;
    var base = n.textContent || '';
    if (!base) { n.textContent = text; return; }
    // Two sync notices in one round (e.g. cities then profile) read as one
    // run-on sentence with a plain space; a middle dot keeps them distinct.
    var sep = base.indexOf('Synced:') !== -1 ? ' · ' : ' ';
    n.textContent = base + sep + text;
  }

  function cleanHash() {
    try {
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {
      // No history API: leave the hash rather than write a new history entry
      // via location.hash = '' (which some browsers treat as a navigation).
    }
  }

  // Runs BEFORE the #city= hash is read. A magic-link return replaces the whole
  // fragment with the GoTrue session, so there is no city hash left to protect;
  // the fragment is cleared immediately (access tokens must not sit in the
  // address bar or in history), and activateCity() writes #city= back a moment
  // later. Returns a one-line notice to show after the first render, or null.
  function consumeAuthHash() {
    if (!syncOn()) return null;
    var h = String(location.hash || '');
    if (!h) return null;
    if (h.indexOf('access_token=') === -1) {
      // GoTrue reports a dead or already-used link as an error fragment.
      if (/[#&]error=/.test(h) && h.indexOf('error_description=') !== -1) {
        cleanHash();
        return 'That sign-in link did not work. Send yourself a new one.';
      }
      return null;
    }
    var s = CityOps.syncKit.parseAuthHash(h, Date.now());
    cleanHash();
    if (!s) return 'That sign-in link was incomplete. Send yourself a new one.';
    saveSession(s);
    // Whatever stopped sync is over: take the alert down rather than leave a
    // "sync stopped" bar sitting above a freshly signed-in app.
    clearSyncAlert();
    fetchUserEmail();
    return 'Signed in. Syncing your cities.';
  }

  // Resolves to a usable access token, or null when there is nothing to sync
  // with. Refreshes inside the 60s window (or when forced by a 401), with one
  // shared in-flight refresh so a burst of calls cannot stampede GoTrue.
  function ensureToken(force) {
    if (!syncOn() || !session) return Promise.resolve(null);
    if (!force && !CityOps.syncKit.sessionExpiringSoon(session, Date.now())) {
      return Promise.resolve(session.access_token);
    }
    if (refreshInFlight) return refreshInFlight;
    refreshInFlight = fetch(SUPA.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPA.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function (r) {
      if (r.ok) return r.json().then(function (j) { return { ok: true, body: j }; });
      // The STATUS alone does not say whether the grant is dead: GoTrue
      // answers a revoked or already-used refresh token and a project-level
      // problem with the same 4xx family, and only the body distinguishes
      // them. syncKit.refreshFailure() owns that reading (and its tests).
      return r.text().then(
        function (t) { return { ok: false, status: r.status, text: t }; },
        function () { return { ok: false, status: r.status, text: '' }; });
    }).then(function (res) {
      if (!res.ok) {
        if (CityOps.syncKit.refreshFailure(res.status, res.text) === 'dead') {
          dropSession('Sync signed out: your sign-in expired. Open Profile to sign in again.');
          return null;
        }
        // Not a dead grant: keep the session and the refresh token. Throwing
        // them away over a 403 or a paused project would force a re-sign-in
        // for a problem that fixes itself.
        warn('token refresh rejected (session kept), http ' + res.status);
        noteRefreshTrouble();
        return null;
      }
      var j = res.body;
      if (!j || !j.access_token || !j.refresh_token) {
        dropSession('Sync signed out: your sign-in expired. Open Profile to sign in again.');
        return null;
      }
      saveSession({
        access_token: j.access_token,
        refresh_token: j.refresh_token,
        token_type: j.token_type || 'bearer',
        expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)),
        email: (j.user && j.user.email) || syncEmail || ''
      });
      noteSyncWorking();
      return session.access_token;
    }).catch(function (e) {
      // Offline or a transient server problem: keep the session, skip this
      // round. Only an explicitly dead grant signs the user out.
      warn('token refresh failed', e);
      return null;
    }).then(function (tok) { refreshInFlight = null; return tok; });
    return refreshInFlight;
  }

  // Authenticated call against the project. Resolves to parsed JSON, or null
  // when there is no usable token. Rejects on transport/HTTP errors so every
  // caller can swallow them in one place.
  function api(path, opts, retried) {
    return ensureToken(false).then(function (tok) {
      if (!tok) return null;
      var o = opts || {};
      var headers = { 'apikey': SUPA.anon, 'Authorization': 'Bearer ' + tok };
      if (o.headers) {
        Object.keys(o.headers).forEach(function (k) { headers[k] = o.headers[k]; });
      }
      return fetch(SUPA.url + path, { method: o.method || 'GET', headers: headers, body: o.body })
        .then(function (r) {
          if (r.status === 401 && !retried) {
            // Rejected before its stated expiry: refresh once, retry once, then
            // give up for this round. Never a retry loop.
            return ensureToken(true).then(function (t2) {
              return t2 ? api(path, opts, true) : null;
            });
          }
          if (!r.ok) throw new Error('http ' + r.status);
          if (r.status === 204) return null;
          var ct = (r.headers && r.headers.get) ? (r.headers.get('content-type') || '') : '';
          return ct.indexOf('json') === -1 ? null : r.json();
        });
    });
  }

  // ---- per-city state access (sync side) ----
  // The booted city's state lives in the engine's own store, which keeps an
  // in-memory copy; reading its localStorage key directly would miss unsaved
  // private-mode state, so the live state wins for the active city.
  function readStateFull(id) {
    if (id === activeId) {
      var live = CityOps.liveState();
      if (live) return live;
    }
    if (!LS) return null;
    try {
      var raw = LS.getItem('cityops.' + id + '.v1');
      return raw ? CityOps.normalizeState(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function readStateStamp(id) {
    var st = readStateFull(id);
    return (st && typeof st.updated === 'string') ? st.updated : null;
  }

  // Baselines for EVERY city this device holds, not just the active one.
  // noteStateChange only pushes when the stamp moved past a baseline it
  // already had, and takes one silently when it does not, so a city with no
  // baseline spends the traveler's first real edit on bookkeeping. Only the
  // active city can be edited in practice, but seeding all of them makes that
  // invariant true by construction rather than by luck of the render order.
  function seedStateStamps() {
    var out = {};
    store.order.forEach(function (id) { out[id] = readStateStamp(id); });
    return out;
  }

  // Writes a pulled state verbatim, keeping the remote `updated` stamp.
  // makeStore().save() re-stamps with now, which would make a pull look like a
  // local edit and push it straight back, so the pull path never uses it. The
  // active city is re-booted right after, which builds a fresh store that reads
  // this value back. Returns false in private mode (nothing is persisted there,
  // so pulled state is skipped rather than half applied).
  function writeStateRaw(id, state) {
    if (!LS) return false;
    try { LS.setItem('cityops.' + id + '.v1', JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  // ---- push ----
  function pushNow(kind, entries) {
    if (!syncOn() || !session || !entries || !entries.length) return;
    var field = (kind === 'state') ? 'state' : 'data';
    var table = (kind === 'state') ? 'city_state' : 'cities';
    var rows = CityOps.syncKit.buildRows(field, entries);
    if (!rows.length) return;
    api('/rest/v1/' + table + '?on_conflict=user_id,city_id', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify(rows)
    }).then(function () { stampSync(); })
      .catch(function (e) { warn('push ' + kind + ' failed', e); });
  }

  // This device's sidecars, in the shape syncKit.buildProfileRow expects. A
  // null block means "this device has no opinion", and buildProfileRow leaves
  // the field out entirely rather than writing an empty one.
  function localSidecars() {
    var keyAt = apiKeyStamp();
    var gmAt = genMetaStamp();
    return {
      apiKey: keyAt ? { value: loadApiKey(), updated: keyAt } : null,
      genmeta: gmAt ? { value: loadGenMeta(), updated: gmAt } : null
    };
  }

  // Takes whatever the account's row says about the sidecars, newer wins, same
  // rule as everything else. Returns the list of things that actually changed
  // here, so the caller can say so. Marks the sidecars known either way: an
  // answered read is what makes a later push safe.
  function adoptSidecars(rowData) {
    sidecarsKnown = true;
    var remote = CityOps.syncKit.readSidecars(rowData);
    var changed = [];
    if (remote.apiKey && CityOps.syncKit.decide(apiKeyStamp(), remote.apiKey.updated) === 'pull') {
      // Keep the REMOTE stamp: this is not a local edit, and stamping it now
      // would make this device win the next reconcile against the device that
      // actually made the change.
      writeApiKey(remote.apiKey.value, remote.apiKey.updated);
      changed.push('Claude API key');
    }
    if (remote.genmeta && CityOps.syncKit.decide(genMetaStamp(), remote.genmeta.updated) === 'pull') {
      writeGenMeta(remote.genmeta.value, remote.genmeta.updated);
      changed.push('city form details');
    }
    return changed;
  }

  // Reads the profile row for its sidecars alone, so a push can carry them
  // forward instead of deleting them. Resolves true only when the row was
  // actually read: a failed preflight must NOT fall through to a push, or the
  // upsert would replace the account's key with nothing. Local stays newer
  // than the server, so the next pull's reconcile pushes it instead.
  function profilePreflight() {
    return api('/rest/v1/profile?select=data,updated_at').then(function (rows) {
      if (!Array.isArray(rows)) return false;
      if (rows.length) {
        adoptSidecars(rows[0] && rows[0].data);
        // Take the account's profile too if it is newer. The push that
        // follows replaces the whole row, so a device that has a key but has
        // not applied the account's profile yet (a fresh sign-in, key typed
        // in the 2s before the startup pull landed) would otherwise blank the
        // profile until the next round put it back.
        adoptProfileRow(rows[0]);
      } else {
        sidecarsKnown = true;   // no row yet: there is nothing to preserve
      }
      return true;
    }).catch(function (e) {
      noteProfileTable(e);
      warn('profile preflight failed', e);
      return false;
    });
  }

  // The profile is one row per user, keyed by user_id alone, so it needs no
  // city id and no buildRows: one payload, one stamp. The row also carries the
  // Claude key and the Add/Edit form metadata as stamped sidecars, each
  // reconciled on its own stamp; row.updated_at stays the PROFILE's stamp so a
  // key change cannot make a stale profile win.
  function pushProfileNow() {
    if (!syncOn() || !session || profileTableMissing) return;
    if (!sidecarsKnown) {
      profilePreflight().then(function (ok) { if (ok) pushProfileRow(); });
      return;
    }
    pushProfileRow();
  }

  function pushProfileRow() {
    if (!syncOn() || !session || profileTableMissing) return;
    var row = CityOps.syncKit.buildProfileRow(store.profile, localSidecars());
    // Nothing this device has ever set: pushing an empty profile with no
    // sidecars would overwrite a real one with this device's blank.
    if (!row.data.updated && !row.data.apiKey && !row.data.genmeta) return;
    api('/rest/v1/profile?on_conflict=user_id', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify([row])
    }).then(function () { stampSync(); noteSyncWorking(); })
      .catch(function (e) { noteProfileTable(e); warn('push profile failed', e); });
  }

  // The profile table is a Phase 3a addition: a build can be running against a
  // project where the SQL has not been applied yet. PostgREST answers an
  // unknown table with 404 (PGRST205). Warn once, mark it off, and let cities
  // and state keep syncing exactly as before.
  function noteProfileTable(e) {
    if (profileTableMissing) return;
    var msg = (e && e.message) || '';
    if (msg.indexOf('404') === -1) return;
    profileTableMissing = true;
    warn('profile table not found; profile sync is off until the Phase 3a SQL is applied');
  }

  // 2s debounce per the spec, shared by every table: a burst of taps produces
  // one upsert. A failed flush is NOT retried on a timer; local stays newer
  // than the server, so the next pull's reconcile pushes it. Local is the queue.
  function schedulePush(kind, id) {
    if (!syncOn() || !session) return;
    if (kind === 'profile') pushQueueProfile = true;
    else if (!id) return;
    else if (kind === 'state') pushQueueState[id] = 1;
    else pushQueueData[id] = 1;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(flushPush, 2000);
  }

  function flushPush() {
    pushTimer = null;
    var dataEntries = [];
    Object.keys(pushQueueData).forEach(function (id) {
      if (has(store.cities, id)) {
        dataEntries.push({ cityId: id, payload: store.cities[id], updatedAt: store.updatedAt[id] });
      }
    });
    pushQueueData = {};
    var stateEntries = [];
    Object.keys(pushQueueState).forEach(function (id) {
      var st = readStateFull(id);
      if (st && st.updated) stateEntries.push({ cityId: id, payload: st, updatedAt: st.updated });
    });
    pushQueueState = {};
    pushNow('data', dataEntries);
    pushNow('state', stateEntries);
    if (pushQueueProfile) { pushQueueProfile = false; pushProfileNow(); }
  }

  // Fires the debounced push immediately instead of waiting out the 2s timer:
  // the tab is about to go away (hidden or unloading), and a queued edit that
  // never flushes is an edit that never syncs. Same guards schedulePush uses,
  // since this only matters when a debounce could actually be pending.
  function flushPendingPush() {
    if (!syncOn() || !session || !pushTimer) return;
    clearTimeout(pushTimer);
    pushTimer = null;
    flushPush();
  }

  // Chained onto the engine's state-change hook. A push fires only when the
  // state stamp actually moved: the first render after a boot just records a
  // baseline, because pushing there would upload this device's state before the
  // first pull has had a chance to reconcile it against newer remote state.
  function noteStateChange() {
    if (!syncOn() || !session || !activeId) return;
    var st = CityOps.liveState();
    if (!st) return;
    var stamp = st.updated || null;
    if (!has(stateStamp, activeId)) { stateStamp[activeId] = stamp; return; }
    if (stateStamp[activeId] === stamp) return;
    stateStamp[activeId] = stamp;
    schedulePush('state', activeId);
  }

  // ---- pull ----
  function pullAll(force) {
    if (!syncOn() || !session || pullInFlight) return Promise.resolve(false);
    var now = Date.now();
    if (!force && now - lastPullAt < 60000) return Promise.resolve(false);
    pullInFlight = true;
    lastPullAt = now;
    return Promise.all([
      api('/rest/v1/cities?select=city_id,data,updated_at'),
      api('/rest/v1/city_state?select=city_id,state,updated_at'),
      // The profile read is isolated: a missing table (the Phase 3a SQL not
      // applied yet) must not fail the whole round and take cities down with
      // it, so its rejection resolves to null and the reconcile skips it.
      profileTableMissing ? Promise.resolve(null) :
        api('/rest/v1/profile?select=data,updated_at').catch(function (e) {
          noteProfileTable(e);
          warn('profile pull failed', e);
          return null;
        })
    ]).then(function (res) {
      // A null half means "no usable token"; an empty table is []. Never treat
      // an unanswered read as an empty server, which would push everything up.
      if (!res || !Array.isArray(res[0]) || !Array.isArray(res[1])) return false;
      applyPull(res[0], res[1], res[2]);
      stampSync();
      noteSyncWorking();
      return true;
    }).catch(function (e) {
      warn('pull failed', e);
      return false;
    }).then(function (ok) {
      pullInFlight = false;
      // The throttle exists to stop a chatty tab, not to make a FAILED pull
      // wait out a minute. A phone that woke with no signal and reconnected
      // ten seconds later would otherwise show stale data for the rest of the
      // minute with no way to ask again.
      if (!ok) lastPullAt = 0;
      return ok;
    });
  }

  function stampMap(rows, byId) {
    var stamps = {};
    (rows || []).forEach(function (r) {
      if (!r || typeof r.city_id !== 'string' || !r.city_id) return;
      byId[r.city_id] = r;
      stamps[r.city_id] = (typeof r.updated_at === 'string') ? r.updated_at : null;
    });
    return stamps;
  }

  // Third row kind, same newer-wins reconcile as cities and state, decided by
  // syncKit.decide(local profile.updated, remote updated_at), plus one
  // independent reconcile per sidecar on its own stamp. Non-array rows mean
  // "no usable answer": leave every side alone. Returns the human-readable
  // list of what this pull actually changed on this device ([] when nothing
  // did), so the caller can name it in the notice.
  function applyProfilePull(rows) {
    if (!Array.isArray(rows)) return [];
    var row = rows.length ? rows[0] : null;
    var changed = [];
    // The sidecars reconcile on their OWN stamps, independently of the
    // profile's: a key changed on the phone must arrive here even when this
    // device holds the newer interest profile. Runs first, and on every pull,
    // so the row's sidecars are known before any push can replace them.
    if (row) changed = adoptSidecars(row.data);
    else sidecarsKnown = true;   // an answered read with no row: nothing to preserve

    if (adoptProfileRow(row)) changed.push('profile');
    // The sidecar check runs on EVERY outcome, not only when the profile
    // itself wants pushing: a key this device holds and the account does not
    // (the common case the first time a device upgrades to key sync) has to go
    // up even when the profile is in sync or the profile just came down.
    // 'push' itself can only happen when this device has a stamp, so a
    // never-edited profile is never sent.
    var localIso = CityOps.profile.normalize(store.profile).updated;
    var remoteIso = (row && typeof row.updated_at === 'string') ? row.updated_at : null;
    if (CityOps.syncKit.decide(localIso, remoteIso) === 'push' || sidecarNewerHere(row)) {
      pushProfileNow();
    }
    return changed;
  }

  // Newer-wins for the profile half of the row alone. Returns true when the
  // account's profile replaced this device's.
  function adoptProfileRow(row) {
    if (!row || !row.data || typeof row.data !== 'object') return false;
    var localP = CityOps.profile.normalize(store.profile);
    var remoteIso = (typeof row.updated_at === 'string') ? row.updated_at : null;
    if (CityOps.syncKit.decide(localP.updated, remoteIso) !== 'pull') return false;
    // normalizeProfile rebuilds from a fixed field list, so the sidecars
    // cannot follow the key or the form metadata into store.profile (and from
    // there into a prompt or an export). That is by construction, and the
    // unit tests pin it.
    var p = CityOps.profile.normalize(row.data);
    p.updated = remoteIso || p.updated;   // keep the REMOTE stamp: this is not a local edit
    store.profile = p;
    saveStore(store);
    return true;
  }

  // True when a sidecar on this device beats (or is missing from) the row, so
  // a profile that is otherwise in sync still has something to send up. This
  // is what carries a key typed before key sync existed up to the account.
  function sidecarNewerHere(row) {
    var remote = CityOps.syncKit.readSidecars(row && row.data);
    var mine = localSidecars();
    if (mine.apiKey && CityOps.syncKit.decide(mine.apiKey.updated,
      remote.apiKey ? remote.apiKey.updated : null) === 'push') return true;
    if (mine.genmeta && CityOps.syncKit.decide(mine.genmeta.updated,
      remote.genmeta ? remote.genmeta.updated : null) === 'push') return true;
    return false;
  }

  function applyPull(cityRows, stateRows, profileRows) {
    var remoteData = {}, remoteState = {};
    var remoteDataStamps = stampMap(cityRows, remoteData);
    var remoteStateStamps = stampMap(stateRows, remoteState);

    var localDataStamps = {}, localStateStamps = {};
    store.order.forEach(function (id) {
      localDataStamps[id] = store.updatedAt[id] || CityOps.syncKit.EPOCH;
      var s = readStateStamp(id);
      if (s) localStateStamps[id] = s;
    });

    var dataPlan = CityOps.syncKit.plan(localDataStamps, remoteDataStamps, removedIds);
    var statePlan = CityOps.syncKit.plan(localStateStamps, remoteStateStamps, removedIds);

    var pulledNames = [];
    var rebootActive = false;

    dataPlan.pull.forEach(function (id) {
      var row = remoteData[id];
      if (!row || !row.data || typeof row.data !== 'object') return;
      // These rows are the user's own, but they are still untrusted input:
      // validate before letting them into the store, and refuse any row whose
      // payload does not derive the city id it claims to be filed under.
      if (CityOps.validate(row.data).length) { warn('skipped invalid remote city ' + id); return; }
      if (CityOps.cityId(row.data) !== id) { warn('skipped mismatched remote city ' + id); return; }
      var res = CityOps.appStore.add(store, row.data, row.updated_at || CityOps.syncKit.EPOCH);
      store = res.store;
      if (id === activeId) rebootActive = true;
      if (pulledNames.indexOf(row.data.city.name) === -1) pulledNames.push(row.data.city.name);
    });
    if (dataPlan.pull.length) saveStore(store);

    statePlan.pull.forEach(function (id) {
      if (!has(store.cities, id)) return;  // orphan state row: no city to attach it to
      var row = remoteState[id];
      if (!row || !row.state || typeof row.state !== 'object') return;
      var st = CityOps.normalizeState(clone(row.state));
      // A pulled state row is untrusted input same as a pulled city row (see
      // the conservative choices in the report): a dataOverride whose derived
      // id does not match the city_id it was filed under is rejected rather
      // than let a mismatched override attach to the wrong city. The rest of
      // the pulled state is kept.
      if (st.dataOverride) {
        var overrideId = null;
        try { overrideId = CityOps.cityId(st.dataOverride); } catch (e) {}
        if (overrideId !== id) {
          warn('pulled state for ' + id + ' carried a mismatched dataOverride; stripped it');
          st.dataOverride = null;
        }
      }
      st.updated = row.updated_at || st.updated || null;
      if (!writeStateRaw(id, st)) return;  // private mode: cannot persist, leave local alone
      stateStamp[id] = st.updated;         // baseline first, so the re-boot does not push it back
      if (id === activeId) rebootActive = true;
      var nm = store.cities[id].city.name;
      if (pulledNames.indexOf(nm) === -1) pulledNames.push(nm);
    });

    var dataEntries = [];
    dataPlan.push.forEach(function (id) {
      if (!has(store.cities, id)) return;
      dataEntries.push({ cityId: id, payload: store.cities[id], updatedAt: store.updatedAt[id] });
    });
    var stateEntries = [];
    statePlan.push.forEach(function (id) {
      var st = readStateFull(id);
      if (st && st.updated) stateEntries.push({ cityId: id, payload: st, updatedAt: st.updated });
    });
    pushNow('data', dataEntries);
    pushNow('state', stateEntries);

    if (rebootActive && has(store.cities, activeId)) {
      var y = 0;
      try { y = window.scrollY || window.pageYOffset || 0; } catch (e) {}
      CityOps.boot(clone(store.cities[activeId]));
      try { window.scrollTo(0, y); } catch (e2) {}
    } else if (!activeId && store.order.length) {
      // The device was showing the empty state and the pull just delivered
      // cities: activate the first one.
      activateCity(store.order[0]);
    }
    if (pulledNames.length) {
      showSyncNotice('Synced: ' + pulledNames.join(', ') + ' updated from your other device');
    }
    var profileChanged = applyProfilePull(profileRows);
    if (profileChanged.length) {
      showSyncNotice('Synced: ' + profileChanged.join(', ') + ' updated from your other device');
    }
  }

  // ---- auth actions ----
  // Once per page load at most: the sign-in path and the startup path both want
  // the address, and the first call is usually still in flight when the second
  // would fire. The label falls back to "signed in" if it never arrives.
  var emailLookupDone = false;
  function fetchUserEmail() {
    if (emailLookupDone) return;
    emailLookupDone = true;
    api('/auth/v1/user').then(function (u) {
      if (!u || !u.email || !session) return;
      session.email = u.email;
      saveSession(session);
      renderPanel();  // only visible while the switcher panel is open
    }).catch(function (e) { warn('user lookup failed', e); });
  }

  // Resolves to null on success, or a human-readable error string. Rejects only
  // when the service cannot be reached at all.
  function sendMagicLink(email) {
    var redirect = location.origin + location.pathname;
    return fetch(SUPA.url + '/auth/v1/otp?redirect_to=' + encodeURIComponent(redirect), {
      method: 'POST',
      headers: { 'apikey': SUPA.anon, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, create_user: true, gotrue_meta_security: {} })
    }).then(function (r) {
      if (r.ok) return null;
      return r.json().then(function (j) {
        return (j && (j.msg || j.error_description || j.message)) || ('Sign-in service returned ' + r.status + '.');
      }, function () { return 'Sign-in service returned ' + r.status + '.'; });
    });
  }

  function signOut() {
    var tok = session && session.access_token;
    if (tok) {
      // Best effort revoke. The local session is cleared either way, so the
      // button can never leave the user half signed out.
      try {
        fetch(SUPA.url + '/auth/v1/logout', {
          method: 'POST',
          headers: { 'apikey': SUPA.anon, 'Authorization': 'Bearer ' + tok }
        }).catch(function () {});
      } catch (e) {}
    }
    saveSession(null);
    // Same reasoning as dropSession: re-seed rather than empty, so the next
    // real edit pushes instead of being spent on a baseline.
    stateStamp = seedStateStamps();
    pushQueueData = {};
    pushQueueState = {};
    pushQueueProfile = false;
    sidecarsKnown = false;
    if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; }
    // The last-sync record is meaningless once signed out (and stale once
    // signed back in as someone else), so it goes with the session.
    lastSyncIso = null;
    if (LS) { try { LS.removeItem(SYNC_KEY); } catch (e) {} }
    // Signing out is a decision, not a failure: no alert for it. The Claude
    // key and the form metadata stay on this device untouched (losing the key
    // on sign-out would recreate exactly the annoyance key sync fixes); they
    // simply stop being pushed.
    clearSyncAlert();
    renderPanel();
  }

  // ---- sync UI ----
  function lastSyncLine() {
    if (!lastSyncIso) return 'Not synced yet on this device.';
    var when = lastSyncIso;
    try { when = new Date(lastSyncIso).toLocaleString(); } catch (e) {}
    return 'Last sync: ' + when + '.';
  }

  function modalShell(title) {
    var host = document.getElementById('modal');
    host.innerHTML = '';
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, title));
    wrap.appendChild(box);
    wrap.onclick = function (e) { if (e.target === wrap) wrap.remove(); };
    host.appendChild(wrap);
    return { wrap: wrap, box: box, close: function () { wrap.remove(); } };
  }

  function openSignInModal() {
    var m = modalShell('Sign in to sync');
    m.box.appendChild(el('p', 'diff', 'Your cities and your progress follow you to your other devices. ' +
      'No password: we email you a link. The app works exactly the same whether you sign in or not.'));
    var inp = document.createElement('input');
    inp.type = 'email';
    inp.className = 'name-confirm';
    inp.placeholder = 'you@example.com';
    inp.name = 'email';               // lets the browser autofill, and keeps
    inp.autocomplete = 'email';       // devtools quiet about an unnamed field
    inp.setAttribute('aria-label', 'Email address');
    m.box.appendChild(inp);
    var msg = el('div', 'diff', '');
    m.box.appendChild(msg);
    var row = el('div', 'mrow');
    var send = el('button', 'ctl to-done', 'Send magic link');
    send.type = 'button';
    // Disabled until the field holds something that could be an address: a
    // button that is going to fail should never look ready to click.
    send.disabled = true;
    send.title = 'Enter your email address first';
    inp.oninput = function () {
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inp.value.replace(/^\s+|\s+$/g, ''));
      send.disabled = !ok;
      send.title = ok ? '' : 'Enter your email address first';
    };
    send.onclick = function () {
      var addr = inp.value.replace(/^\s+|\s+$/g, '');
      send.disabled = true;
      send.textContent = 'Sending...';
      msg.textContent = '';
      sendMagicLink(addr).then(function (err) {
        send.textContent = 'Send magic link';
        if (err) { msg.textContent = err; send.disabled = false; return; }
        msg.textContent = 'Link sent: open the email on this device.';
        send.title = 'Link already sent to ' + addr;
      }).catch(function () {
        send.textContent = 'Send magic link';
        send.disabled = false;
        msg.textContent = 'Could not reach the sync service. Check your connection and try again.';
      });
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(send);
    row.appendChild(cancel);
    m.box.appendChild(row);
    inp.focus();
  }

  // (The standalone Sync modal is gone: Sync now and Sign out live in the
  // Profile modal's account block, so there is one place that answers "is my
  // work reaching my other devices" instead of two.)

  // ---- wiring ----
  function startSync() {
    if (!syncOn()) return;
    loadSyncMeta();
    if (!session) {
      var stored = loadSession();
      if (stored) { session = stored; syncEmail = stored.email || ''; }
    }
    // Bound unconditionally, above the no-session return: pullAll and
    // flushPendingPush both no-op without a session, and binding them only
    // when a session happened to exist at load is how a listener goes missing
    // for the rest of the page's life.
    window.addEventListener('online', function () { pullAll(true); });
    // Mobile tab resume pulls; going hidden or away flushes any pending
    // debounced push immediately rather than risking the 2s timer never
    // firing (tab suspended, app switched away from, page unloaded).
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') pullAll(false);
      else if (document.visibilityState === 'hidden') flushPendingPush();
    });
    window.addEventListener('pagehide', flushPendingPush);
    // A phone resumed after hours must pull promptly: visibilitychange fires
    // on resume and the 60s throttle has long since expired, so the
    // unforced pull above goes out. pageshow covers the back/forward cache,
    // where no visibilitychange fires at all.
    window.addEventListener('pageshow', function (e) { if (e && e.persisted) pullAll(true); });
    // The alert outlives a reload, so it has to be drawn at startup, not only
    // at the moment sync breaks.
    renderSyncAlert();
    if (!session) return;
    if (!syncEmail) fetchUserEmail();
    stateStamp = seedStateStamps();
    pullAll(true);
  }

  // The assembler embeds the fully assembled standalone template here, with every
  // closing script tag escaped so the text/plain block cannot end early. Undo that,
  // drop the exported city JSON into the data block, and the result is a
  // self-contained guide file identical to what tools/embed.js produces.
  // (Never write that closing sequence literally in this file: it would end THIS
  // script element. The assembler counts script tags to keep that honest.)
  function exportStandalone() {
    var node = document.getElementById('guide-template');
    if (!node) return;
    var closeTag = '<' + '/script'; // assembled, never written literally: see above
    var raw = node.textContent;
    // The assembler pads the block with one newline on each side; strip exactly
    // those so the download is byte-identical to what tools/embed.js writes.
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    var tpl = raw.replace(/<\\\/script/g, closeTag);
    var base = store.cities[activeId];
    // Prefer the live in-memory state of the booted city: in private/incognito
    // mode makeStore() falls back to a per-instance memory cache, and a FRESH
    // makeStore() call here would get its own empty cache, silently dropping
    // any session-only progress. Fall back to a fresh read only if nothing is
    // currently booted (defensive; exportStandalone is only wired up in-app).
    var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
    var out = CityOps.buildExport(CityOps.effectiveData(base, st), st);
    // Escape every "</" so a closing-script-like sequence inside item data
    // cannot break out of the embedded data block. "\/" is a valid JSON escape
    // for "/", so this is lossless: JSON.parse of the escaped text reproduces
    // the original object exactly.
    var json = JSON.stringify(out, null, 2).replace(/<\//g, '<\\/');
    var html = tpl.replace('__CITY_DATA__', function () { return json; });
    var blob = new Blob([html], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = CityOps.cityId(out) + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    var freeUrl = a.href;
    setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
  }

  // Set before the first boot so the engine's More sheet picks up the
  // app-only rows.
  window.CityOpsApp = { exportStandalone: exportStandalone, moreActions: moreActions };

  // Re-decorate the header and re-render the panel on every engine state
  // change (not just on city switch, which activateCity already triggers via
  // CityOps.boot -> rerender -> this hook): this catches things like the
  // Edit-dates modal applying a stay override, and future-proofs any M2 sync
  // path that mutates state outside the app shell's own click handlers. The
  // engine wipes #hdr on every render, so decorateHeader() must re-run here
  // every time too, not just once at startup.
  // The itinerary companion link is app-only: standalone exported guides must
  // never carry it, so it decorates #foot here rather than in the engine.
  function decorateFoot() {
    var foot = document.getElementById('foot');
    if (!foot || foot.querySelector('.foot-wheres')) return;
    foot.appendChild(document.createTextNode(' · itinerary: '));
    var a = el('a', 'foot-wheres', 'wheres.robriggs.com');
    a.href = 'https://wheres.robriggs.com';
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    foot.appendChild(a);
  }

  CityOps.onStateChange = function () { renderPanel(); decorateHeader(); decorateFoot(); };

  // Sync chains onto that hook rather than replacing it: the citybar still
  // re-renders exactly as before, and the sync layer additionally notices when
  // the engine's state stamp moved and queues a debounced push.
  (function chainStateChange() {
    var prev = CityOps.onStateChange;
    CityOps.onStateChange = function () {
      if (prev) prev();
      noteStateChange();
    };
  })();

  function start() {
    // Config first, then the auth fragment, and only then the #city= hash: a
    // magic-link return carries tokens in the fragment and must be consumed
    // (and scrubbed) before anything reads it as a city deep link.
    readDevConfig();
    var authNotice = consumeAuthHash();
    store = loadStore();
    // Seed the example ONLY on a genuine first run: no cities AND no stored
    // session AND never had real cities on this device. A signed-in device
    // with an empty store is mid-pull, not new, and must not invent a city
    // that then syncs into the account (Rob's recurring-example bug).
    var everHadCities = false;
    try { everHadCities = !!(LS && LS.getItem('cityops.app.hadcities')); } catch (e) {}
    if (!store.order.length && !loadSession() && !everHadCities) {
      var seeded = CityOps.appStore.add(store, clone(SEED_CITY), CityOps.syncKit.EPOCH);
      store = seeded.store;
      store.active = seeded.cityId;
      saveStore(store);
    }
    var wanted = hashCity();
    var target = CityOps.appStore.resolveStartCity(store, wanted);
    // Feature 3: never boot straight into a hidden example. If it hides
    // (a real city exists and the toggle is off) there is always at least
    // one non-seed city to fall back to, by the same rule that hides it.
    if (target === SEED_ID && !exampleVisible()) {
      var fallback = store.order.filter(function (id) { return id !== SEED_ID; });
      target = fallback.length ? fallback[0] : target;
    }
    activateCity(target);
    window.addEventListener('hashchange', function () {
      var id = hashCity();
      if (id === SEED_ID && !exampleVisible()) return;
      if (id && has(store.cities, id) && id !== activeId) activateCity(id);
    });
    // After the first render: the engine rewrote #notice during boot, so a
    // sign-in notice has to be appended once that has happened.
    if (authNotice) showSyncNotice(authNotice);
    startSync();
  }

  // Offline support: register the app-shell service worker. Feature-detected
  // (older browsers just skip it) and gated to http/https so opening the app
  // as a local file:// (the standalone-guide path) never tries and never
  // logs a scary console error. Silent on failure: a registration error
  // should not block the app from working online.
  function registerServiceWorker() {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    try {
      navigator.serviceWorker.register('./sw.js');
    } catch (e) {}
  }

  start();
  registerServiceWorker();
})();
</script>
</body>
</html>
