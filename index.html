<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CityOps</title>
<style>
  :root{
    --bg:#cccccc; --bg-card:#ffffff; --bg-soft:#bdbdbd; --bg-softer:#e8e8e8;
    --border:#a8a8a8; --border-light:#d0d0d0;
    --text:#242424; --text-2:#4a4a4a; --text-3:#666666;
    --accent:#c72027; --accent-hover:#9c181d; --accent-soft:#f3d1d3;
    --green:#2d7d34; --green-soft:#d4e8d5;
    --blue:#2c5d8a; --blue-soft:#d3e0ee;
    --amber:#8a6d00; --amber-soft:#ede1be;
    --amber-ink:#6b5400; --green-ink:#226428;
    /* The two numbers BOTH surfaces share (owner ask 2026-08-26: "get header
       consistent between cityops page and logistics page, cityops is narrow,
       plan-ahead is full width"). The trip surface repeats these values under
       the same names in its own stylesheet, which it keeps by design; they
       have to be edited together or the two headers drift again.
       960px is the settled measure: cityops was 760 and the trip page 1200,
       so switching surfaces moved every column on the page. */
    --content-max:960px; --gutter:16px;
    /* The side padding a full-bleed band needs so its CONTENT lines up
       EXACTLY with the column beneath it, at every width.
       .wrap is border-box, so its content edge sits at
       (50vw - content-max/2) + gutter once the max-width bites, and at just
       `gutter` before it does. max() of the two is the whole formula, and it
       is why the h1 and the first card share an x rather than missing each
       other by a gutter. */
    --bleed-pad:max(var(--gutter), calc(50vw - var(--content-max) / 2 + var(--gutter)));
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; -webkit-text-size-adjust:100%;
    /* The full-bleed header below is sized in vw, which on a desktop browser
       counts the scrollbar the page itself creates. Without this, a page long
       enough to scroll vertically gains a few px of horizontal scroll too.
       Nothing in this single-column layout scrolls sideways on purpose. */
    overflow-x:hidden;}
  .wrap{max-width:var(--content-max); margin:0 auto; padding:0 var(--gutter) 60px;}
  header{background:linear-gradient(160deg,var(--accent) 0%,var(--accent-hover) 100%); color:#fff;
    padding:26px 20px 22px;}
  /* Edge to edge of the VIEWPORT, not of .wrap. The negative margins pull the
     band out past the content column's max-width, and the padding puts its
     contents back on that column, so the h1 starts exactly where the first
     card starts at every width. The trip surface's .hero does the same with
     the same numbers. */
  .wrap>header{margin:0 calc(50% - 50vw) 20px; border-radius:0;
    padding-left:var(--bleed-pad); padding-right:var(--bleed-pad);}
  header h1{font-size:1.55rem; letter-spacing:.2px;}
  header .sub{opacity:.9; font-size:.95rem; margin-top:4px;}

/* ==========================================================================
   THE SHARED HEADER
   One source, assembled into both stylesheets by tools/assemble.js at the
   /*CITYOPS_HEADER_CSS* / marker. Written against tokens BOTH surfaces already
   declare under the same names (--accent, --accent-hover, --gutter,
   --content-max, --bleed-pad), so it needs nothing that is not already there.

   The band is full bleed: the negative side margins pull it past the content
   column's max-width, and --bleed-pad puts its CONTENTS back on that column,
   so the h1 and the first card below it share an x at every width.

   It sits FLUSH to the top of the viewport (owner ask 2026-08-27: "cleanup the
   margin at the top, there's something separating the red header from the top
   of the browser window"). That is why margin-top is 0 here and why both
   shells put this element first inside .wrap: an empty notice line above it
   used to collapse its 8px top margin out through .wrap and body and push the
   whole page, band included, 8px down.
   ========================================================================== */
.apphdr{
  background:linear-gradient(160deg,var(--accent) 0%,var(--accent-hover) 100%);
  color:#fff; border-radius:0;
  margin:0 calc(50% - 50vw) 20px;
  padding:0 var(--bleed-pad) 22px;
}

/* --- the peer row: which surface you are on, and the app-level doors --- */
.apphdr-bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; flex-wrap:wrap;
  padding:10px 0 12px;
  border-bottom:1px solid rgba(255,255,255,.18);
  margin-bottom:16px;
}

/* Cities and Trip are PEERS, not a chip and a title. They were a one-off chip
   on each side ("Trip" on the guide, "City guides" on the trip page), which
   read as a link off to somewhere else rather than as the two halves of one
   app. A segmented pair says what it is: you are in one of these two places. */
.surfsw{display:inline-flex; background:rgba(0,0,0,.18); border-radius:20px; padding:2px;}
.surfsw .surf{
  font:inherit; font-size:.78rem; font-weight:600; letter-spacing:.02em;
  color:rgba(255,255,255,.78); text-decoration:none;
  padding:6px 14px; border-radius:18px; white-space:nowrap;
  display:inline-flex; align-items:center; cursor:pointer;
}
.surfsw .surf:hover{color:#fff;}
/* The current surface. aria-current is the fact; the styling follows it, so
   there is no separate "active" class to forget to move. */
.surfsw .surf[aria-current="page"]{
  background:rgba(255,255,255,.92); color:var(--accent-hover); cursor:default;
}

.apphdr-acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

/* One chip vocabulary for every app-level door, on both surfaces. */
.hdr-chip{
  background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
  color:#fff; font:inherit; font-size:.78rem; padding:5px 11px; border-radius:20px;
  cursor:pointer; text-decoration:none; white-space:nowrap;
  display:inline-flex; align-items:center; gap:5px;
}
.hdr-chip:hover{background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.55);}
.hdr-chip:disabled{opacity:.55; cursor:default;}
/* Sync state colours the chip rather than adding a line: green when the
   account has this device's work, amber when sync has stopped, plain
   translucent white when the traveler is signed out on purpose. */
.hdr-chip.ok{background:rgba(212,232,213,.22); border-color:rgba(212,232,213,.6);}
.hdr-chip.warn{background:rgba(237,225,190,.26); border-color:rgba(237,225,190,.7);}

/* --- the per-surface middle --- */
.apphdr-mid h1{font-size:1.55rem; letter-spacing:.2px; line-height:1.15;}
.apphdr-mid .sub{opacity:.9; font-size:.95rem; margin-top:4px;}

/* "Last touched" is a FACT, not a door, and it was wearing a pill that cost
   more width than the words (owner ask 2026-08-27: "that takes a lot of room.
   let's make that smaller, just text, no pill"). Plain muted text now: no
   border, no background, no padding. */
.hdr-meta{
  font-size:.72rem; color:rgba(255,255,255,.72); letter-spacing:.02em;
  white-space:nowrap; align-self:center;
}

@media (max-width: 430px){
  .apphdr{margin:0 calc(50% - 50vw) 16px; padding:0 var(--bleed-pad) 16px;}
  .apphdr-bar{padding:8px 0 10px; margin-bottom:12px; gap:8px;}
  .surfsw .surf{font-size:.74rem; padding:7px 13px;}
  .hdr-chip{font-size:.74rem; padding:5px 10px;}
  .apphdr-mid h1{font-size:1.35rem;}
  .hdr-meta{font-size:.68rem;}
}

/* A door gets a thumb on a touch screen. The width test is here as well as the
   pointer test on purpose: desktop Chrome at 390px reports a fine pointer, and
   Rob's phone is 390px, so width is the reliable signal of the two. */
@media (hover: none), (pointer: coarse){
  .surfsw .surf, .hdr-chip{min-height:44px;}
}
@media (max-width: 430px){
  .surfsw .surf, .hdr-chip{min-height:44px;}
}

  .facts{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
    padding:5px 10px; border-radius:20px; font-size:.8rem;}

  /* --- Header highlights row (sunset + pinned items) ---
     ONE row, always. flex-wrap:nowrap plus overflow-x:auto is the whole
     contract: a fifth chip would scroll sideways rather than start a second
     line, because a highlights block that grows downward is just .facts
     again. The scrollbar is hidden on every engine that lets us (this sits on
     a coloured gradient where a track reads as damage) and the chips stay
     tappable either way. */
  .hl{display:flex; flex-wrap:nowrap; gap:6px; margin-top:12px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px;}
  .hl::-webkit-scrollbar{display:none;}
  .hl-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
    color:#fff; font:inherit; font-size:.78rem; font-weight:600;
    padding:5px 11px; border-radius:20px; white-space:nowrap;}
  .hl-ic{font-size:.85rem; line-height:1;}
  .hl-auto{font-variant-numeric:tabular-nums;}
  button.hl-chip{cursor:pointer; text-align:left;}
  button.hl-chip:hover{background:rgba(255,255,255,.3); border-color:rgba(255,255,255,.6);}
  button.hl-chip:focus-visible{outline:2px solid #fff; outline-offset:2px;}
  h2{font-size:1.15rem; margin:26px 0 12px; color:var(--text);
    display:flex; align-items:center; gap:8px;}
  h2 .ic{font-size:1.1rem}
  .card{background:var(--bg-card); border:1px solid var(--border-light); border-radius:14px;
    padding:10px 14px; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .card h3{font-size:1.02rem; display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .card h3 .price{font-size:.82rem; color:var(--text-3); font-weight:600; white-space:nowrap;}
  .card p{font-size:.9rem; color:var(--text-3); margin-top:5px;}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .hours{display:inline-block; font-size:.78rem; font-weight:600;
    padding:3px 9px; border-radius:6px;}
  .late{background:var(--green-soft); color:var(--green-ink);}
  .day{background:var(--amber-soft); color:var(--amber-ink);}
  .eve{background:var(--blue-soft); color:var(--blue);}
  .maplink{display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:700;
    color:#fff; background:var(--accent); padding:5px 11px; border-radius:20px; text-decoration:none;}
  .maplink:active{background:var(--accent-hover);}
  .weblink{display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:700;
    color:var(--accent-hover); background:#fff; border:1.5px solid var(--accent);
    padding:4px 11px; border-radius:20px; text-decoration:none;}
  .weblink:active{background:var(--accent-soft);}
  .phonelink{display:inline-flex; align-items:center; gap:5px; font-size:.78rem; font-weight:700;
    color:var(--text-3); background:#fff; border:1.5px solid var(--border-light);
    padding:4px 11px; border-radius:20px; text-decoration:none;}
  .phonelink:active{background:var(--bg-softer);}
  /* A guide link whose address used a scheme the app refuses to make live
     (see safeHref): the label still shows, so the traveler can see what the
     guide claimed, but it must not look tappable. Declared after the three
     link classes so the muted treatment wins over whichever one it carries. */
  .deadlink{color:var(--text-3); background:var(--bg-softer); border:1.5px dashed var(--border-light);
    text-decoration:line-through; cursor:default; opacity:.75;}
  .deadlink:active{background:var(--bg-softer);}
  .nosite{font-size:.74rem; color:var(--text-3); font-style:italic;}
  .callout{background:var(--amber-soft); border:1px solid var(--amber); border-left:4px solid var(--amber);
    border-radius:10px; padding:14px 16px; margin:4px 0 20px; font-size:.9rem;}
  .callout b{color:var(--amber-ink);}
  .lead{font-size:.92rem; color:var(--text-3); margin-bottom:6px;}
  .tag{display:inline-block; font-size:.72rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.4px; color:var(--accent-hover); background:var(--accent-soft); padding:2px 7px; border-radius:5px; margin-right:6px;}
  /* Owner feedback 2026-08-26: "fix font in footer, currently hard to read,
     can't distinguish between normal text and links, don't use all caps."
     .78rem of #666 on a #ccc page is roughly 3:1 against the ground, which is
     under the readable-text bar; the links inside it inherited the same size
     and only differed by hue. So: bigger, darker text, and links that carry
     BOTH the accent colour and an underline, because colour alone is not a
     distinction a lot of readers can make. */
  .foot{font-size:.85rem; color:var(--text-2); margin-top:28px; text-align:center; line-height:1.7;}
  .foot a{color:var(--accent-hover); font-weight:600; text-decoration:underline;
    text-underline-offset:2px;}
  .foot a:hover{color:var(--accent);}
  a{color:var(--accent);}

  /* Expand all / Collapse all, once per tab. A footnote in the reading order:
     muted, small, and set on the baseline the first section heading sits on,
     so it is there when a long guide needs folding away and does not read as
     a third row of controls when it does not. Text links rather than pills,
     which is the exception the house wordless-icon rule makes for a control
     whose whole meaning is a verb pair. */
  .xall-row{display:flex; align-items:center; gap:7px; margin:0 0 10px; flex-wrap:wrap;}
  .xall{font:inherit; font-size:.76rem; font-weight:600; color:var(--text-3);
    background:none; border:none; padding:2px 0; cursor:pointer; text-decoration:underline;
    text-underline-offset:2px;}
  .xall:hover{color:var(--accent-hover);}
  .xall-sep{font-size:.76rem; color:var(--text-3);}


  /* --- Plan tab: drag an item to reorder it, or onto another day --- */
  /* Replaces v5's day-slot reorder styling (the .days grid it dressed no
     longer renders anywhere). The six-dot grip is carried over; it is now
     40x44 so it clears the 36px coarse-pointer minimum with room to spare,
     and it sits in its own gutter on the left of the card, well away from the
     status icons on the right of the expanded panel. */
  .card.dragrow{position:relative; padding-left:52px; touch-action:pan-y;}
  .plangrip{position:absolute; left:6px; top:8px; width:40px; height:44px;
    display:flex; align-items:center; justify-content:center; cursor:grab;
    touch-action:none; border-radius:10px; color:var(--accent-hover); opacity:.5;
    -webkit-user-select:none; user-select:none;}
  .plangrip:hover{opacity:1; background:rgba(199,32,39,.08);}
  .plangrip:active{cursor:grabbing; opacity:1; background:rgba(199,32,39,.12);}
  .plangrip:focus-visible{outline:2px solid var(--accent); outline-offset:2px; opacity:1;}
  .plangrip svg{width:16px; height:16px; pointer-events:none;}
  .card.dragging{opacity:.96; border-color:var(--accent);
    box-shadow:0 12px 26px rgba(157,24,29,.28); z-index:50;}
  /* A card in the air must not also be selecting text, or opening itself when
     the finger lifts. */
  body.plan-dragging{user-select:none; -webkit-user-select:none;}
  body.plan-dragging .card-hd{pointer-events:none;}
  /* The day the card would land on, including a collapsed day whose header is
     the only thing it has to offer. */
  /* Today banner: the wheres current-banner vocabulary (accent frame,
     corner badge, soft accent shadow) so the pinned group reads as "you are
     here", not as a mis-sorted day. */
  .planday-today{position:relative; background:var(--bg-card);
    border:1px solid var(--accent); border-radius:12px;
    padding:30px 12px 12px; margin:0 0 28px;
    box-shadow:0 4px 20px rgba(199,32,39,.10), 0 1px 3px rgba(0,0,0,.05);}
  .planday-today::before{content:'TODAY'; position:absolute; top:0; left:0;
    background:var(--accent); color:#fff; padding:4px 13px;
    border-radius:11px 0 8px 0; font-size:.66rem; font-weight:800;
    letter-spacing:.14em;}
  .planday-today > h2{margin:2px 0 10px;}
  .planday-today .card{box-shadow:none;}
  .planday.drop-into{background:var(--accent-soft); border-radius:12px;
    box-shadow:0 0 0 2px var(--accent);}
  .planday.drop-into > h2{color:var(--accent-hover);}
  /* A past day everything on which is done folds itself away and then gets
     OUT OF THE WAY: same as the app fades a done card, so the eye lands on
     what is still coming rather than on a row of finished dates. Still fully
     legible and still one tap from opening, which is why this is opacity and
     weight rather than a smaller type size. */
  .planday-settled > .sec-toggle{opacity:.62; font-weight:600;}
  .planday-settled > .sec-toggle:hover,
  .planday-settled > .sec-toggle:focus-visible{opacity:1;}
  .planday-settled .sec-count{color:var(--green-ink); font-weight:700;}
  /* "Nothing planned yet" must not sit under the card being dropped on it. */
  .planlist.has-drop > .empty-note{display:none;}
  /* A section tab's card list. Purely a drag container: it carries the
     section id the reorder writes to and nothing visual of its own, so a
     section tab looks exactly as it did before the grips arrived. */
  .seclist{display:block;}

  /* --- v3 additions --- */
  .daycard{background:var(--bg-card); border:1px solid var(--border-light); border-radius:14px;
    padding:0; margin-bottom:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .daycard .hd{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    background:var(--bg-softer); padding:9px 16px; border-bottom:1px solid var(--border-light);}
  .daycard .hd .d{font-weight:800; font-size:.8rem; letter-spacing:.6px;
    text-transform:uppercase; color:var(--text);}
  .daycard .hd .t{font-size:.82rem; color:var(--text-3);}
  .daycard .bd{padding:12px 16px 14px;}
  .daycard .bd h3{font-size:1.02rem; display:flex; justify-content:space-between;
    align-items:baseline; gap:10px; flex-wrap:wrap;}
  .daycard .bd h3 .price{font-size:.82rem; color:var(--text-3); font-weight:600; white-space:nowrap;}
  .daycard .bd p{font-size:.9rem; color:var(--text-3); margin-top:5px;}
  .backup{background:var(--amber-soft); border:1px dashed var(--amber); border-radius:12px;
    padding:12px 16px; margin:2px 0 22px;}
  .backup .bt{font-size:.72rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--amber-ink); margin-bottom:7px;}
  .backup ul{margin:0; padding-left:18px;}
  .backup li{font-size:.86rem; color:var(--text-3); margin-bottom:5px;}
  .backup li b{color:var(--text);}
  .warn{background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:10px;
    padding:12px 16px; margin:4px 0 20px; font-size:.88rem; color:var(--text);}
  .warn b{color:var(--accent-hover);}
  .links{margin-top:9px; font-size:.82rem;}
  .links a{font-weight:600; text-decoration:none;}
  .links span{color:var(--border-light); margin:0 5px;}

  /* --- cityops additions --- */
  /* neutral badge when no class given */
  .hours:not(.late):not(.day):not(.eve){background:var(--bg-softer); color:var(--text-3);}
  .ctl-row{display:flex; align-items:center; gap:5px; margin-top:6px; flex-wrap:wrap;}
  .ctl{font:inherit; font-size:.74rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:4px 11px; cursor:pointer;}
  .ctl:hover{border-color:var(--accent);}
  .ctl.to-done:hover{border-color:var(--green); color:var(--green);}
  .ctl.to-archived:hover{border-color:var(--accent); color:var(--accent);}
  /* The day the item is already on: shown so the picker states where things
     stand, but not a tap target, since moving an item to its own day is an
     action that cannot succeed. */
  .ctl.is-current{background:var(--accent-soft); border-color:var(--accent);
    color:var(--accent-hover); cursor:default;}
  .ctl:disabled{cursor:default;}
  .ctl:disabled:hover{border-color:var(--accent);}
  .item-done{opacity:.55;}
  .donemark{color:var(--green); font-weight:800; margin-right:6px;}
  .arch-details{margin:2px 0 22px;}
  .arch-details summary{font-size:.72rem; font-weight:800; letter-spacing:.6px;
    text-transform:uppercase; color:var(--text-3); cursor:pointer; padding:6px 0;}
  .arch-details .card, .arch-details .daycard{opacity:.7;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 16px; align-items:center;}
  .toolbar button{font:inherit; font-weight:700; color:var(--accent-hover); background:#fff;
    border:1.5px solid var(--border-light); border-radius:20px; padding:5px 13px;
    cursor:pointer; font-size:.8rem;}
  .toolbar button:hover{border-color:var(--accent);}
  .toolbar .flag{font-size:.74rem; color:var(--amber); font-weight:700;}
  .errcard{background:var(--accent-soft); border-left:4px solid var(--accent); border-radius:10px;
    padding:14px 16px; margin:20px 0; font-size:.9rem;}
  .errcard b{color:var(--accent-hover);}
  #notice{font-size:.78rem; color:var(--text-3); margin:8px 0;}
  /* An EMPTY notice line is the normal case, and an empty block with a margin
     and no height self-collapses: its 8px top margin escaped through .wrap
     (padding-top:0) and body and pushed the whole page, red band included, 8px
     off the top of the window. Owner ask 2026-08-27: "cleanup the margin at
     the top... was only intended to be left/right." Taking it out of flow when
     it has nothing to say is the fix, and it also stops an empty line eating
     16px of vertical rhythm above the first card. */
  #notice:empty{display:none;}
  .when-line{font-size:.8rem; color:var(--text-3); font-style:italic; margin-top:2px;}
  .modal-wrap{position:fixed; inset:0; background:rgba(36,36,36,.5); display:flex;
    align-items:center; justify-content:center; padding:16px; z-index:100;}
  .modal{background:#fff; border-radius:14px; padding:18px; max-width:640px;
    width:100%; max-height:85vh; overflow:auto;}
  .modal textarea{width:100%; min-height:200px; font-family:ui-monospace,Menlo,monospace;
    font-size:.78rem; border:1px solid var(--border-light); border-radius:8px; padding:10px;}
  .modal .mrow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .modal .diff{font-size:.8rem; color:var(--text-3); margin-top:8px; white-space:pre-line;}
  body.share .ctl-row, body.share .plangrip{display:none;}
  .sec-toggle{font:inherit; color:inherit; background:none; border:none; padding:0;
    display:flex; align-items:center; gap:8px; cursor:pointer; text-align:left;}
  .sec-toggle .chev{font-size:.8rem; color:var(--text-3); width:14px; flex:0 0 auto;}
  .sec-count{font-size:.78rem; color:var(--text-3); font-weight:600; margin-left:6px;}
  h2.collapsed{opacity:.85; margin-bottom:8px;}
  body.share .sec-toggle{pointer-events:none;}
  body.share .sec-toggle .chev{display:none;}
  /* Add a place, on the header of the section it belongs to. margin-left:auto
     parks it at the far right of the h2 flex row, away from the toggle that
     occupies the whole left side, so a thumb reaching for collapse never
     opens a form instead. */
  .sec-add{margin-left:auto; flex:0 0 auto; font:inherit; font-size:1.05rem; font-weight:700;
    line-height:1; color:var(--accent-hover); background:#fff;
    border:1.5px solid var(--border-light); border-radius:50%;
    width:30px; height:30px; padding:0; cursor:pointer;}
  .sec-add:hover{border-color:var(--accent); background:var(--accent-soft);}
  body.share .sec-add{display:none;}
  .daycard .bd + .bd{border-top:1px dashed var(--border-light);}
  .title-edit{width:100%; font:inherit; font-size:1rem; font-weight:600; padding:8px 10px;
    border:1.5px solid var(--accent); border-radius:8px; margin-top:4px;}
  .empty-day .hd{border-bottom:none;}
  .empty-day .free-day{padding:6px 16px 10px; font-size:.8rem; color:var(--text-3); font-style:italic;}
  .date-field{font:inherit; font-size:.85rem; padding:6px 10px; border:1px solid var(--border-light);
    border-radius:8px; background:#fff; color:var(--text);}
  .link-field{flex:1 1 220px; min-width:0;}
  .intel{margin-top:8px;}
  .intel summary{font-size:.72rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--text-3); cursor:pointer; padding:4px 0;}
  .verdict{font-size:.86rem; margin-top:4px;}
  .tier{display:inline-block; font-size:.68rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.4px; padding:1px 6px; border-radius:5px; margin-right:6px; vertical-align:middle;}
  .tier-must{background:var(--green-soft); color:var(--green);}
  .tier-good{background:var(--bg-softer); color:var(--text-3);}
  .tier-skip{background:var(--amber-soft); color:var(--amber);}
  .tips{margin:6px 0 0 18px; font-size:.84rem; color:var(--text-3);}
  .tips li{margin-bottom:3px;}
  .intel-src{font-size:.72rem; color:var(--text-3); font-style:italic; margin-top:4px;}

  /* --- Phase 3: compact cards, tap to expand --- */
  /* The header button IS the whole collapsed row: name (+ done check) and the
     tags, nothing else. Styled to read exactly like the old h3 it replaces. */
  .card-hd{width:100%; font:inherit; font-size:1.02rem; color:inherit; background:none; border:none;
    margin:0; padding:0; text-align:left; cursor:pointer;
    display:flex; align-items:baseline; justify-content:flex-start; gap:8px; flex-wrap:wrap;}
  .card-hd-tags{display:flex; gap:6px; flex-wrap:wrap; margin-left:2px;}
  .card-hd-chev{font-size:.78rem; color:var(--text-3); margin-left:auto; flex:0 0 auto; padding-left:8px;}
  .card-detail{margin-top:5px;}
  /* Always in the DOM (see appendCard's comment); hidden, not just visual,
     when the card is collapsed: display:none also drops it from the tab
     order and the accessibility tree. */
  .collapsed > .card-detail{display:none;}
  .price-line{font-size:.82rem; color:var(--text-3); font-weight:600; margin-top:2px;}
  /* Icon-only status buttons (feature 5): a touch-friendly minimum width so a
     single glyph is not a sliver to tap. Archive keeps its text label (see
     the engine's TRANSITIONS table) so its button is simply wider. */
  .icon-btn{min-width:36px; text-align:center;}
  /* An icon button that also carries its text (the Plan tab's day-move
     control) is a normal-width pill, not a 36px square. */
  .icon-btn.has-label{min-width:0;}

  /* --- Pin to the header highlights row ---
     Pinned reads filled and accented; unpinned reads like every other control
     in the row. Disabled means the row is full: it stays visible and keeps
     its tooltip, because a control that disappears at the cap teaches the
     traveler nothing about why. */
  .pin-btn.pinned{border-color:var(--accent); background:var(--accent-soft);}
  .ctl.pin-btn:disabled{opacity:.45; cursor:not-allowed;}
  .ctl.pin-btn:disabled:hover{border-color:var(--border-light);}
  .ask-btn:hover{border-color:var(--accent); background:var(--accent-soft);}
  /* On the Info tab an item is a paragraph in a shared block, not a card with
     a control row, so its pin floats at the start of the line the headline
     sits on. */
  .info-card .info-item > .pin-btn{float:right; margin:0 0 4px 8px; min-width:32px;}
  body.share .info-card .info-item > .pin-btn{display:none;}
  .info-card .info-item.just-moved{animation:justmoved 1.8s ease-out 1; border-radius:8px;}
  .task-row.just-moved{animation:justmoved 1.8s ease-out 1;}

  /* Add-a-place form fields: label over control, one per row, so a 390px
     phone never puts a label and its input on the same line. */
  .field{margin-top:12px;}
  .field-label{display:block; font-size:.72rem; font-weight:800; letter-spacing:.6px;
    text-transform:uppercase; color:var(--text-3); margin-bottom:5px;}
  .field .date-field, .field select{width:100%;}
  /* Overrides the 200px monospace JSON-paste box .modal textarea sets: this
     one holds one sentence about who recommended the place, and at 200px it
     pushed Add below the fold on a 390px phone. */
  .modal textarea.note-field{width:100%; font:inherit; font-size:.9rem; padding:8px 10px;
    min-height:0; height:70px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .field-hint{font-size:.75rem; color:var(--text-3); margin-top:4px;}

  /* A day move relocates the card under a different day heading, often far
     off screen. The engine scrolls it back into view and adds this class for
     1.8s so the eye lands on the card that just moved rather than on whatever
     happens to be at that scroll position. */
  .card.just-moved, .daycard.just-moved{animation:justmoved 1.8s ease-out 1;}
  @keyframes justmoved{
    0%{box-shadow:0 0 0 3px var(--accent);}
    65%{box-shadow:0 0 0 3px var(--accent);}
    100%{box-shadow:0 1px 2px rgba(0,0,0,.03);}
  }
  /* Reduced motion still needs the answer to "where did it go", so the ring
     stays; only the fade is dropped. */
  @media (prefers-reduced-motion: reduce){
    .card.just-moved, .daycard.just-moved{animation:none; box-shadow:0 0 0 3px var(--accent);}
  }

  /* --- Phase 3: section header counts + sticky section nav --- */
  /* top is the rendered #tabbar height (Phase 4), kept in sync by
     updateTabbarHeightVar() in the engine so the two sticky bars stack
     instead of overlapping; 0px is the safe fallback before that JS runs (or
     on a shell that predates the tab bar). z-index stays below #tabbar's 26
     so #tabbar is always the one on top if a scroll ever puts them in the
     same few pixels. */
  #secnav{position:sticky; top:var(--tabbar-h, 0px); z-index:20; display:flex; gap:8px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; background:var(--bg); padding:8px 0 10px; margin:0 0 6px;}
  #secnav[hidden]{display:none;}
  .secnav-chip{flex:0 0 auto; font:inherit; font-size:.78rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:5px 13px; cursor:pointer; white-space:nowrap;}
  .secnav-chip:hover{border-color:var(--accent);}

  /* --- Phase 3: Today / Guide / Calendar segmented control --- */
  .viewseg{display:flex; border:1.5px solid var(--border-light); border-radius:20px; overflow:hidden;}
  .viewtab{font:inherit; font-size:.8rem; font-weight:700; color:var(--accent-hover); background:#fff;
    border:none; padding:5px 13px; cursor:pointer;}
  .viewtab + .viewtab{border-left:1.5px solid var(--border-light);}
  .viewtab.active{background:var(--accent); color:#fff;}

  /* --- Phase 3: Today view --- */
  .up-next{font-size:.85rem; color:var(--text-3); font-style:italic; margin:4px 0 20px;}

  /* narrow phones: trim horizontal chrome so cards get the width */
  @media (max-width: 430px){
    /* Side padding is --gutter at every width now: this tier used to drop it
       to 10px, which left the two surfaces 6px apart on the one screen Rob
       actually reads them on (the trip side's phone gutter is the same 16px).
       Only the VERTICAL rhythm tightens here, which is what the density pass
       this tier came from was actually about. */
    .wrap{padding:0 var(--gutter) 48px;}
    .wrap>header{margin:0 calc(50% - 50vw) 16px; border-radius:0;
      padding:20px var(--bleed-pad) 16px;}
    header h1{font-size:1.35rem;}
    .facts{gap:6px; margin-top:10px;}
    .chip{padding:4px 9px; font-size:.75rem;}
    .hl{gap:5px; margin-top:10px;}
    .hl-chip{padding:4px 9px; font-size:.74rem;}
    .card{padding:8px 10px; margin-bottom:6px; border-radius:12px;}
    .daycard{border-radius:12px;}
    .daycard .hd{padding:8px 12px;}
    .card.dragrow{padding-left:50px;}
    .daycard .bd{padding:10px 12px 12px;}
    .backup{padding:10px 12px;}
    .callout, .warn, .errcard{padding:12px 12px;}
    .toolbar{gap:6px;}
    .toolbar button{padding:5px 10px; font-size:.75rem;}
    h2{margin:16px 0 8px;}
    .card-hd{font-size:.96rem; gap:6px;}
    .ctl-row{gap:4px;}
    .ctl{padding:4px 9px;}
    .planday-today{padding:26px 8px 10px; margin:0 0 18px;}
    #secnav{gap:6px;}
    .secnav-chip{padding:4px 10px; font-size:.74rem;}
    .viewtab{padding:5px 10px; font-size:.75rem;}
  }
  @media print{
    .toolbar, .ctl-row, .plangrip, #notice, #secnav, #tabbar{display:none !important;}
    /* The pin chips are shortcuts to cards the printed page already carries
       in full, so they print as noise; the sunset is a fact nothing else on
       the page states, so it stays. Same reasoning for the section + and the
       Info tab's floating pin: controls do not belong on paper. */
    .hl-pin, .sec-add, .info-card .info-item > .pin-btn{display:none !important;}
    body{background:#fff;}
    .daycard, .card{box-shadow:none; break-inside:avoid;}
    header{background:var(--accent-hover) !important; -webkit-print-color-adjust:exact;}
    /* Print is a "here is everything" artifact: force every card open so a
       printed guide is not full of collapsed headers with nothing under them. */
    .card-detail{display:block !important;}
  }

  /* --- Phase 4: tab bar (replaces the Today/Guide/Calendar view switch) --- */
  /* Sticky, horizontally scrollable, phone-first: at 375px five chips plus
     More do not all fit without scrolling, and that is fine (a native
     horizontal scroller reads better on a phone than wrapped rows of chips
     eating vertical space). 44px min-height keeps every chip a comfortable
     tap target. */
  #tabbar{position:sticky; top:0; z-index:26; display:flex; gap:6px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; background:var(--bg); padding:8px 0 10px; margin:0 0 10px;
    border-bottom:1px solid var(--border-light);}
  #tabbar[hidden]{display:none;}
  .tabchip{flex:0 0 auto; font:inherit; font-size:.82rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:8px 14px; cursor:pointer; white-space:nowrap; min-height:44px;
    display:flex; align-items:center;}
  .tabchip:hover{border-color:var(--accent);}
  .tabchip.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .tab-more{font-weight:800; padding:8px 12px; min-width:44px; justify-content:center; margin-left:auto;}

  /* A small date pill on a flat item card (Eat & Drink / Do / Services /
     Info) once that item has been assigned to a day: the visible result of
     "Add to a day", and the reason a traveler can tell at a glance an item
     already lives somewhere on the Plan tab. */
  .daychip{font-size:.72rem; font-weight:700; color:var(--accent-hover); background:var(--accent-soft);
    border-radius:20px; padding:2px 9px; white-space:nowrap;}

  /* --- Phase 4: Info tab reference block --- */
  /* One card per section, every undated item's name (bold) then its note,
     stacked: no accordion, no status controls, since these are facts, not
     todos (item 6 of the spec). */
  /* Owner feedback 2026-08-25: a headline belongs to the text UNDER it. The
     space that says so has to sit ABOVE the headline, and the gap under it
     has to be smaller than the gap over it, or the eye groups each bold name
     with the block it follows instead of the note it introduces.
     What made that go wrong: `.card p` (one class + one type) outweighs
     `.info-item` (one class), so the 12px here never applied and every
     headline got `.card p`'s 5px, against 10px of `.row` margin under the
     previous item's link pills. Every selector below is qualified with
     .info-card so it actually wins, and the numbers are set as a pair:
     22px over the headline, 1px under it, 6px between a note and its own
     links so the pills stay part of the item they belong to. */
  .info-card h3{font-size:1rem; margin-bottom:2px;}
  .info-card .info-item{font-size:.9rem; color:var(--text-3); margin-top:22px;}
  .info-card .info-item:first-of-type{margin-top:10px;}
  .info-card .info-item strong{display:block; color:var(--text); margin-bottom:1px; font-size:.94rem;}
  .info-card .row{margin-top:6px;}

  /* --- Phase 4: Plan tab open tasks --- */
  .task-row{padding:10px 0; border-bottom:1px solid var(--border-light);}
  .task-row:last-child{border-bottom:none;}
  /* The checkbox (or the declined name) takes the width it needs; the decline
     or restore control is pinned to the far end of the row, well clear of the
     tick target. */
  .task-line{display:flex; align-items:center; gap:10px;}
  .task-check{display:flex; align-items:center; gap:10px; font-size:.95rem; font-weight:600;
    color:var(--text); cursor:pointer; min-height:44px; flex:1 1 auto;}
  .task-check input[type="checkbox"]{width:20px; height:20px; flex:0 0 auto; cursor:pointer;}
  .task-note{font-size:.85rem; color:var(--text-3); margin:2px 0 0 30px;}
  .task-row.item-done .task-check{opacity:.55; text-decoration:line-through;}
  /* A declined task has no checkbox, so its name is inset by exactly the
     checkbox plus its gap (20px + 10px). Without that the declined names hang
     a full tick-box to the left of the open ones and the two lists read as
     two different things rather than two outcomes of the same list. */
  .task-check-off{cursor:default; padding-left:30px;}
  .task-ctl{flex:0 0 auto; min-height:36px; line-height:1;}
  .task-row.task-declined .task-check{opacity:.5; text-decoration:line-through;}
  .task-row.task-declined .task-note{opacity:.6;}

  /* --- Phase 4: the More action sheet (every utility action, one place) --- */
  /* Aug 2026 grouping pass: the flat eight-row list of bare labels made the
     traveler read and rank every line each time. Now three labelled clusters,
     each row an icon plus a label plus one muted line of what it does. The
     group label borrows the uppercase-muted idiom the archive and intel
     disclosures already use, so nothing new has to be learned to read it. */
  .sheet-group{margin-top:14px;}
  .modal h3 + .sheet-group{margin-top:6px;}
  .sheet-grouplabel{font-size:.72rem; font-weight:800; letter-spacing:.6px;
    text-transform:uppercase; color:var(--text-3); padding:0 4px 2px;}
  /* The destructive cluster is pushed clear of the rest and fenced off with a
     rule of its own: Remove city must never sit one careless thumb-width
     below a row someone actually meant to tap. */
  .sheet-group-last{margin-top:20px; border-top:1px solid var(--border); padding-top:10px;}
  .sheet-list{display:flex; flex-direction:column;}
  .sheet-row{font:inherit; color:var(--text); background:none;
    border:none; border-bottom:1px solid var(--border-light); text-align:left; padding:10px 4px;
    cursor:pointer; min-height:52px; display:flex; align-items:center; gap:12px;}
  .sheet-row:last-child{border-bottom:none;}
  .sheet-row:hover .sheet-label{color:var(--accent-hover);}
  .sheet-ic{flex:0 0 22px; font-size:1.05rem; line-height:1.2; text-align:center;}
  .sheet-txt{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .sheet-label{font-size:.95rem; font-weight:700;}
  .sheet-desc{font-size:.78rem; font-weight:400; color:var(--text-3); line-height:1.35;}
  .sheet-row.danger .sheet-label{color:var(--accent-hover); font-weight:800;}
  /* Enrich's three passes borrow the same group label, with room above so
     each pass reads as its own block. */
  .enrich-h{margin-top:18px; padding-left:0;}

  @media (max-width: 430px){
    #tabbar{gap:4px;}
    .tabchip{padding:7px 11px; font-size:.76rem; min-height:40px;}
    .tab-more{padding:7px 10px;}
  }

  /* --- Density pass: fit more of the stay on one phone screen --- */
  /* Owner ask, mid-trip in Tirana: "minimize vertical space so we can fit
     more on screen". A collapsed Plan-tab card is now exactly two rows, the
     title row and the control row, and everything that used to have a line of
     its own (the section label, the `when` hint, the link pills) either
     joined one of those two rows or went behind the existing expander. */

  /* The section icon in front of the title, replacing the old .sec-meta line
     above the card. The label it used to spell out is on the icon as both
     title and aria-label, so nothing is lost to a screen reader or a hover. */
  .sec-ic{flex:0 0 auto; font-size:1rem; line-height:1.2;}
  /* The fallback for a guide whose sections have no icons: the old
     .sec-meta wording and colour, inline in the title row instead of on a
     line of its own. Accent, not the rating badge's neutral, so the two
     never read as the same kind of thing. */
  .sec-lab{flex:0 0 auto; font-size:.64rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.4px; color:var(--accent); white-space:nowrap;}

  /* Ratings are INFORMATION, not action: muted neutral tokens, never the
     accent, and nothing here is tappable. Provenance rides in the tooltip. */
  .rating{flex:0 0 auto; font-size:.76rem; font-weight:700; color:var(--text-2);
    background:var(--bg-softer); border-radius:5px; padding:1px 6px; white-space:nowrap;}
  .rcount{font-weight:600; color:var(--text-3); margin-left:4px;}

  /* The `when` hint, inline after the title. nowrap plus a flexible basis is
     what makes it sit on the title row when it fits and drop to its own line
     when it does not; the ellipsis and max-width are the guarantee that a
     long one can never widen the page into a horizontal scroll. */
  .when-hint{flex:0 1 auto; min-width:0; max-width:100%; font-size:.78rem; font-weight:400;
    color:var(--text-3); font-style:italic; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis;}

  /* Map / web / call, in the control row rather than on a row of their own.
     They keep their pill colouring (these NAVIGATE; the outlined buttons
     beside them MUTATE the plan) and lose only their text, which becomes the
     tooltip and the accessible name. Declared after .maplink/.weblink/
     .phonelink so the compact geometry wins. */
  .ctl-link{display:inline-flex; align-items:center; justify-content:center; gap:0;
    min-width:36px; padding:4px 9px; font-size:.86rem; line-height:1.1;
    border-radius:20px; text-decoration:none;}
  .ctl-link + .ctl{margin-left:5px;}
  /* The pin, the globe and the handset are COLOUR emoji: they paint their own
     red, blue and black and cannot inherit a foreground colour. .maplink is
     white-on-accent, so once the word "Map" went away the red pin landed on
     red and the control read as a blank circle. The label used to carry it;
     with the label gone the container is what has to change. The compact map
     link therefore takes the same white ground its two siblings already have
     and keeps the accent border that says NAVIGATE, still distinct from the
     grey-bordered buttons beside it that MUTATE the plan. */
  .ctl-link.maplink{background:#fff; color:var(--accent-hover);
    border:1.5px solid var(--accent);}
  .ctl-link.maplink:active{background:var(--accent-soft);}
  /* Same override for the compact form of a refused link: .ctl-link.maplink
     above is more specific than .deadlink on its own, so the muted treatment
     has to be restated at that specificity or a dead map control would still
     wear the live accent border. */
  .ctl-link.deadlink{background:var(--bg-softer); color:var(--text-3);
    border:1.5px dashed var(--border-light); text-decoration:none; opacity:.75;}

  /* Archive and Rename wait for the card to be expanded. display:none, not
     visibility, so they are out of the tab order and the accessibility tree
     on a collapsed card, exactly like the detail panel above them. */
  .collapsed > .ctl-row > .ctl-more{display:none;}

  /* Coarse pointers get the 36px minimum on every control in the row; a mouse
     gets the tighter geometry, since a cursor does not need a thumb's worth
     of target. */
  @media (pointer: coarse){
    .ctl, .ctl-link{min-height:36px;}
    .ctl{display:inline-flex; align-items:center; justify-content:center;}
    /* The two controls that stand ALONE rather than in a row of siblings get
       the full 44px thumb target: there is no neighbouring pill to line up
       with, and a mistap on either has a visible consequence. */
    .sec-add{width:44px; height:44px;}
    .info-card .info-item > .pin-btn{min-width:44px; min-height:44px;}
    .hl-chip{min-height:36px;}
  }


  /* --- app shell: multi-city switcher (index.html only) --- */
  /* Dense in-header controls: the h1 itself is the switcher trigger (chevron
     appended after it), and a translucent chip in the header's top-right opens
     Add-city. Both live inside #hdr, which the engine fully replaces
     (innerHTML='') on every render, so decorateHeader() re-appends them from
     CityOps.onStateChange every time: see the appshell script below. The
     header must not grow to fit these; they overlay the existing chrome. */
  #hdr{position:relative;}
  #hdr h1{cursor:pointer; display:inline-flex; align-items:center; gap:2px;}
  .hdr-chev{font-size:.85rem; opacity:.85;}
  /* Profile, sync and + Add city are app-level controls (not per-city ones):
     Profile holds ONE interest profile and ONE Claude key for every city, so
     it lives in the header rather than inside the city dropdown, which would
     read as "this city's profile".

     They used to be absolutely positioned over the band, which is why they
     had a `top` per breakpoint and why the city title had to leave room for
     them. They now sit in the shared header's own peer row (#hdr-acts), which
     lays them out; .hdr-chip itself is defined once in src/header.css and
     shared with the trip surface. */

  /* Dropdown panel: floats directly under the header (does not add header
     height); #citybar is its host, positioned inside .wrap right after
     #hdr so it shares the content width. */
  #citybar{position:relative;}
  /* Open state must be unmistakable: the panel attaches flush to the header
     (full-bleed, square top like the header itself) and a scrim dims the page
     behind it. */
  .city-scrim{position:fixed; inset:0; background:rgba(36,36,36,.35); z-index:55;}
  .citypanel{position:absolute; top:-20px; left:-16px; right:-16px; z-index:60;
    background:var(--bg-card); border:1px solid var(--border-light); border-top:none;
    border-radius:0 0 14px 14px;
    overflow:hidden; box-shadow:0 14px 30px rgba(0,0,0,.28);}
  @media (min-width: 431px){
    .citypanel{top:-24px;}
  }
  .cityrow{display:block; width:100%; font:inherit; text-align:left; color:var(--text);
    background:none; border:none; border-bottom:1px solid var(--border-light);
    padding:11px 14px; cursor:pointer;}
  .cityrow:last-of-type{border-bottom:none;}
  .cityrow:hover{background:var(--bg-softer);}
  .cityrow.current{background:var(--accent-soft);}
  .cityrow .cname{font-weight:600; font-size:.9rem;}
  .cityrow.current .cname{font-weight:800;}
  .cityrow .dot{display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--accent); margin-left:7px; vertical-align:middle;}
  .cityrow .cdates{display:block; font-size:.76rem; color:var(--text-3); margin-top:1px;}
  .cityact{display:flex; gap:8px; flex-wrap:wrap; padding:10px 14px;
    background:var(--bg-softer); border-top:1px solid var(--border-light);}
  .cityact button{font:inherit; font-size:.78rem; font-weight:700; color:var(--accent-hover);
    background:#fff; border:1.5px solid var(--border-light); border-radius:20px;
    padding:5px 13px; cursor:pointer;}
  .cityact button:hover{border-color:var(--accent);}
  .blank-cc{width:84px; flex:0 0 auto; text-transform:uppercase;}
  .name-confirm{width:100%; font:inherit; font-size:.9rem; padding:8px 10px; margin-top:8px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal .ctl[disabled]{opacity:.45; cursor:not-allowed; border-color:var(--border-light);}
  .modal .ctl[disabled]:hover{border-color:var(--border-light);}

  /* Profile modal: chip lists reuse the pill vocabulary (rounded, bordered,
     accent ink) at tag scale, so a chip reads as an editable tag. */
  .chip-list{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0;}
  .chip-list:empty{margin:0;}
  .chipx{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:600;
    color:var(--accent-hover); background:#fff; border:1.5px solid var(--border-light);
    border-radius:20px; padding:3px 6px 3px 11px;}
  .chipx button{font:inherit; font-size:.9rem; line-height:1; font-weight:700; color:var(--text-3);
    background:var(--bg-softer); border:none; border-radius:50%; width:17px; height:17px;
    padding:0; cursor:pointer;}
  .chipx button:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .chip-add{width:100%; font:inherit; font-size:.85rem; padding:6px 10px; margin-top:6px;
    border:1px solid var(--border-light); border-radius:8px; background:#fff; color:var(--text);}
  .modal textarea.notes{min-height:80px; font-family:inherit; font-size:.85rem;}
  .modal .promptout{min-height:140px;}
  .hdr-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .hdr-row .date-field{flex:1 1 30%; min-width:96px;}

  /* Planning-factor rows (Phase 2): label left, level select right, remove
     button last. Stacks are already mobile-first (narrow rows, no fixed
     widths), so no extra @media rule is needed for phones. */
  .factor-list{margin-top:6px;}
  .factor-row{display:flex; align-items:center; gap:8px; padding:6px 0;
    border-bottom:1px solid var(--border-light);}
  .factor-row:last-child{border-bottom:none;}
  .factor-label{flex:1 1 auto; font-size:.85rem; font-weight:600; color:var(--text);}
  .factor-row select.factor-level{flex:0 0 auto; font-size:.78rem; padding:5px 6px;}
  .factor-row button{font:inherit; font-size:.9rem; line-height:1; font-weight:700; color:var(--text-3);
    background:var(--bg-softer); border:none; border-radius:50%; width:22px; height:22px;
    padding:0; cursor:pointer; flex:0 0 auto;}
  .factor-row button:hover{background:var(--accent-soft); color:var(--accent-hover);}
  .key-field{flex:1 1 100%; min-width:0;}

  /* Sync alert: amber, not red. Nothing is lost when sync stops (the device
     keeps every edit), so this is a "you should know" rather than an error.
     Full width above the header, stacked on a phone. */
  .syncalert{background:var(--amber-soft); border:1px solid var(--amber);
    border-left:4px solid var(--amber); border-radius:10px; padding:11px 13px;
    margin:0 0 12px; font-size:.82rem; line-height:1.45; color:var(--text);}
  .syncalert-txt{display:block;}
  .syncalert-acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px;}
  .syncalert-acts .ctl{font-size:.78rem;}

  /* Section leads inside the Profile modal: the modal now holds Account, the
     interest profile and the Claude key, and a reader needs to see where one
     ends and the next begins. */
  .modal .section-lead{font-weight:800; font-size:.86rem; color:var(--text);
    margin:16px 0 4px; padding-top:12px; border-top:1px solid var(--border-light);}
  /* Signed out is the state that costs the traveler something, so it does not
     look like the rest of the muted helper text. */
  .modal .acct-off{color:var(--amber-ink); background:var(--amber-soft);
    border-radius:8px; padding:8px 10px; font-weight:600;}

  /* --- Past cities in the switcher (owner ask 2026-08-26) ---
     "need the ability to archive cities previously visited in cityops page
     (take cue from plan-ahead page)". The cue taken: the trip surface groups
     stops you have left behind one collapsed disclosure and fades them to
     0.72, so a city you have left does the same here. Fade, never hide: a
     past city is still openable in one tap, and its rows still say what the
     dates were. */
  .citypast{border-top:1px solid var(--border-light);}
  .citypast > summary{list-style:none; cursor:pointer; padding:9px 14px;
    font-size:.72rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase;
    color:var(--text-3); background:var(--bg-softer);}
  .citypast > summary::-webkit-details-marker{display:none;}
  .citypast > summary:hover{color:var(--accent-hover);}
  .citypast > summary .chev{display:inline-block; margin-right:6px; font-size:.8rem;}
  .citypast .cityrow{opacity:.72;}
  .citypast .cityrow:hover, .citypast .cityrow.current{opacity:1;}
  /* The per-row archive/restore control. Wordless icon with a tooltip and an
     aria-label, per the house idiom; it sits at the right end of the row and
     stops the click from also switching city. */
  .cityrow{position:relative; padding-right:46px;}
  .city-arch{position:absolute; top:50%; right:8px; transform:translateY(-50%);
    font:inherit; font-size:.9rem; line-height:1; background:none; border:none;
    border-radius:50%; width:32px; height:32px; padding:0; cursor:pointer; opacity:.55;}
  .city-arch:hover{opacity:1; background:var(--accent-soft);}
  @media (pointer: coarse){
    .city-arch{width:44px; height:44px;}
    .cityrow{padding-right:58px;}
  }
</style>

<body>
<div class="wrap">
  <!-- The shared header is the FIRST thing in .wrap, on both surfaces, and
       that is load-bearing rather than tidy: the notice line used to sit above
       it, and an EMPTY notice line self-collapses and pushes its 8px top margin
       out through .wrap and body, which moved the whole page (red band
       included) 8px down from the top of the window. Owner ask 2026-08-27:
       "cleanup the margin at the top". Measured: the band's rect.top is 0 at
       390px and at 1440px. -->
  <!-- The ONE header, assembled into both surfaces.
     Owner ask 2026-08-27: "possible to use a shared header between cityops and
     plan-ahead? that would make the apps feel more cohesive."

     Before this, each surface hand-built its own red band: same colours, same
     bleed, different DOM, different class names, two stylesheets to keep in
     step. They had already drifted twice (the content column, then the gutter),
     and each fix had to be made twice.

     Now tools/assemble.js injects this exact block into app-shell.html and
     trip-shell.html at their header marker, and src/header.css into both
     stylesheets at the matching CSS marker. (Neither marker is spelled out in
     this file: the injected copy would then carry a second one, and the
     assembler's "exactly one marker" check exists precisely to catch a stray.)
     The CI drift guard re-runs
     assemble and diffs, so the two surfaces cannot drift again without the
     build going red.

     What is SHARED: the band itself, the Trip|Cities switch (Trip first, it
     happens first chronologically), the sync chip and
     the Profile door. What each surface fills in is #hdr-mid: the guide side
     writes the city title, its dates and its highlights row; the trip side
     writes the trip title and the NOW chip. Same box, different contents.

     #hdr-mid exists so the engine can keep wiping its own half with
     innerHTML='' on every render without taking the shared chrome with it. A
     standalone exported guide has no shared header at all (guide-shell.html
     does not carry this marker), which is why renderHeader falls back to #hdr
     when #hdr-mid is absent.

     The two hrefs are ROOT-ABSOLUTE, not relative, and that is load bearing.
     One header block ships into two surfaces that now sit at two different
     depths: the guide side at / and the trip side at /trip/. A relative
     "./trip/" would resolve to /trip/trip/ from the trip page, and "./" would
     resolve to /trip/ rather than the root, so the switch would point at
     itself from one side. The custom domain serves this repo from the root, so
     / and /trip/ are the real addresses. Known cost, accepted with the
     clean-URL move: a built file opened straight off disk over file:// no
     longer follows these two links. -->
<header class="apphdr" id="hdr">
  <div class="apphdr-bar">
    <nav class="surfsw" id="surfsw" aria-label="App surface">
      <a class="surf" id="surf-trip" href="/trip/">Trip</a>
      <a class="surf" id="surf-cities" href="/">Cities</a>
    </nav>
    <div class="apphdr-acts" id="hdr-acts"></div>
  </div>
  <div class="apphdr-mid" id="hdr-mid"></div>
</header>
  <div id="notice"></div>
  <!-- App-owned and never touched by the engine (which rewrites #notice on
       every render): the one place a stopped sync can say so and still be
       there after the next tap. -->
  <div id="syncalert"></div>
  <div id="citybar"></div>
  <div class="toolbar" id="toolbar"></div>
  <nav class="tabbar" id="tabbar" aria-label="Guide sections" hidden></nav>
  <nav class="secnav" id="secnav" aria-label="Jump to section" hidden></nav>
  <main id="main"></main>
  <div class="foot" id="foot"></div>
</div>
<div id="modal"></div>

<script id="app">
var CityOps = (function () {
  'use strict';

  var STATUSES = ['plan', 'backup', 'archived', 'done'];

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function cityId(data) {
    return slug(data.city.name) + '-' + data.city.dates.from;
  }
  function dayLabel(iso) {
    var d = new Date(iso + 'T12:00:00');
    var names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    return names[d.getDay()] + ' ' + d.getDate();
  }

  // Intel validation lives in one place so validate() (whole guide) and
  // mergeDelta() (intel pass payload) can never drift apart. `ref` is the
  // caller's prefix, already ending in the separator it wants, e.g.
  // "items[3] (nord) intel:" or 'intel["nord"]:'.
  function validateIntel(intel, ref, errors) {
    if (!intel || typeof intel !== 'object' || Array.isArray(intel)) {
      errors.push(ref + ' must be an object');
      return;
    }
    if (intel.verdicts !== undefined) {
      if (!Array.isArray(intel.verdicts)) {
        errors.push(ref + ' verdicts must be an array');
      } else {
        intel.verdicts.forEach(function (v, vi) {
          if (!v || typeof v !== 'object' || ['must', 'good', 'skip'].indexOf(v.tier) === -1) {
            errors.push(ref + ' verdicts[' + vi + '] tier must be must|good|skip');
          }
          if (!v || typeof v.text !== 'string' || !v.text.trim()) {
            errors.push(ref + ' verdicts[' + vi + '] needs non-empty text');
          }
        });
      }
    }
    if (intel.tips !== undefined) {
      if (!Array.isArray(intel.tips)) {
        errors.push(ref + ' tips must be an array');
      } else {
        intel.tips.forEach(function (t, ti) {
          if (typeof t !== 'string' || !t.trim()) {
            errors.push(ref + ' tips[' + ti + '] must be a non-empty string');
          }
        });
      }
    }
    if (intel.source !== undefined && typeof intel.source !== 'string') {
      errors.push(ref + ' source must be a string');
    }
  }

  // Structured ratings, validated in one place for the same reason intel is:
  // validate() (whole guide) and mergeDelta() (both new items and the ratings
  // map) have to agree byte for byte on what a rating is. `ref` is the
  // caller's prefix, already ending in its separator, e.g.
  // "items[3] (nord) rating:" or 'ratings["nord"]:'.
  //
  // stars is the only required field. count, source and checked are optional
  // and each may be omitted or null: a rating carried over from generation
  // research has a source but no checked date, and a rating a traveler has
  // only half of is still worth showing.
  function validateRating(r, ref, errors) {
    if (!r || typeof r !== 'object' || Array.isArray(r)) {
      errors.push(ref + ' must be an object');
      return;
    }
    if (typeof r.stars !== 'number' || !isFinite(r.stars) || r.stars < 0 || r.stars > 5) {
      errors.push(ref + ' stars must be a number from 0 to 5');
    }
    if (r.count !== undefined && r.count !== null) {
      if (typeof r.count !== 'number' || !isFinite(r.count) || r.count < 0 || Math.floor(r.count) !== r.count) {
        errors.push(ref + ' count must be a whole number, 0 or more');
      }
    }
    if (r.source !== undefined && r.source !== null && typeof r.source !== 'string') {
      errors.push(ref + ' source must be a string');
    }
    if (r.checked !== undefined && r.checked !== null && !isIso(r.checked)) {
      errors.push(ref + ' checked must be YYYY-MM-DD');
    }
  }

  // The per-item rules, shared by validate() and mergeDelta() for exactly the
  // same reason. `statuses` is the allowed status list (a whole guide allows
  // all four; a delta may only introduce plan and backup, since done and
  // archived are states the traveler sets later in the app) and `statusHint`
  // is appended to that one error so the delta case explains itself. `seen`
  // is the caller's duplicate-id map, mutated as ids are accepted.
  function validateItem(it, ref, secIds, seen, errors, statuses, statusHint) {
    if (!it || typeof it !== 'object' || Array.isArray(it)) {
      errors.push(ref + ' is not an object');
      return;
    }
    if (!it.id) errors.push(ref + ' needs id');
    else if (Object.prototype.hasOwnProperty.call(seen, it.id)) errors.push('duplicate item id "' + it.id + '"');
    else seen[it.id] = 1;
    if (!it.name) errors.push(ref + ' needs name');
    if (!Object.prototype.hasOwnProperty.call(secIds, it.section)) errors.push(ref + ' unknown section "' + it.section + '"');
    if (statuses.indexOf(it.status) === -1) {
      errors.push(ref + ' bad status "' + it.status + '"' + (statusHint || ''));
    }
    if (it.day && !/^\d{4}-\d{2}-\d{2}$/.test(it.day)) errors.push(ref + ' day must be YYYY-MM-DD');
    if (it.intel !== undefined && it.intel !== null) validateIntel(it.intel, ref + ' intel:', errors);
    if (it.rating !== undefined && it.rating !== null) validateRating(it.rating, ref + ' rating:', errors);
  }

  function validate(data) {
    var errors = [];
    if (!data || typeof data !== 'object') return ['Root is not an object'];
    if (data.schema !== 1) errors.push('schema must be 1');
    if (!data.city || !data.city.name) errors.push('city.name required');
    if (!data.city || !data.city.dates || !data.city.dates.from || !data.city.dates.to) {
      errors.push('city.dates.from and city.dates.to required');
    }
    if (!Array.isArray(data.sections) || !data.sections.length) {
      errors.push('sections[] required');
    } else {
      data.sections.forEach(function (s, i) {
        if (!s.id || !s.label) errors.push('sections[' + i + '] needs id and label');
      });
    }
    if (!Array.isArray(data.items)) {
      errors.push('items[] required');
    } else {
      var secIds = Object.create(null);
      (data.sections || []).forEach(function (s) { secIds[s.id] = 1; });
      var seen = Object.create(null);
      data.items.forEach(function (it, i) {
        var ref = 'items[' + i + ']' + (it && it.id ? ' (' + it.id + ')' : '');
        validateItem(it, ref, secIds, seen, errors, STATUSES, null);
      });
    }
    return errors;
  }

  function parse(text) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { return { data: null, errors: ['JSON parse error: ' + e.message] }; }
    var errors = validate(data);
    return { data: errors.length ? null : data, errors: errors };
  }

  // ---- delta merge ----
  // The core re-run mechanic: a PARTIAL payload from a second AI pass is folded
  // into a city that already exists, without disturbing anything the traveler
  // has done. Pure: it reads no state, touches no storage, mutates neither
  // argument, and returns a fresh deep clone. Live planning state (done marks,
  // reorders, renames) survives by construction, because it is keyed by item id
  // in a separate store this function never sees.
  //
  // Rules, all of them deliberate:
  // - errors non-empty means NO merge at all: data is null and the caller shows
  //   the list. A half-applied delta would be impossible to reason about.
  // - A delta may only introduce plan and backup items. done and archived are
  //   traveler states, never generated ones.
  // - An id that already exists is SKIPPED, never overwritten, and counted. That
  //   is what makes a re-run safe to repeat: running the same delta twice is a
  //   no-op, not a clobber. A duplicate id WITHIN one delta is an error, since
  //   that is a malformed payload rather than an overlap with existing work.
  // - delta.sections with an id that already exists is ignored, not overwritten
  //   (the traveler may have renamed a section, and a re-run must not undo it).
  // - delta.intel replaces the whole intel block on an item that exists after
  //   the merge (existing or just added); an unknown id is counted in
  //   intelSkipped, not treated as an error, because an AI naming an item the
  //   traveler has since removed is expected, not broken.
  // - delta.ratings works exactly like delta.intel, one map entry per item id,
  //   replacing the whole rating block. Replacement (not merge) is what makes
  //   a ratings refresh mean anything: a rating is a reading taken on a date,
  //   and half of last month's reading mixed with half of this month's is a
  //   number nobody took. Re-applying the SAME rating therefore replaces it
  //   and counts as applied, not skipped: ratingsSkipped counts only ids the
  //   merged guide does not have.
  // - city, city.dates and every other field of every existing item are never
  //   touched. intel and rating are the only two fields an existing item can
  //   gain here.
  var DELTA_STATUSES = ['plan', 'backup'];
  var DELTA_STATUS_HINT = ' (a delta may only add plan or backup items)';

  function emptyDeltaSummary() {
    return { added: 0, skipped: 0, sectionsAdded: 0, intelApplied: 0, intelSkipped: 0,
      ratingsApplied: 0, ratingsSkipped: 0 };
  }

  function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

  function mergeDelta(cityData, delta) {
    var errors = [];
    if (!cityData || typeof cityData !== 'object' || Array.isArray(cityData)) {
      return { data: null, summary: emptyDeltaSummary(), errors: ['No city data to merge into'] };
    }
    if (!delta || typeof delta !== 'object' || Array.isArray(delta)) {
      return { data: null, summary: emptyDeltaSummary(), errors: ['Delta is not an object'] };
    }
    if (delta.schema !== 1) errors.push('schema must be 1');
    if (delta.delta !== true) {
      errors.push('delta must be true: this is a partial payload, not a whole guide');
    }

    // Sections first: a new item may legitimately reference a section this same
    // delta introduces, so the allowed-section set has to include them.
    var newSections = [];
    if (delta.sections !== undefined && delta.sections !== null) {
      if (!Array.isArray(delta.sections)) {
        errors.push('sections must be an array');
      } else {
        delta.sections.forEach(function (s, i) {
          if (!s || typeof s !== 'object' || Array.isArray(s) || !s.id || !s.label) {
            errors.push('sections[' + i + '] needs id and label');
          } else {
            newSections.push(s);
          }
        });
      }
    }

    var secIds = Object.create(null);
    (Array.isArray(cityData.sections) ? cityData.sections : []).forEach(function (s) {
      if (s && s.id) secIds[s.id] = 1;
    });
    newSections.forEach(function (s) { secIds[s.id] = 1; });

    // Object.create(null) plus an own-property check, for the same reason the
    // intel/ratings lookup below uses them. This one was a plain {} until an
    // item id could come from a HUMAN typing a name: "Constructor" slugs to
    // "constructor", which every plain object inherits, so the item read as
    // already present and was counted as skipped rather than added. The delta
    // was reported as applied and nothing was added.
    var existingIds = Object.create(null);
    (Array.isArray(cityData.items) ? cityData.items : []).forEach(function (it) {
      if (it && it.id) existingIds[it.id] = 1;
    });

    var toAdd = [];
    var skipped = 0;
    if (delta.items !== undefined && delta.items !== null) {
      if (!Array.isArray(delta.items)) {
        errors.push('items must be an array');
      } else {
        var seen = Object.create(null);
        delta.items.forEach(function (it, i) {
          var ref = 'items[' + i + ']' + (it && it.id ? ' (' + it.id + ')' : '');
          var before = errors.length;
          validateItem(it, ref, secIds, seen, errors, DELTA_STATUSES, DELTA_STATUS_HINT);
          if (errors.length !== before) return;
          if (Object.prototype.hasOwnProperty.call(existingIds, it.id)) { skipped++; return; }
          toAdd.push(it);
        });
      }
    }

    var intelMap = null;
    if (delta.intel !== undefined && delta.intel !== null) {
      if (typeof delta.intel !== 'object' || Array.isArray(delta.intel)) {
        errors.push('intel must be an object keyed by item id');
      } else {
        intelMap = delta.intel;
        Object.keys(intelMap).forEach(function (id) {
          validateIntel(intelMap[id], 'intel["' + id + '"]:', errors);
        });
      }
    }

    var ratingsMap = null;
    if (delta.ratings !== undefined && delta.ratings !== null) {
      if (typeof delta.ratings !== 'object' || Array.isArray(delta.ratings)) {
        errors.push('ratings must be an object keyed by item id');
      } else {
        ratingsMap = delta.ratings;
        Object.keys(ratingsMap).forEach(function (id) {
          validateRating(ratingsMap[id], 'ratings["' + id + '"]:', errors);
        });
      }
    }

    if (errors.length) return { data: null, summary: emptyDeltaSummary(), errors: errors };

    var summary = emptyDeltaSummary();
    summary.skipped = skipped;
    var out = deepClone(cityData);
    if (!Array.isArray(out.sections)) out.sections = [];
    if (!Array.isArray(out.items)) out.items = [];

    // Same prototype-safe pair as existingIds above: a section id of
    // "constructor" would otherwise read as already present.
    var haveSec = Object.create(null);
    out.sections.forEach(function (s) { if (s && s.id) haveSec[s.id] = 1; });
    newSections.forEach(function (s) {
      if (Object.prototype.hasOwnProperty.call(haveSec, s.id)) return;
      haveSec[s.id] = 1;
      out.sections.push(deepClone(s));
      summary.sectionsAdded++;
    });

    toAdd.forEach(function (it) {
      var copy = deepClone(it);
      // Both fields belong to a later verification phase, never to a prompt.
      // An absent one is normalized to null so every item in the merged guide
      // has the same shape.
      if (copy.place_id === undefined) copy.place_id = null;
      if (copy.verified === undefined) copy.verified = null;
      out.items.push(copy);
      summary.added++;
    });

    // One id map for both passes. Object.create(null) plus an own-property
    // check is what closes the prototype-pollution vector a hostile delta
    // keyed "__proto__" would otherwise open (it would paint content onto
    // every card); the ratings map is held to the identical bar.
    if (intelMap || ratingsMap) {
      var byId = Object.create(null);
      out.items.forEach(function (it) { if (it && it.id) byId[it.id] = it; });
      if (intelMap) {
        Object.keys(intelMap).forEach(function (id) {
          if (!Object.prototype.hasOwnProperty.call(byId, id)) { summary.intelSkipped++; return; }
          byId[id].intel = deepClone(intelMap[id]);
          summary.intelApplied++;
        });
      }
      if (ratingsMap) {
        Object.keys(ratingsMap).forEach(function (id) {
          if (!Object.prototype.hasOwnProperty.call(byId, id)) { summary.ratingsSkipped++; return; }
          byId[id].rating = deepClone(ratingsMap[id]);
          summary.ratingsApplied++;
        });
      }
    }

    return { data: out, summary: summary, errors: [] };
  }

  // ---- Add one place by hand ----
  // Owner scenario, Aug 2026: "i was at dinner my first night, met a couple,
  // they highly recommended a restaurant, and i'd like to run it into the
  // system for consideration and comparison to our other options."
  //
  // Deliberately NOT a second way to write an item. This builds a one-item
  // DELTA in exactly the shape an AI pass returns, and the caller hands it to
  // mergeDelta like any other. So a hand-typed place goes through the same
  // validateItem, the same duplicate-id rule, the same prototype-safe merge
  // and the same plan/backup-only status restriction as everything else, and
  // there is still exactly one function in this file that adds an item to a
  // guide.
  //
  // The id is slugged from the name and suffixed until it is free, because a
  // human typing "Oda" twice means two restaurants far more often than it
  // means a mistake, and mergeDelta would silently SKIP the second one as an
  // existing id. A name that slugs to nothing at all (an all-Cyrillic or
  // all-Greek name, which this route through the Balkans will produce) falls
  // back to "place", which is ugly and unique, and the traveler never sees an
  // id anyway.
  var PLACE_ID_FALLBACK = 'place';

  // Telling a MAP link from a plain website, for the icon the card draws.
  // Matching on the HOST (with a leading-dot boundary) rather than anywhere in
  // the string is what stops "evil.example/?x=google.com/maps" being filed as
  // a map. Two shapes, because Google's share sheet hands out both: a host
  // that is a map and nothing else, and a host that is a map only on its map
  // PATH.
  var MAP_ONLY_HOST_RE = /^(maps\.[a-z0-9.-]+|maps\.app\.goo\.gl)$/;
  var MAP_PATH_HOST_RE = /(^|\.)(google\.[a-z.]+|goo\.gl|openstreetmap\.org|osm\.org|apple\.com)$/;
  var MAP_PATH_RE = /^\/(maps|place|local)(\/|\?|$)/;

  // 'map' | 'web' | null. null means "not something a browser can open as a
  // web page", which is the only case the Add-a-place form rejects: a tel: or
  // a bare "pizzarte" would both be accepted by safeHref (one is a real
  // scheme, the other is a relative URL) and neither is a research link.
  function researchLinkKind(raw) {
    var s = trimStr(raw);
    if (!s) return null;
    if (!safeHref(s)) return null;
    var probe = s.replace(/[\u0000-\u0020]/g, '');
    if (!/^https?:\/\//i.test(probe)) return null;
    var rest = probe.replace(/^https?:\/\//i, '');
    var cut = rest.search(/[\/?#]/);
    var host = (cut === -1 ? rest : rest.slice(0, cut)).toLowerCase();
    var path = cut === -1 ? '/' : rest.slice(cut);
    var at = host.lastIndexOf('@');        // strip any userinfo before the host
    if (at !== -1) host = host.slice(at + 1);
    var port = host.indexOf(':');
    if (port !== -1) host = host.slice(0, port);
    if (!host) return null;
    if (MAP_ONLY_HOST_RE.test(host)) return 'map';
    if (MAP_PATH_HOST_RE.test(host) && MAP_PATH_RE.test(path)) return 'map';
    return 'web';
  }

  function freePlaceId(cityData, name) {
    var taken = Object.create(null);
    (cityData && Array.isArray(cityData.items) ? cityData.items : []).forEach(function (it) {
      if (it && it.id) taken[it.id] = 1;
    });
    var base = slug(name) || PLACE_ID_FALLBACK;
    function free(id) { return !Object.prototype.hasOwnProperty.call(taken, id); }
    if (free(base)) return base;
    // Unbounded rather than capped at a few hundred. A capped loop needs a
    // fallback, the obvious fallback is a timestamp, and two adds inside one
    // millisecond would then produce the same id and mergeDelta would SKIP
    // the second one silently, which is precisely the failure this function
    // exists to prevent. Counting up cannot collide, and the loop is bounded
    // in practice by the number of items already in the guide.
    for (var n = 2; ; n++) {
      var cand = base + '-' + n;
      if (free(cand)) return cand;
    }
  }

  // Returns {delta, id, errors}. errors is the caller-facing list for the
  // things a FORM can get wrong (no name, no section, a section this city
  // does not have); everything else is left to mergeDelta, which is the one
  // that actually decides. delta is null whenever errors is non-empty.
  //
  // `note` is where the recommendation itself lands ("recommended by a couple
  // at dinner"), and it is also what the single-place research pass quotes
  // back to the AI, which is why it is plain free text and not a tag.
  function newPlaceDelta(cityData, fields) {
    var f = fields || {};
    var errors = [];
    var name = trimStr(f.name);
    var section = trimStr(f.section);
    var status = trimStr(f.status) || 'plan';
    var note = trimStr(f.note);
    var day = trimStr(f.day);
    // Optional research link (owner ask 2026-08-27: the single-place pass
    // "couldn't find info on Pizzarté"). A small independent restaurant with
    // no web presence is unsearchable by name; a Google Maps pin or the
    // place's own site is the one thing that makes it findable. It is stored
    // as a real links[] entry so the card renders it like any other link, and
    // it is quoted to Claude as a research hint (see buildPlacePassPrompt).
    var link = trimStr(f.link);
    var linkKind = link ? researchLinkKind(link) : null;
    if (link && !linkKind) {
      errors.push('That link is not a web address CityOps can open. Paste a link starting with http:// or https://.');
    }
    if (!name) errors.push('A name is required.');
    var secIds = Object.create(null);
    (cityData && Array.isArray(cityData.sections) ? cityData.sections : []).forEach(function (s) {
      if (s && s.id) secIds[s.id] = 1;
    });
    if (!section) errors.push('Pick a section.');
    else if (!Object.prototype.hasOwnProperty.call(secIds, section)) {
      errors.push('This city has no section "' + section + '".');
    }
    if (DELTA_STATUSES.indexOf(status) === -1) {
      errors.push('A new place starts as plan or backup.');
    }
    if (day && !isIso(day)) errors.push('The day must be YYYY-MM-DD.');
    if (errors.length) return { delta: null, id: null, errors: errors };
    var id = freePlaceId(cityData, name);
    var item = { id: id, section: section, status: status, name: name, links: [] };
    if (linkKind) {
      // Labelled the way the guide's own generated links are, so the card's
      // link row reads the same whether the place came from Claude or from a
      // paste: an icon and a short word, not a raw URL.
      item.links.push({ kind: linkKind, label: linkKind === 'map' ? 'Map' : 'Website', href: link });
    }
    if (note) item.note = note;
    if (day) item.day = day;
    // Stamped so the card, the More sheet and the research prompt can all
    // tell a hand-typed place from a researched one without keeping a second
    // list somewhere. It is also the honest reason its card carries no rating
    // badge: nobody has looked it up yet.
    item.added_by = 'traveler';
    return { delta: { schema: 1, delta: true, items: [item] }, id: id, errors: [] };
  }

  // Icon-only controls (Phase 3, feature 5): `aria` is the accessible name and
  // title tooltip on every button; `label` is set ONLY on the destructive
  // Archive transition, where a visible text label stays alongside the icon
  // so a mistap is less likely. The `to` semantics are unchanged from the
  // original text-button version: only the presentation changed.
  var TRANSITIONS = {
    plan:     [{ to: 'done', icon: '✓', aria: 'Mark done' },
               { to: 'backup', icon: '↓', aria: 'Move to backup' },
               { to: 'archived', icon: '✕', aria: 'Archive', label: 'Archive' }],
    backup:   [{ to: 'plan', icon: '↑', aria: 'Promote to plan' },
               { to: 'archived', icon: '✕', aria: 'Archive', label: 'Archive' }],
    done:     [{ to: 'plan', icon: '↩', aria: 'Undo, back to plan' }],
    archived: [{ to: 'backup', icon: '↩', aria: 'Restore to backup' }]
  };

  // Phase 3: Today / Guide / Calendar. viewMode of null is a distinct sentinel
  // from any of the three named modes: it means "the traveler has never
  // explicitly chosen a view", which is what lets effectiveViewMode() pick
