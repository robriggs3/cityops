<script type="text/plain" id="prompt-template">
# CityOps generation prompt

This is the prompt Rob pastes into Claude, ChatGPT, or any capable AI engine
to generate a city guide. Fill in the header, paste the whole file (header
plus everything below it) into a fresh chat, and the response should be a
single JSON code block ready to drop into `template.html`'s `city-data`
block, or to save as `cities/<city>.json` and run through
`node tools/embed.js cities/<city>.json <city>.html`.

Copy this file per trip, fill in the header, delete this line, and go.

---

## Trip details

- **City:** [city name]
- **Country:** [country, ISO 2-letter code if you know it, e.g. GE, AM]
- **Dates:** [arrival date] to [departure date], ISO format (YYYY-MM-DD)
- **Accommodation:** [name of hotel/apartment/building], [full address]
- **Arrival transport:** [flight/train/etc, arrival time if known]
- **Departure transport:** [flight/train/etc, departure time if known]

## Traveler profile

Solo traveler. Works mornings, roughly until 14:00, so mornings are off
limits for anything besides coffee near the accommodation. Explores in the
afternoon. Dinner window is 19:00 to 21:00. Walks a lot rather than taking
short rides, but uses Bolt-class ride apps for anything too far to walk.
Avoids heavy food late at night. Plans one trip into the city center per
day, not more: pick the single best anchor for that day rather than
scattering multiple center trips across it.

[Add anything trip-specific here: dietary constraints, mobility notes,
known allergies, budget ceiling, anyone traveling along, anything else
that changes what "a good pick" means this time.]

If a "Traveler interests" block appears below this line, treat it as part of
the profile: it lists what this traveler seeks out, what to avoid, and any
notes that change what a good pick means. App users get that block filled in
automatically by Build my prompt; if you are editing this file by hand and
want the interests section, write the block yourself in the same shape.

---

## What I need

Research this city and return a single guide covering eight sections:
dinner, breakfast, lunch, coffee, coworking, activities, services, and
practical notes. Add a ninth section, interests, only when a Traveler
interests block appears in the header above.
Use real, current information: actual restaurants and cafes that exist
right now, with real review counts and ratings where you can find them,
not generic or made-up suggestions.

### Dinner

One plan pick per evening of the stay, each assigned to a specific ISO
date within the stay range. Match the pick to what that day's activity
plan likely is (a beach day suggests something different from an Old Town
walking day). Add 5 to 8 backup picks across the whole stay, not tied to a
specific date, covering a spread of cuisines and price points in case a
plan pick is closed, full, or wrong on the day.

### Breakfast

2 to 3 plan picks plus a few backups. Opening time is the deciding factor:
the traveler starts work in the morning, so a breakfast place that opens
at 10:00 is a backup at best. Favor what actually opens 07:00 to 08:30
(local breakfast spots, bakeries, early brunch), near the accommodation or
on the work-morning route. State the opening time prominently in the note.
No day assignments; breakfast repeats daily.

### Lunch

3 to 4 plan picks plus 3 to 5 backups. The realistic use is a late lunch
around 14:00 to 15:00 when the work morning ends, either near the
accommodation, in the center, or on the way to that day's activity. Favor
light-to-medium local options over heavy sit-down meals (the big meal is
dinner); include at least one near-accommodation option and one center
option, plus a market or street-food option if the city has a real one.
No day assignments.

### Coffee

2 to 3 specialty coffee picks (good espresso, not just "has coffee"), plus
a few backups. These are for the workday, so weight toward places near the
accommodation or on the routine commute, with reliable hours in the
morning. If a coffee pick doubles as the breakfast answer, say so in both
sections rather than duplicating the item.

### Coworking

The best bookable coworking space (day pass or drop-in), the option
nearest to the accommodation even if it's not the best space, and a few
backups. Note weekend hours explicitly: many coworking spaces have
reduced or closed weekend hours, and a workday plan that assumes normal
hours on a Saturday will fail.

### Activities

One anchor activity per full day of the stay (the single center trip for
that day), plus a list of free/anytime options that don't need a
specific day (a park, a viewpoint, a walk), plus backups. Flag each
activity as daytime-only or evening-suited, since the traveler profile
above only frees up afternoons and evenings.

### Services

Laundry, massage or grooming, and a 24-hour or late grocery option near
the accommodation. These don't need day assignments.

### Practical

Not individual place picks: a short set of notes covering the daily
rhythm this city rewards, cash-vs-card norms, any scam or overcharging
pattern that shows up repeatedly in reviews (tourist-price menus, meter
tricks, "the card machine is broken" cash-only pushes), which ride/transit
apps actually work here, and any beach, terrain, or walkability notes
worth knowing before the first day.

### Interests

Include this section ONLY if a "Traveler interests" block appears in the
header above. If there is no such block, skip this section entirely and
return the eight sections listed above.

When the block is present, add a ninth section with `"id": "interests"`,
`"label": "My interests"`, `"icon": "⭐"`, and fill it with 3 to 6 plan picks
plus 3 to 5 backups that match the listed interests, weighted toward the ones
listed first (the order is the traveler's priority order). Rules:

- Real, specific places or events only, same standard as every other
  section: a named climbing gym, a named jazz venue with the night it
  actually has live music, not "the city has a climbing scene".
- Never suggest anything that matches the Avoid list, and apply the Notes
  the same way you apply the traveler profile.
- No `day` assignments unless the pick only happens on a specific date
  (a weekly jam night, a match, a market day). Then use the ISO date inside
  the stay range and say why in `when`.
- If an interest simply does not exist in this city, say so plainly in a
  practical note ("no bouldering gym in the city; nearest is 90 minutes
  away in X") rather than forcing a weak pick to fill the slot. A short,
  honest section beats a padded one.
- Do not duplicate a place that already appears in another section. If the
  best match for an interest is already the coffee or dinner pick, say so
  in that item's note instead of listing it twice.

## Quality rules

These are lessons from a prior guide (Batumi) that produced bad or
unusable links and missed real risks. Follow them exactly.

- **Real Maps links only.** Every place needs a real Google Maps link.
  Prefer the `?cid=` permalink form when you can find or construct it
  (`https://maps.google.com/?cid=<id>`) since it points at the exact
  listing rather than a search. If you cannot get a `cid` link, a normal
  Google Maps search/place URL is acceptable, but never fabricate one.
- **Never invent URLs.** If you are not confident a URL is real, do not
  include it. This applies to maps links, websites, and phone numbers
  alike: a wrong link is worse than a missing one.
- **No website is normal.** Plenty of good, real places (especially small
  restaurants and services) have no website. When that's the case, do not
  leave the place without a way to contact it: use a `tel:` link with the
  real phone number instead. A missing website is not a signal of low
  quality and should not push a place out of consideration.
- **Flag early closers.** Any place that closes before 22:00 needs that
  called out (in `hours.text` and by not marking it `late` in
  `hours.class`), so a dinner plan doesn't quietly assume a place is
  still open for a late seating when it isn't.
- **Flag weekend crowding.** If reviews or listed hours suggest a place
  gets noticeably busier or behaves differently on weekends, say so in
  the note.
- **Mark book-ahead places.** If reservations are recommended or required
  (busy, small, high-rated), add a `"Book ahead"` tag.
- **Prices in both currencies.** Every price should read in local
  currency and USD, e.g. `"~80-120 GEL / $30-44"`. Use a reasonable
  current exchange rate; don't need to cite a source for it.
- **Surface review-verified scam or overcharge patterns.** If reviews
  repeatedly describe a specific overcharging or scam pattern (fake bill
  padding, no-menu-price tourist upsell, meter manipulation), note it,
  either on the specific place or in the Practical section if it's a
  citywide pattern. Don't invent a risk that isn't backed by what you
  found; don't soften one that reviews clearly support.
- **Ratings go in the `rating` field, never buried in the note.** A rating
  with a real review count is useful signal, and the app renders it as a
  badge on the card, so emit it as structured data:
  `"rating": {"stars": 4.8, "count": 5545, "source": "Google Maps, Aug
  2026"}`. Do not also write "4.8 stars, 5,545 reviews" into `note`; the
  note is for what the number does not say. Don't round up, don't guess a
  count, and omit `rating` entirely for a place you could not look up.

### Intel

`intel` is the optional block that tells the traveler what to actually order
or do once they are there. It is worth more than another paragraph of
description, and it is worth nothing at all if it is invented. Rules:

<!-- RULES:INTEL -->
- **Restaurants and cafes:** name 2 to 4 specific dishes or drinks with a
  `must`, `good`, or `skip` verdict. Only include a dish that multiple
  reviewers name specifically. One person's favourite is not a verdict, and
  "the food is great" is not a dish. A `skip` needs the same support: say
  what is wrong with it in the same short line ("seafood platter: frozen,
  priced for tourists").
- **Activities and services:** 1 to 3 verdicts on the specifics that change
  the visit (which route, wing, seat, entrance, add-on, or time of day is
  the one worth having, and which is the one people regret), plus 1 to 3
  tips: queue timing, cash-only, where the real entrance is, what to book.
- **Always a source line.** One line naming where the intel came from and
  roughly when, e.g. `"Aggregated from Google and TripAdvisor reviews,
  mid-2026"`. Unverifiable intel is then visibly labeled as such.
- **Omit `intel` entirely rather than pad it.** An item with nothing
  review-verified to say gets no `intel` field at all. A thin, invented or
  generic intel block is worse than none: the traveler acts on these.
<!-- /RULES:INTEL -->

## Output contract

Respond with **a single ```json fenced code block, and nothing else**. No
prose before or after it, no explanation, no markdown headers, no second code
block, nothing outside the fence. The JSON must be valid against schema v1
(below) with these rules:

- Top level `"schema": 1`.
- `city.dates.from` and `city.dates.to` match the trip dates given above.
- `sections` covers the eight sections above, in this order: `dinner`,
  `breakfast`, `lunch`, `coffee`, `cowork`, `activities`, `services`,
  `practical`. Use exactly these `id` values so the guide renders
  correctly. Breakfast and lunch items never carry a `day` field; they
  repeat daily. When a Traveler interests block is present, `interests` is
  the ninth and last section, so the full order is `dinner`, `breakfast`,
  `lunch`, `coffee`, `cowork`, `activities`, `services`, `practical`,
  `interests`.

<!-- CONTRACT:ITEM -->
- Every item has `"place_id": null` and `"verified": null`. Those fields
  are filled by a later phase, never by this prompt.
- `status` on every generated item is either `"plan"` or `"backup"` only.
  Never emit `"done"` or `"archived"`: those are states the traveler sets
  later, in the app.
- `day`, when present, is an ISO date (`YYYY-MM-DD`) that falls inside the
  stay range (`city.dates.from` to `city.dates.to` inclusive). Backups and
  anytime items omit `day` entirely rather than guessing one.
- `hours.class`, when present, is one of:
  - `"late"`: open past 22:00.
  - `"day"`: daytime only (closes at or before roughly 18:00, or is
    otherwise not suited to an evening visit).
  - `"eve"`: evening-suited but not necessarily late (a dinner spot that
    closes at 22:00, for example).
- `intel` is optional on any item. When present it is an object with any of
  `verdicts`, `tips`, and `source`, and nothing else:
  - `verdicts`: array of `{"tier": "must" | "good" | "skip", "text": "..."}`,
    text non-empty and naming the specific dish, route, seat or add-on.
  - `tips`: array of short non-empty strings.
  - `source`: one line of provenance.
  Include `intel` only where reviews support it; omit otherwise.
- `rating` is optional on any item and is the ONLY place a rating belongs
  (never prose in `note`). When present it is an object with any of:
  - `stars`: required, a number from 0 to 5, one decimal (`4.8`).
  - `count`: the review count as a whole number, no separators (`5545`).
    Omit it rather than guess or round one.
  - `source`: where the number came from and roughly when
    (`"Google Maps, Aug 2026"`).
  - `checked`: the date you looked it up, `YYYY-MM-DD`.
  Omit `rating` entirely for a place whose rating you could not verify.
- Every item's `section` matches one of the section ids you defined.
- Every item has a unique `id` (a short slug, e.g. `"brasserie"`), a
  `name`, and a `links` array. Place items must have at least a `map`
  link. Practical-section note items may have an empty array.
- **One item is one thing the traveler does.** Never emit a per-day
  summary item that packs a whole day into one note (`"name": "Mon
  2026-08-24"`, `"note": "AM: coworking day pass · PM: pedicure · barber
  · Eve: dinner at Era"`). The app plans by moving individual items
  between days, so a packed day is one immovable block: rescheduling the
  barber means retyping a sentence, and everything else in that sentence
  moves with it. Split it instead:
  - Each stop that is a place gets its own item in its own section
    (dinner, coffee, activities, services) carrying the `day`. Reference
    a place from at most one item; never repeat a place as both a venue
    item and a plan entry.
  - Each stop that is not a place (a work block, a laundry load, a cash
    withdrawal, a market run, packing) gets its own small item with its
    own `day`, in whichever section fits, or `practical` if none does.
  - Use `when` for the slot inside the day (`"AM"`, `"PM, arrive 18:00
    sharp"`), which is what the AM/PM/Eve prefixes were doing.

### Schema v1 shape reference

This is the schema example, taken directly from the CityOps design spec
(`docs/superpowers/specs/2026-08-10-cityops-phase1-design.md`, section
"Schema (v1)"). It shows the exact shape to produce, not literal content
to copy.

```json
{
  "schema": 1,
  "city": {
    "name": "Batumi", "country": "GE",
    "dates": {"from": "2026-08-08", "to": "2026-08-15"},
    "accommodation": {"name": "Example Stay D2", "lat": 41.64, "lng": 41.61},
    "currency": {"code": "GEL", "usd": 0.37},
    "notes": ["Bolt works well", "~2.2km south of Old Town"]
  },
  "sections": [
    {"id": "dinner", "label": "Dinner", "icon": "🍽️"}
  ],
  "items": [{
    "id": "brasserie",
    "section": "dinner",
    "status": "plan",
    "day": "2026-08-13",
    "when": "Old Town office day",
    "name": "Brasserie 1900",
    "price": {"text": "~80-120 GEL / $30-44"},
    "note": "The room everyone books for a last night; reserve.",
    "rating": {"stars": 4.8, "count": 1216, "source": "Google Maps, Aug 2026"},
    "hours": {"text": "12:00-23:00 daily", "class": "late"},
    "tags": ["Book ahead"],
    "links": [
      {"kind": "map", "label": "Open in Maps", "href": "https://maps.google.com/?cid=..."},
      {"kind": "web", "label": "brasserie1900.ge", "href": "https://brasserie1900.ge"},
      {"kind": "tel", "label": "Book", "href": "tel:+995511222252"}
    ],
    "place_id": null,
    "verified": null
  }]
}
```

Field notes:

- `sections[]` needs one entry per section actually used, each with `id`,
  `label`, and an `icon` emoji.
- `city.notes` is a short list of chip-worthy facts (ride app that works,
  distance from center, cash vs card norm) surfaced in the guide header.
- `when` is optional, free text tying an item to the day's plan (what it
  follows or precedes, or the slot inside the day: `"AM"`, `"Eve, reserve
  in advance"`). Use it for dinner plan picks and for anything whose
  position inside a day matters.
- `price` is optional but should be included whenever you have real
  price information, in the `text` field, in the local-currency-plus-USD
  format described above.
- `tags` is an array of short strings; use it for `"Book ahead"` and
  similar flags, empty array if none apply.
- `links[].kind` is `map`, `web`, or `tel`; use `tel` for phone-only
  contact links per the no-invented-URLs rule above.
- `city.accommodation.lat`/`lng` should be your best estimate for the
  accommodation address given above, not left at 0. Approximate from the
  address is fine; this doesn't need to be survey-precise.
- `rating`, when you have it, sits alongside `note` on the item and is
  where every rating belongs: `stars` (0-5), optional `count`, optional
  `source`, optional `checked` date. The app shows it as a badge on the
  card, so a rating written into the note instead is a rating the traveler
  cannot see at a glance.
- `intel`, when you have it, sits alongside `note` on the item:

```json

  "verdicts": [
    {"tier": "must", "text": "Adjarian khachapuri, the boat with the egg"},
    {"tier": "good", "text": "Pkhali plate to share"},

      prow.appendChild(nameWrap);
      prow.appendChild(el('span', 'cdates', CityOps.fmtRange(cityDatesFor(id))));
      prow.onclick = function () {
        panelOpen = false;
        // activateCity triggers a real engine render, which calls
        // decorateHeader() via onStateChange and updates aria-expanded there;
        // only the same-city no-op path needs to refresh it itself.
        if (id === activeId) { updateHeaderExpanded(); renderPanel(); return; }
        activateCity(id);
      };
      prow.appendChild(archiveBtn(id, isCurrent));
      return prow;
    }

    // Removal stays where it was (the More sheet, behind a typed confirm).
    // This control is the reversible one: one tap out, one tap back, and it
    // says which of the two it is doing rather than reading "archive" on a
    // city that is already in the Past group.
    function archiveBtn(id, isCurrent) {
      var past = cityIsPastNow(id, isCurrent);
      var b = el('button', 'city-arch', past ? '↩' : '🗄');
      b.type = 'button';
      var aria = past ? 'Restore this city to the active list'
        : 'Move this city to Past';
      b.setAttribute('aria-label', aria);
      b.title = aria;
      b.onclick = function (e) {
        e.stopPropagation();
        setCityArchived(id, CityOps.archiveKit.nextValue(
          readStateFull(id) || CityOps.emptyState(), cityDatesFor(id), today, isCurrent));
        renderPanel();
      };
      return b;
    }

    var live = [], past = [];
    store.order.forEach(function (id) {
      // Feature 3: the example city never appears in the switcher once a real
      // city exists, unless the traveler turned "Show example city" on.
      if (id === SEED_ID && !exVisible) return;
      (cityIsPastNow(id, id === activeId) ? past : live).push(id);
    });
    live.forEach(function (id) { panel.appendChild(cityRow(id)); });
    if (past.length) {
      // <details> rather than a button and a class, so the browser owns the
      // open/closed state and the keyboard already works. Collapsed on every
      // open, deliberately: a past city is history, and the point of the
      // group is that it is out of the way until you want it.
      var det = el('details', 'citypast');
      var sum = document.createElement('summary');
      sum.appendChild(el('span', 'chev', '▸'));
      sum.appendChild(document.createTextNode('Past (' + past.length + ')'));
      det.appendChild(sum);
      det.ontoggle = function () {
        var c = sum.querySelector('.chev');
        if (c) c.textContent = det.open ? '▾' : '▸';
      };
      past.forEach(function (id) { det.appendChild(cityRow(id)); });
      panel.appendChild(det);
    }
    var acts = el('div', 'cityact');
    var add = el('button', 'cityadd', '+ Add city');
    add.type = 'button';
    add.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); openAddModal(); };
    acts.appendChild(add);
    // Phase 4, item 7: Remove city moved to the More action sheet (nav
    // cleanup groups every utility action in one place); no row for it here
    // anymore.
    if (!exVisible) {
      var exb = el('button', null, 'Load example');
      exb.type = 'button';
      exb.onclick = function () { panelOpen = false; updateHeaderExpanded(); renderPanel(); loadExampleCity(); };
      acts.appendChild(exb);
    }
    // Feature 7: Profile moved to a top-level header chip (decorateHeader
    // below), since it is one profile for every city, not a per-city setting.
    // Sync moved there too (2026-08-25, Rob): signing in is an ACCOUNT action,
    // not a city action, and burying the signed-out state one tap inside a
    // city menu is how a dropped session went unnoticed. Profile now owns it,
    // and #syncalert says so on the page when sync stops.
    panel.appendChild(acts);
    bar.appendChild(panel);

    if (!docClickBound) {
      // Deferred: adding the listener synchronously would let it observe the
      // very click (bubbling to document) that just opened the panel.
      setTimeout(function () { document.addEventListener('click', onOutsideClick, true); }, 0);
      docClickBound = true;
    }
  }

  // Just refreshes the aria-expanded flag on the current h1 in place. Toggling
  // the panel does not itself trigger an engine render, so this must NOT go
  // through decorateHeader() below (that appends the chevron/chip afresh and
  // would duplicate them on an h1 the engine hasn't wiped since last time).
  function updateHeaderExpanded() {
    var h1 = document.querySelector('#hdr h1');
    if (h1) h1.setAttribute('aria-expanded', String(panelOpen));
    var chev = document.querySelector('#hdr .hdr-chev');
    if (chev) chev.textContent = panelOpen ? ' ▴' : ' ▾';
  }

  // Re-decorates the freshly rendered #hdr (the engine wipes it with
  // innerHTML='' on every render): appends the chevron to h1 and wires it as
  // the switcher trigger, and appends the header's + Add chip. Called once
  // per engine render via CityOps.onStateChange: never from a plain
  // open/close toggle, which would duplicate these onto the still-live h1.
  function decorateHeader() {
    var h = document.getElementById('hdr');
    if (!h) return;
    var h1 = h.querySelector('h1');
    if (!h1) return;
    h1.setAttribute('role', 'button');
    h1.setAttribute('tabindex', '0');
    h1.setAttribute('aria-expanded', String(panelOpen));
    // Idempotent: this used to run exactly once per engine render (which wipes
    // the h1 first), and it now also runs when the sync alert changes, which
    // does not. Appending unconditionally gave the city two chevrons.
    var oldChev = h1.querySelector('.hdr-chev');
    if (oldChev) oldChev.remove();
    h1.appendChild(el('span', 'hdr-chev', panelOpen ? ' ▴' : ' ▾'));
    h1.onclick = function () {
      panelOpen = !panelOpen;
      updateHeaderExpanded();
      renderPanel();
    };
    h1.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); h1.click(); }
    };
    // The shared header's own action slot. It survives an engine render (the
    // engine only wipes #hdr-mid now), but this function still rebuilds the
    // chips each time so their labels and sync state stay current.
    var actions = document.getElementById('hdr-acts');
    if (!actions) return;
    actions.innerHTML = '';
    // The crossing between surfaces is the Cities|Trip switch in the shared
    // bar, not a chip: see markSurface() below. What is left here is what is
    // genuinely app-level rather than surface-level.
    actions.appendChild(syncChip());
    // Feature 7: Profile is app-level (one interest profile, one Claude key
    // for every city), so it is a top-level header control, not a row inside
    // the per-city switcher menu.
    var profileBtn = el('button', 'hdr-chip', 'Profile');
    profileBtn.type = 'button';
    profileBtn.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openProfileModal();
    };
    actions.appendChild(profileBtn);
    var add = el('button', 'hdr-chip', '+ Add city');
    add.type = 'button';
    add.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openAddModal();
    };
    actions.appendChild(add);
  }

  // Which surface you are on, said in the shared switch. aria-current is the
  // fact and the CSS follows it, so there is no second "active" class that
  // could point somewhere else. The peer link stays a real <a> (middle-click,
  // open in a new tab, a visible target in the status bar all matter for a
  // crossing between two halves of one app).
  function markSurface() {
    var me = document.getElementById('surf-cities');
    var other = document.getElementById('surf-trip');
    if (!me || !other) return;
    me.setAttribute('aria-current', 'page');
    me.removeAttribute('href');
    me.title = 'You are here: the city guides';
    other.title = 'Your trip: stops, stays and travel legs';
  }

  // The sync-status chip, in the shared header on BOTH surfaces (the trip side
  // has had one since 2026-08-26; the guide side kept its sync state inside
  // the Profile modal, so a stopped sync was one tap out of sight). Same
  // vocabulary either side: plain when signed out on purpose, green when the
  // account has this device's work, amber when sync has stopped.
  function syncChip() {
    var b = el('button', 'hdr-chip', 'Local only');
    b.type = 'button';
    if (!syncOn()) {
      b.disabled = true;
      b.title = 'Sync is not configured in this build.';
      return b;
    }
    if (!session) {
      b.title = 'Tap to sign in and carry your cities to your other devices.';
    } else if (readSyncAlert()) {
      b.textContent = 'Sync stuck';
      b.className = 'hdr-chip warn';
      b.title = 'Sync has stopped. Nothing is lost; open Profile for what to do.';
    } else {
      b.textContent = 'Synced';
      b.className = 'hdr-chip ok';
      b.title = lastSyncIso
        ? 'Last synced ' + new Date(lastSyncIso).toLocaleString()
        : 'Signed in. Your cities carry across your devices.';
    }
    b.onclick = function (e) {
      e.stopPropagation();
      panelOpen = false;
      updateHeaderExpanded();
      renderPanel();
      openProfileModal();
    };
    return b;
  }

  // ---- interest profile (app-only data; the engine owns its shape) ----
  // A chip list: Enter adds, each chip's x removes. get() also returns whatever
  // is still sitting unentered in the input, so a typed interest is never
  // silently dropped by pressing Save instead of Enter.
  function chipField(box, label, values, placeholder) {
    box.appendChild(el('p', 'diff', label));
    var items = values.slice();
    var list = el('div', 'chip-list');
    box.appendChild(list);
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'chip-add';
    inp.placeholder = placeholder;
    inp.setAttribute('aria-label', label);
    box.appendChild(inp);

    function draw() {
      list.innerHTML = '';
      items.forEach(function (v, i) {
        var chip = el('span', 'chipx');
        chip.appendChild(document.createTextNode(v));
        var x = el('button', null, '×');
        x.type = 'button';
        x.setAttribute('aria-label', 'Remove ' + v);
        x.onclick = function () { items.splice(i, 1); draw(); };
        chip.appendChild(x);
        list.appendChild(chip);
      });
    }
    function add() {
      var v = trim(inp.value);
      inp.value = '';
      if (!v) return;
      items.push(v);
      // normalize does the trimming, case-insensitive dedupe and the cap, so
      // the chips on screen are exactly what a Save would store.
      items = CityOps.profile.normalize({ interests: items }).interests;
      draw();
    }
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); add(); }
    };
    draw();
    return { get: function () { return items.concat(trim(inp.value) ? [trim(inp.value)] : []); } };
  }

  // One row per planning factor: its label and a level <select> on the fixed
  // five-point scale, plus a remove button. A trailing row adds a custom
  // factor at 'medium' (the neutral default: a fresh factor should not read
  // as already a blocker or already dismissed). Levels are always one of
  // CityOps.profile.FACTOR_LEVELS by construction (a <select> of exactly
  // those options), so nothing here can produce an invalid level; normalize
  // still runs on Save for the label trim/dedupe/cap every other list gets.
  function factorsField(box, factors) {
    box.appendChild(el('p', 'diff', 'Planning factors: how much each should shape picks. ' +
      'Blocker means never suggest something weak here, even as a backup. ' +
      'Not important means ignore this dimension entirely.'));
    var list = el('div', 'factor-list');
    box.appendChild(list);
    var items = factors.map(function (f) { return { label: f.label, level: f.level }; });

    function levelSelect(current, label) {
      var sel = document.createElement('select');
      sel.className = 'date-field factor-level';
      sel.setAttribute('aria-label', label + ' importance');
      CityOps.profile.FACTOR_LEVELS.forEach(function (lvl) {
        var opt = document.createElement('option');
        opt.value = lvl;
        opt.textContent = lvl;
        if (lvl === current) opt.selected = true;
        sel.appendChild(opt);
      });
      return sel;
    }

    function draw() {
      list.innerHTML = '';
      items.forEach(function (f, i) {
        var row = el('div', 'factor-row');
        row.appendChild(el('span', 'factor-label', f.label));
        var sel = levelSelect(f.level, f.label);
        sel.onchange = function () { items[i].level = sel.value; };
        row.appendChild(sel);
        var x = el('button', null, '×');
        x.type = 'button';
        x.setAttribute('aria-label', 'Remove ' + f.label);
        x.onclick = function () { items.splice(i, 1); draw(); };
        row.appendChild(x);
        list.appendChild(row);
      });
    }
    draw();

    var addRow = el('div', 'mrow');
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'chip-add';
    inp.placeholder = 'Add a custom factor';
    inp.setAttribute('aria-label', 'Custom factor name');
    var addBtn = el('button', 'ctl', 'Add');
    addBtn.type = 'button';
    function addCustom() {
      var v = trim(inp.value);
      inp.value = '';
      if (!v) return;
      items.push({ label: v, level: 'medium' });
      draw();
    }
    addBtn.onclick = addCustom;
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); addCustom(); } };
    addRow.appendChild(inp);
    addRow.appendChild(addBtn);
    box.appendChild(addRow);

    return { get: function () { return items; } };
  }

  // The account block, at the TOP of Profile (2026-08-25, Rob). Sync used to
  // live one tap inside the city switcher, where "signed out" was invisible;
  // a session that gets dropped stops syncing silently, and the traveler sees
  // stale data with no warning. Here the state is the first thing Profile
  // says, in the words that matter to the reader: is my work reaching my
  // other devices or not.
  function accountBlock(box) {
    box.appendChild(el('p', 'section-lead', 'Account'));
    if (!syncOn()) {
      box.appendChild(el('p', 'diff', 'Sync is not configured in this build. ' +
        'Everything you do is saved in this browser only.'));
      return;
    }
    var signedIn = !!(session && session.access_token);
    var line = el('p', signedIn ? 'diff' : 'diff acct-off',
      signedIn
        ? ('Sync is on. Signed in as ' + (syncEmail || 'your account') + '.')
        : 'Sync is off: you are not signed in. Everything is saved on this device only, ' +
          'and nothing here reaches your other devices.');
    box.appendChild(line);
    var when = el('p', 'diff', lastSyncLine());
    box.appendChild(when);

    var row = el('div', 'mrow');
    if (!signedIn) {
      var inb = el('button', 'ctl to-done', 'Sign in to sync');
      inb.type = 'button';
      inb.onclick = function () { closeModalOf(box); openSignInModal(); };
      row.appendChild(inb);
    } else {
      var now = el('button', 'ctl', 'Sync now');
      now.type = 'button';
      now.onclick = function () {
        now.disabled = true;
        now.textContent = 'Syncing...';
        pullAll(true).then(function (ok) {
          now.textContent = 'Sync now';
          now.disabled = false;
          when.textContent = ok ? lastSyncLine()
            : 'Could not reach the sync service. Your work is saved on this device.';
        });
      };
      var out = el('button', 'ctl to-archived', 'Sign out');
      out.type = 'button';
      out.onclick = function () {
        signOut();
        closeModalOf(box);
        showSyncNotice('Signed out. This device keeps everything it already has.');
      };
      row.appendChild(now);
      row.appendChild(out);
    }
    box.appendChild(row);
  }

  // Closes the modal that owns `box`. The account buttons live inside the
  // Profile modal but are built by a helper that has no handle on it.
  function closeModalOf(box) {
    var wrap = box.parentNode;
    if (wrap && wrap.remove) wrap.remove();
  }

  function openProfileModal() {
    var m = modalShell('Profile');
    accountBlock(m.box);
    m.box.appendChild(el('p', 'section-lead', 'Your interests'));
    m.box.appendChild(el('p', 'diff', 'What you seek out in a new city, and what you never want suggested. ' +
      'Build my prompt hands this to your own AI so it finds places that match you. ' +
      'Keep it short: 5 to 12 interests research better than 30.'));
    var p = CityOps.profile.normalize(store.profile);
    var interests = chipField(m.box, 'Interests, in priority order', p.interests, 'Add an interest, then press Enter');
    var avoid = chipField(m.box, 'Avoid: never suggest these', p.avoid, 'Add something to avoid, then press Enter');
    // Seed sensible defaults the first time this device has no factors at
    // all, so a first-time visitor sees a working starting set rather than a
    // blank list; nothing is written until Save.
    var startingFactors = p.factors.length ? p.factors : CityOps.profile.defaultFactors();
    var factors = factorsField(m.box, startingFactors);
    m.box.appendChild(el('p', 'diff', 'Notes: anything that changes what a good pick means (diet, mobility, budget, who is along).'));
    var ta = document.createElement('textarea');
    ta.className = 'notes';
    ta.value = p.notes;
    ta.setAttribute('aria-label', 'Profile notes');
    m.box.appendChild(ta);

    // Feature 3: the example-city visibility override.
    m.box.appendChild(el('p', 'diff', 'The bundled example city hides automatically once you add a real city. ' +
      'Turn this on to keep it visible anyway.'));
    var exRow = el('div', 'mrow');
    var exLabel = document.createElement('label');
    var exCheck = document.createElement('input');
    exCheck.type = 'checkbox';
    exCheck.checked = p.showExample;
    exLabel.appendChild(exCheck);
    exLabel.appendChild(document.createTextNode(' Show example city'));
    exRow.appendChild(exLabel);
    m.box.appendChild(exRow);

    m.box.appendChild(el('p', 'diff', (session && session.access_token)
      ? 'Saved to your account.'
      : 'Saved in this browser. Sign in above to carry your profile across devices.'));

    // The Claude API key. Saved immediately on blur, independent of the
    // profile Save button below, so leaving the modal by any path never loses
    // it. It keeps its own storage (never store.profile), and since
    // 2026-08-25 it also rides in the profile sync row so a cache clear no
    // longer means typing it again. It never enters a city, an export, a
    // prompt or any other sync row.
    m.box.appendChild(el('p', 'section-lead', 'Claude API key'));
    function keyStatusText() {
      var hasKey = !!loadApiKey();
      if (!hasKey) return 'No key saved yet.';
      return (session && session.access_token)
        ? 'Key saved and synced to your account.'
        : 'Key saved on this device. Sign in above to carry it to your other devices.';
    }
    m.box.appendChild(el('p', 'diff', 'Used only by "Generate with Claude" when adding or editing a city. ' +
      'It is sent to Anthropic\'s API directly from your device, and, while you are signed in, stored in ' +
      'your own account so a cleared browser does not lose it. It never travels with a city, an exported ' +
      'guide or a prompt.'));
    m.box.appendChild(el('p', 'diff', 'One profile and one key for all your cities.'));
    var keyRow = el('div', 'mrow');
    var keyInp = document.createElement('input');
    keyInp.type = 'password';
    keyInp.className = 'date-field key-field';
    keyInp.placeholder = 'sk-ant-...';
    keyInp.autocomplete = 'off';
    keyInp.value = loadApiKey();
    keyInp.setAttribute('aria-label', 'Claude API key');
    keyRow.appendChild(keyInp);
    var keyMsg = el('span', 'diff', keyStatusText());
    keyInp.onblur = function () {
      // Only a real change is a change: re-blurring an untouched field must
      // not stamp a new time and win a reconcile against a newer device.
      if (trim(keyInp.value) !== loadApiKey()) saveApiKey(trim(keyInp.value));
      keyMsg.textContent = keyStatusText();
    };
    var keyClear = el('button', 'ctl', 'Clear key');
    keyClear.type = 'button';
    keyClear.onclick = function () {
      keyInp.value = '';
      if (loadApiKey()) saveApiKey('');
      keyMsg.textContent = keyStatusText();
    };
    keyRow.appendChild(keyClear);
    m.box.appendChild(keyRow);
    m.box.appendChild(keyMsg);

    var row = el('div', 'mrow');
    var save = el('button', 'ctl to-done', 'Save');
    save.type = 'button';
    save.onclick = function () {
      var next = CityOps.profile.normalize({
        interests: interests.get(), avoid: avoid.get(), factors: factors.get(),
        notes: ta.value, showExample: exCheck.checked
      });
      // No-op save: compare against the profile as loaded, `updated` removed
      // from both sides, so a modal opened and closed unchanged never stamps
      // a new timestamp or schedules a push.
      var before = JSON.stringify(Object.assign({}, p, { updated: undefined }));
      var after = JSON.stringify(Object.assign({}, next, { updated: undefined }));
      if (before === after) { m.close(); return; }
      next.updated = new Date().toISOString();
      store.profile = next;
      saveStore(store);
      schedulePush('profile');
      m.close();
      // The example's visibility can change as a direct result of this save
      // (the toggle flipped, or factors/interests changed nothing there but
      // cost nothing to refresh): re-render so the switcher panel reflects it
      // immediately rather than on the next unrelated render.
      renderPanel();
      showSyncNotice('Profile saved.');
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(save);
    row.appendChild(cancel);
    if (!exampleVisible()) {
      var ex = el('button', 'ctl', 'Load example city');
      ex.type = 'button';
      ex.onclick = function () { m.close(); loadExampleCity(); };
      row.appendChild(ex);
    }
    m.box.appendChild(row);
  }

  // PROMPT.md, embedded by the assembler as a text/plain block so the prompt
  // builders work offline. Same escaping contract as the guide template: the
  // assembler writes `<\/script`, this reverses exactly one layer.
  function promptTemplateText() {
    var node = document.getElementById('prompt-template');
    if (!node) return null;
    var raw = node.textContent;
    if (raw.charAt(0) === '\n') raw = raw.slice(1);
    if (raw.charAt(raw.length - 1) === '\n') raw = raw.slice(0, -1);
    return raw.replace(/<\\\/script/g, '<' + '/script');
  }

  // ---- Enrich: re-run an existing city through the traveler's own AI ----
  // Two prompt builders and one paste box. No network and no AI call from the
  // app: the same zero-cost paste workflow Build my prompt uses.
  //
  // MERGE TARGET (the one decision worth spelling out): the delta is merged
  // into the EFFECTIVE data (the city's canonical store copy with any in-app
  // dataOverride applied), and the result is written back as the city's new
  // canonical data with the override cleared. That mirrors the Replace path in
  // Add city, and it is the only option that cannot lose work:
  //   - merging into the canonical copy alone would leave a stale override
  //     still masking it through effectiveData(), so the traveler would see no
  //     new items at all;
  //   - merging into the override alone would keep the additions out of the
  //     synced data row, so they would never reach another device.
  // Live planning state (done marks, renames, day arrangement) is keyed by item
  // id in a separate store that neither mergeDelta nor this function touches,
  // so it survives untouched by construction.
  // The ONE place in the app that writes a changed city record. Enrich's Apply
  // was the only caller when it was inline; adding a place by hand is the
  // second, and factoring it out is what stops the two drifting on the four
  // things that have to happen together (canonical write, override clear,
  // sync push, reboot). Returns the city id it wrote, which is not always
  // activeId: appStore.add re-derives the id from the city name and dates.
  function commitCityData(newData) {
    var added = CityOps.appStore.add(store, newData);   // stamps updatedAt now
    store = added.store;
    saveStore(store);
    // The override's content is part of the canonical data now, so clearing
    // it changes nothing on screen and stops it masking future merges.
    var cs = CityOps.makeStore(added.cityId, LS);
    var cst = cs.load();
    if (cst.dataOverride) { cst.dataOverride = null; cs.save(cst); }
    schedulePush('data', added.cityId);
    // Same scroll-preserve pattern as applyPull: activateCity reboots the
    // city (CityOps.boot), which re-renders from the top.
    var y = 0;
    try { y = window.scrollY || window.pageYOffset || 0; } catch (e) {}
    activateCity(added.cityId);   // reboots the city; rewrites #notice
    try { window.scrollTo(0, y); } catch (e2) {}
    return added.cityId;
  }

  function enrichSummaryText(s) {
    var parts = [];
    if (s.added) parts.push(s.added + ' added');
    if (s.skipped) parts.push(s.skipped + ' skipped');
    if (s.sectionsAdded) parts.push(s.sectionsAdded + (s.sectionsAdded === 1 ? ' section' : ' sections'));
    if (s.intelApplied) parts.push(s.intelApplied + ' intel applied');
    if (s.intelSkipped) parts.push(s.intelSkipped + ' intel skipped');
    // Applied counts a rating written onto an item the guide has, including
    // a re-run that writes the same numbers again (a rating is a reading
    // taken on a date; re-taking it is work done, not work skipped).
    // Skipped counts only ids this guide does not have.
    if (s.ratingsApplied) parts.push(s.ratingsApplied + ' ratings applied');
    if (s.ratingsSkipped) parts.push(s.ratingsSkipped + ' ratings skipped');
    return parts.length ? parts.join(', ') : 'nothing new';
  }

  // The copy / download / clipboard-fallback trio, shared by every modal that
  // hands a built prompt to the traveler. Same stub-friendly pattern Build my
  // prompt uses: try the async clipboard, and when it is unreachable (an
  // insecure origin, a denied permission, an old engine) drop a read-only
  // textarea above the message and select its contents, so there is always a
  // way to get the prompt out of the app. `box` is the modal body, `msg` the
  // status line already appended to it.
  function makePromptOut(box, msg) {
    var fallbackTa = null;
    function showFallback(text) {
      if (!fallbackTa) {
        fallbackTa = document.createElement('textarea');
        fallbackTa.className = 'promptout';
        fallbackTa.readOnly = true;
        fallbackTa.setAttribute('aria-label', 'Generated prompt');
        box.insertBefore(fallbackTa, msg);
      }
      fallbackTa.value = text;
      msg.textContent = 'Could not reach the clipboard. The prompt is selected above: copy it, ' +
        'paste it into Claude or ChatGPT, then paste the JSON it returns below.';
      try { fallbackTa.focus(); fallbackTa.select(); } catch (e) {}
    }
    return {
      fallback: showFallback,
      copy: function (text) {
        var wrote = null;
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) wrote = navigator.clipboard.writeText(text);
        } catch (e) { wrote = null; }
        if (wrote && typeof wrote.then === 'function') {
          wrote.then(function () {
            msg.textContent = 'Copied. Paste it into Claude or ChatGPT, then paste the JSON it returns below.';
          }, function () { showFallback(text); });
        } else {
          showFallback(text);
        }
      },
      download: function (text, filename) {
        var blob = new Blob([text], { type: 'text/markdown' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        var freeUrl = a.href;
        setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
        msg.textContent = 'Downloaded ' + filename + '. Paste it into Claude or ChatGPT, ' +
          'then paste the JSON it returns below.';
      }
    };
  }

  function openEnrichModal() {
    if (!activeId || !has(store.cities, activeId)) return;
    var m = modalShell('Enrich ' + store.cities[activeId].city.name);
    m.box.appendChild(el('p', 'diff', 'Build a prompt for a second pass over this city, run it in your AI, ' +
      'and paste the result back. New items are added and nothing you have already planned is disturbed.'));

    var msg = el('div', 'diff', '');
    var out = makePromptOut(m.box, msg);
    var copyOut = out.copy, downloadOut = out.download;
    // The prompts describe the city as it stands right now, override included,
    // which is the same data the merge will run against.
    function currentData() {
      var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
      return CityOps.effectiveData(store.cities[activeId], st);
    }
    function build(kind) {
      var tpl = promptTemplateText();
      if (!tpl) {
        msg.textContent = 'This build has no prompt template embedded. Use PROMPT.md from the repo.';
        return null;
      }
      try {
        if (kind === 'intel') return CityOps.promptKit.buildIntelPassPrompt(tpl, currentData());
        if (kind === 'ratings') return CityOps.promptKit.buildRatingsPassPrompt(tpl, currentData());
        return CityOps.promptKit.buildInterestsDeltaPrompt(tpl, currentData(), store.profile);
      } catch (e) {
        msg.textContent = e.message;
        return null;
      }
    }
    // ---- Run with Claude (Phase 3, feature 6): same prompt, called in-app ----
    // Deliberately reuses the paste-and-Apply path rather than writing a
    // second apply codepath: the result fills the SAME textarea the paste
    // flow reads, and the traveler still clicks the same Apply button below.
    // That keeps exactly one tested place that ever calls mergeDelta and
    // writes the merged city, and it means a delta from Claude gets the same
    // "review the summary before it lands" moment a pasted delta always got.
    function runWithClaude(kind, btn) {
      var apiKey = loadApiKey();
      if (!apiKey) { msg.textContent = 'No Claude API key saved. Add one in Profile first.'; return; }
      var text = build(kind);
      if (text === null) return;
      var origLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Running...';
      msg.textContent = 'Starting...';
      callClaudeStream(text, apiKey, function (p) {
        msg.textContent = (p.kind === 'thinking' ? 'Thinking... ' : 'Writing... ') +
          p.totalChars + ' characters so far.';
      }).then(function (resultText) {
        btn.disabled = false;
        btn.textContent = origLabel;
        var block = CityOps.extractJsonBlock(resultText);
        if (block === null) { msg.textContent = CityOps.RETRY_INSTRUCTION; return; }
        var parsed;
        try { parsed = JSON.parse(block); }
        catch (e) { msg.textContent = 'Claude\'s response was not valid JSON: ' + e.message; return; }
        var res = CityOps.mergeDelta(currentData(), parsed);
        if (!res.data) { msg.textContent = 'Nothing was applied:\n' + res.errors.join('\n'); return; }
        // Preview only: fill the textarea and report the counts, same as a
        // paste would look right before the traveler hits Apply. Nothing is
        // written until that explicit click.
        ta.value = JSON.stringify(parsed, null, 2);
        msg.textContent = 'Claude proposes: ' + enrichSummaryText(res.summary) + '. Review below, then Apply.';
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = origLabel;
        msg.textContent = 'Claude API error: ' + e.message;
      });
    }
    // `noun` names the pass on its own button. The three blocks used to carry
    // three identical "Copy prompt" buttons, so on a phone (where the heading
    // that told them apart has usually scrolled off) picking the ratings pass
    // meant counting rows. Each button now says which prompt it copies.
    function promptRow(kind, filename, disabledReason, noun) {
      var row = el('div', 'mrow');
      var copy = el('button', 'ctl', 'Copy ' + noun + ' prompt');
      copy.type = 'button';
      var dl = el('button', 'ctl', 'Download .md');
      dl.type = 'button';
      if (disabledReason) {
        // Never offer a control that cannot succeed: disable it and say why.
        copy.disabled = dl.disabled = true;
        copy.title = dl.title = disabledReason;
      } else {
        copy.onclick = function () { var t = build(kind); if (t !== null) copyOut(t); };
        dl.onclick = function () { var t = build(kind); if (t !== null) downloadOut(t, filename); };
      }
      row.appendChild(copy);
      row.appendChild(dl);
      // Only offered once a Claude key is saved; the no-key case keeps the
      // copy/paste path as the only option, exactly as before.
      if (!disabledReason && loadApiKey()) {
        var run = el('button', 'ctl to-done', 'Run with Claude');
        run.type = 'button';
        run.onclick = function () { runWithClaude(kind, run); };
        row.appendChild(run);
      }
      return row;
    }

    // Each pass gets a heading in the same uppercase-muted idiom the More
    // sheet's group labels use, so the three blocks read as three choices
    // rather than one long paragraph with buttons in it.
    var profileEmpty = CityOps.profile.isEmpty(store.profile);
    m.box.appendChild(el('div', 'sheet-grouplabel enrich-h', 'Interests delta'));
    m.box.appendChild(el('p', 'diff', 'New places in this city that match your interest profile, ' +
      'in their own section, on top of what is already here.'));
    var irow = promptRow('interests', 'interests-delta.md',
      profileEmpty ? 'Add interests in Profile first' : null, 'interests');
    if (profileEmpty) {
      var goProfile = el('button', 'ctl', 'Open Profile');
      goProfile.type = 'button';
      goProfile.onclick = function () { m.close(); openProfileModal(); };
      irow.appendChild(goProfile);
    }
    m.box.appendChild(irow);

    m.box.appendChild(el('div', 'sheet-grouplabel enrich-h', 'Intel pass'));
    m.box.appendChild(el('p', 'diff', 'What to actually order or do at the places this guide ' +
      'already holds, from what reviewers say repeatedly.'));
    m.box.appendChild(promptRow('intel', 'intel-pass.md', null, 'intel'));

    // Third builder: the numbers go stale in a way the rest of a guide does
    // not, so this is the one pass worth re-running on a guide that is
    // otherwise finished. It touches nothing but `rating`.
    m.box.appendChild(el('div', 'sheet-grouplabel enrich-h', 'Ratings refresh'));
    m.box.appendChild(el('p', 'diff', 'Current Google Maps stars and review counts ' +
      'for the places still in play (plan and backup), as a badge on each card.'));
    m.box.appendChild(promptRow('ratings', 'ratings-refresh.md', null, 'ratings'));

    m.box.appendChild(el('p', 'diff', 'Paste what your AI returns here. It is a partial payload: only new items, ' +
      'intel and ratings, never a whole guide.'));
    var ta = document.createElement('textarea');
    ta.setAttribute('aria-label', 'Delta JSON from your AI');
    m.box.appendChild(ta);
    m.box.appendChild(msg);

    var row = el('div', 'mrow');
    var apply = el('button', 'ctl to-done', 'Apply');
    apply.type = 'button';
    apply.onclick = function () {
      var parsed;
      try { parsed = JSON.parse(ta.value); }
      catch (e) { msg.textContent = 'That is not valid JSON: ' + e.message; return; }
      var res = CityOps.mergeDelta(currentData(), parsed);
      if (!res.data) {
        msg.textContent = 'Nothing was applied:\n' + res.errors.join('\n');
        return;
      }
      m.close();
      commitCityData(res.data);
      showSyncNotice('Enriched: ' + enrichSummaryText(res.summary) + '.');
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row.appendChild(apply);
    row.appendChild(cancel);
    m.box.appendChild(row);

    // 4a: the one difference between the two transports that the traveler
    // cannot see and needs to know. No in-app call declares a web-search tool,
    // so Run with Claude answers out of the model's own training data, while a
    // chat session he pastes into can actually go and look the place up. The
    // prompts ask for current hours, prices and ratings either way.
    //
    // The sentence that used to close this modal, "In-app research is planned
    // for a future version", stopped being true when Run with Claude shipped;
    // it sat directly beneath three working ones. Removed 2026-09-01.
    m.box.appendChild(el('p', 'diff', 'Run with Claude answers from the model\'s own knowledge: ' +
      'it has no web access, so hours, prices and ratings are recalled, not checked. ' +
      'Copy prompt into Claude.ai or ChatGPT if you want it to search the web first.'));
  }

  // ---- Ask Claude about ONE place ----
  // The other half of the owner's dinner scenario: the place is in the guide,
  // now find out whether it beats what was already there. Opened from the ✨
  // on any card the engine judges un-researched (see placeNeedsResearch),
  // which every hand-added place is.
  //
  // Two transports, ONE prompt, and one merge door:
  //   - Run with Claude, when a key is saved, via the same callClaudeStream
  //     the Enrich passes use. The reply is parsed, previewed as a count, and
  //     lands in the SAME textarea the paste flow reads.
  //   - Copy prompt / Download .md when there is no key, which is the only
  //     path a signed-out traveler has and is never hidden.
  // Either way the traveler presses one Apply, which runs mergeDelta and
  // commitCityData exactly like Enrich's Apply does. There is no second place
  // in this app that writes a delta into a city.
  function openAskPlaceModal(itemId) {
    // Neither of these should be reachable: the ✨ is only drawn on a card of
    // the active city. They are here because a tap that opens nothing and
    // says nothing is the one outcome a control is never allowed to have, and
    // an unexplained dead button is worse than an odd sentence.
    function nope(msg) {
      var n = document.getElementById('notice');
      if (n) n.textContent = msg;
    }
    if (!activeId || !has(store.cities, activeId)) {
      nope('No city is open, so there is nothing to check.');
      return;
    }
    function currentData() {
      var st = CityOps.liveState() || CityOps.makeStore(activeId, LS).load();
      return CityOps.effectiveData(store.cities[activeId], st);
    }
    var data = currentData();
    var item = null;
    (data.items || []).forEach(function (x) { if (x && x.id === itemId) item = x; });
    if (!item) {
      nope('That place is no longer in this guide, so there is nothing to check.');
      return;
    }
    var liveSt = CityOps.liveState();
    var shownName = liveSt ? CityOps.effectiveName(item, liveSt) : item.name;
    var siblings = (data.items || []).filter(function (x) {
      return x && x.id !== item.id && x.section === item.section;
    }).length;

    var m = modalShell('Check ' + shownName);
    m.box.appendChild(el('p', 'diff', siblings
      ? ('Claude looks this place up and ranks it against the ' + siblings +
        ' other ' + (siblings === 1 ? 'place' : 'places') + ' already in this section. ' +
        'It returns a rating and a short verdict, and touches nothing else.')
      : ('Claude looks this place up and returns a rating and a short verdict. ' +
        'There is nothing else in this section yet, so there is nothing to rank it against.')));

    var msg = el('div', 'diff', '');
    var out = makePromptOut(m.box, msg);

    function build() {
      var tpl = promptTemplateText();
      if (!tpl) {
        msg.textContent = 'This build has no prompt template embedded. Use PROMPT.md from the repo.';
        return null;
      }
      try {
        return CityOps.promptKit.buildPlacePassPrompt(tpl, currentData(), item, CityOps.liveState());
      } catch (e) {
        msg.textContent = e.message;
        return null;
      }
    }

    var ta = document.createElement('textarea');
    ta.setAttribute('aria-label', 'Delta JSON from your AI');

    var row = el('div', 'mrow');
    if (loadApiKey()) {
      var run = el('button', 'ctl to-done', 'Ask Claude');
      run.type = 'button';
      run.onclick = function () {
        var text = build();
        if (text === null) return;
        var orig = run.textContent;
        run.disabled = true;
        run.textContent = 'Asking...';
        msg.textContent = 'Starting...';
        callClaudeStream(text, loadApiKey(), function (p) {
          msg.textContent = (p.kind === 'thinking' ? 'Thinking... ' : 'Writing... ') +
            p.totalChars + ' characters so far.';
        }).then(function (resultText) {
          run.disabled = false;
          run.textContent = orig;
          var block = CityOps.extractJsonBlock(resultText);
          if (block === null) { msg.textContent = CityOps.RETRY_INSTRUCTION; return; }
          var parsed;
          try { parsed = JSON.parse(block); }
          catch (e) { msg.textContent = 'Claude\'s response was not valid JSON: ' + e.message; return; }
          var res = CityOps.mergeDelta(currentData(), parsed);
          if (!res.data) { msg.textContent = 'Nothing was applied:\n' + res.errors.join('\n'); return; }
          ta.value = JSON.stringify(parsed, null, 2);
          msg.textContent = 'Claude proposes: ' + enrichSummaryText(res.summary) + '. Review below, then Apply.';
        }).catch(function (e) {
          run.disabled = false;
          run.textContent = orig;
          msg.textContent = 'Claude API error: ' + e.message;
        });
      };
      row.appendChild(run);
    }
    var copy = el('button', 'ctl', 'Copy prompt');
    copy.type = 'button';
    copy.onclick = function () { var t = build(); if (t !== null) out.copy(t); };
    row.appendChild(copy);
    var dl = el('button', 'ctl', 'Download .md');
    dl.type = 'button';
    dl.onclick = function () {
      var t = build();
      if (t !== null) out.download(t, CityOps.slug(shownName) + '-check.md');
    };
    row.appendChild(dl);
    m.box.appendChild(row);

    if (!loadApiKey()) {
      m.box.appendChild(el('p', 'diff', 'No Claude API key is saved on this device, so the prompt ' +
        'goes to your own chat and the answer comes back through the box below. ' +
        'Save a key in Profile to do it in one tap instead.'));
    }
    m.box.appendChild(el('p', 'diff', 'Paste what your AI returns here. It is a partial payload: ' +
      'a rating and an intel block for this one place.'));
    m.box.appendChild(ta);
    m.box.appendChild(msg);

    var row2 = el('div', 'mrow');
    var apply = el('button', 'ctl to-done', 'Apply');
    apply.type = 'button';
    apply.onclick = function () {
      var parsed;
      try { parsed = JSON.parse(ta.value); }
      catch (e) { msg.textContent = 'That is not valid JSON: ' + e.message; return; }
      var res = CityOps.mergeDelta(currentData(), parsed);
      if (!res.data) { msg.textContent = 'Nothing was applied:\n' + res.errors.join('\n'); return; }
      m.close();
      commitCityData(res.data);
      showSyncNotice('Enriched: ' + enrichSummaryText(res.summary) + '.');
    };
    var cancel = el('button', 'ctl', 'Cancel');
    cancel.type = 'button';
    cancel.onclick = m.close;
    row2.appendChild(apply);
    row2.appendChild(cancel);
    m.box.appendChild(row2);
  }

  // Phase 4: rows appended to the engine's More action sheet (app context
  // only), replacing the old toolbarExtras + the standalone Export-guide
  // button + Remove city's old home inside the city-switcher panel. Returns
  // [{label, desc, icon, group, order, onClick, cls}]; the engine renders each
  // as a sheet row inside the cluster `group` names.
  // `group` and `order` place each row inside the engine's three clusters
  // (see MORE_GROUPS); `desc` is the one muted line under the label. Enrich
  // leads its cluster because it is the row a traveler opens repeatedly
  // mid-trip; Remove city sits last in the last cluster, where a thumb
  // reaching for anything else never passes over it.
  function moreActions() {
    var actions = [];
    actions.push({ label: 'Enrich', desc: 'Add AI research without touching your progress',
      icon: '✨', group: 'work', order: 10, onClick: openEnrichModal });
    actions.push({ label: 'Export guide', desc: 'Standalone offline HTML file',
      icon: '📄', group: 'share', order: 20, onClick: exportStandalone });
    // Phase 2: Edit reopens the Add/Edit city form for the ACTIVE city,
    // pre-filled with its saved form values (see openAddModal's editCityId
    // param), so a traveler can tweak the header and regenerate.
    if (activeId && has(store.cities, activeId)) {
      actions.push({ label: 'Edit city', desc: 'Name, dates, lodging and trip notes',
        icon: '✏️', group: 'city', order: 10,
        onClick: function () { openAddModal(activeId); } });
    }
    // Phase 4, item 7: Remove city moves here from the city-switcher panel,
    // keeping its existing type-to-confirm modal unchanged.
    if (activeId && has(store.cities, activeId)) {
      // The description follows the fact: since 2026-08-27 a removal is a
      // fact about the ACCOUNT (it deletes the rows and records a tombstone),
      // so "its progress here" would now be an understatement of what the tap
      // does, on the one control where that matters most.
      actions.push({ label: 'Remove city',
        desc: session ? 'Deletes this city everywhere you are signed in'
                      : 'Deletes this city and its progress here',
        icon: '🗑️', group: 'city', order: 20, onClick: openRemoveModal, cls: 'danger' });
    }
    return actions;
  }

  // ---- Phase 2: in-app Claude generation (transport only; no SDK) ----
  // A single non-streaming-looking call that is actually stream:true under
  // the hood: the guides PROMPT.md asks for are long, and a non-streaming
  // request this size risks a proxy timeout with nothing to show for the
  // wait. Parsed by hand since this is a no-build static page.
  var CLAUDE_MODEL = 'claude-opus-4-8';
  var CLAUDE_MAX_TOKENS = 32000;

  // Resolves to the full assistant text (the `text` content block only; a
  // `thinking` block never contributes to this, since that block is
  // reasoning scratch space, not the fenced JSON the caller parses next).
  // `onProgress({kind: 'thinking'|'text', totalChars})` fires on every delta
  // so the caller can show live progress. Rejects with a plain Error whose
  // message is safe to show as-is.
  //
  // `signal` is optional and is the only way out of a run that is going to
  // take minutes: aborting it rejects this promise (with an AbortError the
  // caller distinguishes from a real failure) and stops the read loop, so a
  // cancelled generation costs nothing further. Omitted by every caller that
  // has no cancel control, and by the unit tests' mocked fetch.
  function callClaudeStream(prompt, apiKey, onProgress, signal) {
    return fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      signal: signal || undefined,
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json'
      },
      body: JSON.stringify({
        model: CLAUDE_MODEL,
        max_tokens: CLAUDE_MAX_TOKENS,
        thinking: { type: 'adaptive' },
        stream: true,
        messages: [{ role: 'user', content: prompt }]
      })
    }).then(function (resp) {
      if (!resp.ok || !resp.body) {
        return resp.text().catch(function () { return ''; }).then(function (bodyText) {
          var detail = bodyText;
          try {
            var j = JSON.parse(bodyText);
            if (j && j.error && j.error.message) detail = j.error.message;
          } catch (e) { /* body was not JSON; show it raw, trimmed */ }
          throw new Error('Claude API returned ' + resp.status +
            (detail ? ': ' + String(detail).slice(0, 300) : ''));
        });
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = '';
      var finalText = '';
      var thinkingChars = 0;

      // One SSE event is "event: ...\ndata: {...}" (possibly several data:
      // lines, though Anthropic's stream sends one); only the JSON payload on
      // the data: line matters here.
      function handleEvent(rawEvent) {
        var data = null;
        rawEvent.split('\n').forEach(function (l) {
          if (l.indexOf('data:') === 0) data = l.slice(5).replace(/^\s+/, '');
        });
        if (!data) return;
        var payload;
        try { payload = JSON.parse(data); } catch (e) { return; }
        if (payload.type === 'error') {
          throw new Error((payload.error && payload.error.message) || 'Claude API stream error');
        }
        if (payload.type === 'content_block_delta' && payload.delta) {
          if (payload.delta.type === 'text_delta') {
            finalText += payload.delta.text;
            if (onProgress) onProgress({ kind: 'text', totalChars: finalText.length });
          } else if (payload.delta.type === 'thinking_delta') {
            thinkingChars += (payload.delta.thinking || '').length;
            if (onProgress) onProgress({ kind: 'thinking', totalChars: thinkingChars });
          }
        }
      }

      function pump() {
        return reader.read().then(function (r) {
          if (r.done) {
            if (buf.trim()) handleEvent(buf); // a final event with no trailing blank line
            return finalText;
          }
          buf += decoder.decode(r.value, { stream: true });
          var idx;
          while ((idx = buf.indexOf('\n\n')) !== -1) {
            var rawEvent = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            if (rawEvent.trim()) handleEvent(rawEvent);
          }
          return pump();
        });
      }
      return pump();
    });
  }

  // editCityId: when set to a known city id, the form pre-fills from that
  // city's data plus its saved generation metadata (see GENMETA_KEY above),
  // and generating/pasting/blanking with the SAME id silently replaces it
  // instead of asking Replace/Keep both (that prompt is for a genuine
  // collision with an unrelated city, not for the edit you just opened). If
  // the name/dates change enough to derive a different id, it falls back to
  // the normal add flow and the original city is left alone.
  // `opts.autoPlan`: this modal was opened by the #plan= flow, not by a tap on
  // + Add city. The city is already scaffolded and already active behind the
  // modal; what is left is filling it. So the modal says so, and starts
  // generating (or, with no key saved, builds the prompt) by itself instead
  // of waiting for a tap the traveler has already made once on the trip page.
  function openAddModal(editCityId, opts) {
    var isEdit = !!(editCityId && has(store.cities, editCityId));
    var editCity = isEdit ? store.cities[editCityId] : null;
    var meta = isEdit ? (loadGenMeta()[editCityId] || {}) : {};
    var autoPlan = !!(opts && opts.autoPlan) && isEdit;

    var host = document.getElementById('modal');
    host.innerHTML = '';
    var wrap = el('div', 'modal-wrap');
    var box = el('div', 'modal');
    box.appendChild(el('h3', null, autoPlan ? ('Planning ' + editCity.city.name)
      : isEdit ? ('Edit ' + editCity.city.name) : 'Add a city'));
    box.appendChild(el('p', 'diff', autoPlan
      ? (editCity.city.name + ' is now in your cities, with these dates and nothing in it yet. ' +
         'Filling it starts below; you can close this at any point and the city stays.')
      : isEdit
      ? 'Change anything below, then regenerate, or paste replacement city JSON.'
      : 'Start blank now and fill it with generated data later, generate it here with Claude, or paste ready-made city JSON below.'));
    var whereItGoes = (session && session.access_token)
      ? 'New cities save to your account and sync to your other devices.'
      : 'Saved in this browser. Sign in to sync (Profile) to carry cities across devices.';

    var brow = el('div', 'mrow');
    var bn = document.createElement('input');
    bn.type = 'text'; bn.className = 'date-field'; bn.placeholder = 'City name';
    var bc = document.createElement('input');
    bc.type = 'text'; bc.className = 'date-field blank-cc'; bc.placeholder = 'Country'; bc.maxLength = 3;
    brow.appendChild(bn); brow.appendChild(bc);
    box.appendChild(brow);
    var drow = el('div', 'mrow');
    var bf = document.createElement('input'); bf.type = 'date'; bf.className = 'date-field';
    var bt2 = document.createElement('input'); bt2.type = 'date'; bt2.className = 'date-field';
    drow.appendChild(el('span', 'diff', 'From')); drow.appendChild(bf);
    drow.appendChild(el('span', 'diff', 'To')); drow.appendChild(bt2);
    box.appendChild(drow);
    // Optional header fields: they only exist to fill the prompt's Trip details
    // block, so a blank city ignores them entirely.
    function optField(ph) {
      var i = document.createElement('input');
      i.type = 'text'; i.className = 'date-field'; i.placeholder = ph;
      i.setAttribute('aria-label', ph);
      return i;
    }
    var hrow = el('div', 'hdr-row');
    var bacc = optField('Accommodation name and address');
    var barr = optField('Arrival transport');
    var bdep = optField('Departure transport');
    hrow.appendChild(bacc); hrow.appendChild(barr); hrow.appendChild(bdep);
    box.appendChild(hrow);
    box.appendChild(el('p', 'diff', 'Trip notes: diet, mobility, budget, who is along, anything else that changes what a good pick means this time.'));
    var bnotes = document.createElement('textarea');
    bnotes.className = 'notes';
    bnotes.setAttribute('aria-label', 'Trip notes');
    box.appendChild(bnotes);

    if (isEdit) {
      bn.value = editCity.city.name;
      bc.value = meta.country || editCity.city.country || '';
      bf.value = editCity.city.dates.from;
      bt2.value = editCity.city.dates.to;
      bacc.value = meta.accommodation || (editCity.city.accommodation && editCity.city.accommodation.name) || '';
      barr.value = meta.arrival || '';
      bdep.value = meta.departure || '';
      bnotes.value = meta.notes || '';
    }

    var bmsg = el('div', 'diff', '');
    box.appendChild(bmsg);
    var brow2 = el('div', 'mrow');
    var bcreate = el('button', 'ctl to-done', isEdit ? 'Reset to blank' : 'Create blank city');
    bcreate.type = 'button';
    box.appendChild(brow2);
    brow2.appendChild(bcreate);

    // Build my prompt: PROMPT.md with this city's header, trip notes and the
    // interest profile filled in, copied out for the traveler's own AI. No
    // network, no AI call from the app: the traveler pastes the JSON back
    // into this modal. (Generate with Claude, below, is the in-app version of
    // this same prompt.)
    var promptTa = null;
    function showPromptFallback(text) {
      if (!promptTa) {
        promptTa = document.createElement('textarea');
        promptTa.className = 'promptout';
        promptTa.readOnly = true;
        promptTa.setAttribute('aria-label', 'Generated prompt');
        box.insertBefore(promptTa, bmsg);
      }
      promptTa.value = text;
      bmsg.textContent = 'Could not reach the clipboard. The prompt is selected above: copy it, ' +
        'paste it into Claude or ChatGPT, then paste the JSON it returns below.';
      try { promptTa.focus(); promptTa.select(); } catch (e) {}
    }
    function formHeader() {
      return {
        name: trim(bn.value), country: trim(bc.value), from: bf.value, to: bt2.value,
        accommodation: trim(bacc.value), arrival: trim(barr.value), departure: trim(bdep.value),
        notes: trim(bnotes.value)
      };
    }
    function buildPromptText() {
      if (!trim(bn.value) || !bf.value || !bt2.value) {
        bmsg.textContent = 'Fill city name and dates first';
        return null;
      }
      var tpl = promptTemplateText();
      if (!tpl) {
        bmsg.textContent = 'This build has no prompt template embedded. Use PROMPT.md from the repo.';
        return null;
      }
      return CityOps.promptKit.buildCityPrompt(tpl, formHeader(), store.profile);
    }
    var bprompt = el('button', 'ctl', 'Build my prompt');
    bprompt.type = 'button';
    bprompt.onclick = function () {
      var text = buildPromptText();
      if (text === null) return;
      var wrote = null;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) wrote = navigator.clipboard.writeText(text);
      } catch (e) { wrote = null; }
      if (wrote && typeof wrote.then === 'function') {
        wrote.then(function () {
          bmsg.textContent = 'Copied. Paste into Claude or ChatGPT, then paste the JSON it returns below.';
        }, function () { showPromptFallback(text); });
      } else {
        showPromptFallback(text);
      }
    };
    brow2.appendChild(bprompt);
    var bdl = el('button', 'ctl', 'Download prompt.md');
    bdl.type = 'button';
    bdl.onclick = function () {
      var text = buildPromptText();
      if (text === null) return;
      var blob = new Blob([text], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'prompt.md';
      document.body.appendChild(a);
      a.click();
      a.remove();
      var freeUrl = a.href;
      setTimeout(function () { URL.revokeObjectURL(freeUrl); }, 4000);
      bmsg.textContent = 'Downloaded prompt.md. Paste it into Claude or ChatGPT, then paste the JSON it returns below.';
    };
    brow2.appendChild(bdl);
    box.appendChild(el('p', 'diff', CityOps.profile.isEmpty(store.profile)
      ? 'Build my prompt writes PROMPT.md with this header filled in. Add interests in Profile (top of the app) and it will ask your AI for a matching ninth section too.'
      : 'Build my prompt writes PROMPT.md with this header and your interest profile filled in.'));

    // ---- Generate with Claude (Phase 2): the same prompt, called in-app ----
    var apiKey = loadApiKey();
    box.appendChild(el('p', 'diff', apiKey
      ? 'Generate with Claude runs the same prompt against your own Claude API key, right here, and adds the result to your cities when it finishes.'
      : 'Generate with Claude needs an API key first. Add one in Profile (top of the app): it is stored on ' +
        'this device, and in your own account while you are signed in.'));
    var genRow = el('div', 'mrow');
    var genBtn = el('button', 'ctl to-done', 'Generate with Claude');
    genBtn.type = 'button';
    if (!apiKey) {
      genBtn.disabled = true;
      genBtn.title = 'Add a Claude API key in Profile first';
    }
    genRow.appendChild(genBtn);
    if (!apiKey) {
      var goProfile = el('button', 'ctl', 'Open Profile');
      goProfile.type = 'button';
      goProfile.onclick = function () { close(); openProfileModal(); };
      genRow.appendChild(goProfile);
    }
    box.appendChild(genRow);
    var genMsg = el('div', 'diff', '');
    box.appendChild(genMsg);

    // The in-flight run's abort handle, or null when nothing is running. One
    // at a time by construction: genBtn is disabled while a run is live, and
    // Cancel is the only other control in the row.
    var genAbort = null;
    function setGenerateRow(extraButtons) {
      genRow.innerHTML = '';
      genRow.appendChild(genBtn);
      (extraButtons || []).forEach(function (b) { genRow.appendChild(b); });
    }
    function setGenerating(on) {
      genBtn.disabled = on || !loadApiKey();
      genBtn.textContent = on ? 'Researching...' : 'Generate with Claude';
    }
    // A run this long needs a way out that is not "close the tab". Aborting
    // the fetch stops the stream; the scaffold city is untouched either way,
    // because nothing is written until a reply has parsed and validated.
    function cancelButton() {
      var c = el('button', 'ctl', 'Cancel');
      c.type = 'button';
      c.onclick = function () {
        if (genAbort) { try { genAbort.abort(); } catch (e) {} }
      };
      return c;
    }
    function showRetry(afterMsg) {
      genMsg.textContent = afterMsg;
      var retry = el('button', 'ctl', 'Retry');
      retry.type = 'button';
      retry.onclick = runGenerate;
      setGenerateRow([retry]);
    }
    function offerDownload(data) {
      var dl = el('button', 'ctl', 'Download cities/' + CityOps.slug(data.city.name) + '.json');
      dl.type = 'button';
      dl.onclick = function () {
        var canonical = JSON.stringify(data, null, 2) + '\n';
        var blob = new Blob([canonical], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = CityOps.slug(data.city.name) + '.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        var freeUrl = a.href;
